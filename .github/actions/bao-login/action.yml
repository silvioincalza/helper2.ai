# Logs in to OpenBao with the job's GitHub OIDC token (auth method `jwt`) and exports BAO_ADDR and
# BAO_TOKEN for later steps, so `bao kv get` in the Makefile works unchanged. Nothing long-lived is
# stored in GitHub. The calling job needs `permissions: id-token: write`.
name: bao-login
description: OpenBao login from the GitHub Actions OIDC token
inputs:
  role:
    description: OpenBao jwt role, bound to this repo and the job's ref or environment
    required: true
  addr:
    description: OpenBao address
    required: true
  mount:
    description: jwt auth mount path
    default: helper2/jwt
  audience:
    description: audience requested for the OIDC token, must match the role's bound_audiences
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BAO_ADDR: ${{ inputs.addr }}
        ROLE: ${{ inputs.role }}
        MOUNT: ${{ inputs.mount }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        [ -n "$BAO_ADDR" ] && [ -n "$AUDIENCE" ] || { echo "::error::set the BAO_ADDR and BAO_AUDIENCE repo variables"; exit 1; }
        jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
        token=$(bao write -field=token "auth/$MOUNT/login" role="$ROLE" jwt="$jwt")
        echo "::add-mask::$token"
        { echo "BAO_ADDR=$BAO_ADDR"; echo "BAO_TOKEN=$token"; } >> "$GITHUB_ENV"
