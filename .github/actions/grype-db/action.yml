# The Grype vulnerability database, cached for the day (ADR 0033): one download per day across jobs, a fresh one the
# next day. The download is retried once; Grype then runs with auto-update off, so a scan never downloads it again.
name: grype-db
description: Restore or download today's Grype database
inputs:
  cache:
    description: use the day's cache (false = always a fresh download)
    default: 'true'
runs:
  using: composite
  steps:
    - id: day
      shell: bash
      run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/grype/db
        key: grype-db-${{ steps.day.outputs.day }}
    - shell: bash
      run: |
        set -euo pipefail
        grype db update || { echo "Grype database download failed, retrying in 30 s"; sleep 30; grype db update; }
        grype db status
        echo "GRYPE_DB_AUTO_UPDATE=false" >> "$GITHUB_ENV"
