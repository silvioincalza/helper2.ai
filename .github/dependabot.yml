version: 2
updates:
  - package-ecosystem: gradle
    directories: [/backend, /backend/build-logic]
    schedule: { interval: weekly, day: monday }
    groups:
      gradle-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/deploy, /deploy/postgres, /deploy/helm/helper2]
    schedule: { interval: weekly, day: monday }
    groups:
      app-images: { patterns: ["*eclipse-temurin*", "*node*"] }
    ignore:
      - dependency-name: "*postgres"
        update-types: [version-update:semver-major]
