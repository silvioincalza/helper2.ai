# Weekly update PRs; minor and patch bumps grouped per ecosystem, majors one PR each.
version: 2
updates:
  - package-ecosystem: gradle
    # The backend projects, and the Gradle plugins of its convention plugins.
    directories: [/backend, /backend/build-logic]
    schedule: { interval: weekly, day: monday }
    groups:
      gradle-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    ignore:
      # Held back until the lint plugins support them (docs/roadmap.md, Frontend): typescript-eslint
      # needs TypeScript <6.1, eslint-plugin-jsx-a11y needs ESLint <=9, and @eslint/js follows ESLint.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]

  # Actions are pinned to commit SHAs; Dependabot moves the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  # Base images of deploy/Dockerfile, deploy/backoffice.Dockerfile, deploy/web.Dockerfile and deploy/postgres/Dockerfile,
  # and the images in the chart's values.yaml (Redis, rclone), all pinned by digest (ADR 0046). The web and the back
  # office image build with the same Node image, the two apps run on the same JDK and JRE: one update PR changes every
  # file that names it. nginx (the web image's runtime) is its own PR. A change under deploy/postgres also needs a new
  # postgres.image.tag in the chart's values.yaml (CI fails the PR until it has one).
  - package-ecosystem: docker
    directories: [/deploy, /deploy/postgres, /deploy/helm/helper2]
    schedule: { interval: weekly, day: monday }
    groups:
      # The web, the public and the back office image move together (ADR 0069).
      app-images: { patterns: ["*eclipse-temurin*", "*node*"] }
    ignore:
      # A Postgres major needs pg_upgrade or dump/restore of the data directory, never a base-image bump.
      - dependency-name: "*postgres"
        update-types: [version-update:semver-major]
