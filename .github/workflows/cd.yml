# CD: every push to main runs CI, builds the image once and deploys staging. Prod is not deployed from
# here: a release tag vX.Y.Z does that (release.yml). Manual runs redeploy or roll back a given tag.
# No pull_request trigger here: self-hosted jobs must never run fork code (the repo is public).
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: environment to deploy
        type: choice
        options: [staging, prod]
        default: prod
      tag:
        description: 12-char commit already built. Empty = HEAD of main for staging, what staging runs for prod
        type: string
        default: ''
      rollback:
        description: the tag is older than what the environment runs, on purpose
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: [self-hosted, incalzame]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: image-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bao-login
        with:
          addr: ${{ vars.BAO_ADDR }}
          audience: ${{ vars.BAO_AUDIENCE }}
          role: deploy
      # Postgres + pgvector (ADR 0012): built and pushed only when postgres.image.tag is not in Harbor yet.
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
        run: make -C deploy/k8s postgres-image ENGINE="$ENGINE"
      # Built from `git archive` of the commit (Makefile), pushed to Harbor as TAG.
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
        run: make -C deploy/k8s image TAG="${GITHUB_SHA::12}" ENGINE="$ENGINE"
      # SBOM of the pushed image (ADR 0046), read from Harbor; release.yml attaches it to the GitHub release.
      - uses: ./.github/actions/install-scanners
      - run: make -C deploy/k8s sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      # The Postgres image of postgres.image.tag, new or not: the daily scan below sees new CVEs in it too.
      - run: make -C deploy/k8s postgres-sbom SBOM="$GITHUB_WORKSPACE/sbom-postgres.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-postgres
          path: sbom-postgres.cdx.json
          retention-days: 90

  # Grype on the SBOMs of the images just pushed (ADR 0046), on a GitHub-hosted runner: it reads the run's artifacts,
  # never Harbor. Report-only until 18 Nov 2026: findings with a fix go to code scanning (image/app, image/postgres
  # on main) and the job log, nothing fails. Not a need of staging yet: the gate adds `--fail-on critical` and that need.
  scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-scanners
        with:
          grype: 'true'
      - uses: ./.github/actions/grype-db
      - name: SBOMs of this run
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-postgres -D sboms
      - name: Vulnerability scan (report-only)
        run: |
          set -euo pipefail
          for image in app postgres; do
            sbom=sboms/sbom.cdx.json; [[ $image == postgres ]] && sbom=sboms/sbom-postgres.cdx.json
            echo "== $image"
            grype "sbom:$sbom" --only-fixed -o table -o "sarif=grype-$image.sarif"
          done
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-app.sarif
          category: image/app
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-postgres.sarif
          category: image/postgres
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

  staging:
    needs: image
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      rollback: ${{ inputs.rollback }}
