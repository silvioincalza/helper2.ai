# CD: every push to main runs all of CI, builds the images of the components that changed, signs them and deploys
# staging. A push to a release/* branch runs CI and does the images only (ADR 0034). Prod is not deployed from here: a
# release tag vX.Y.Z does that (release.yml), under the version tag. Manual runs redeploy or roll back a given tag.
# No pull_request trigger here: self-hosted jobs must never run fork code (the repo is public).
name: cd

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        description: environment to deploy
        type: choice
        options: [staging, prod]
        # Staging by default: a run started without a thought lands where it does no harm. Prod needs the
        # choice and the required reviewer of the prod environment (ADR 0033).
        default: staging
      tag:
        description: 12-char commit already built, or a release version X.Y.Z. Empty = HEAD of main for staging, what staging runs for prod
        type: string
        default: ''
      rollback:
        description: the tag is older than what the environment runs, on purpose
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      full: true

  image:
    needs: ci
    runs-on: [self-hosted, incalzame]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: image-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff against the commit pushed before (changes.sh) needs the history.
          fetch-depth: 0
      # The tools first, so no third-party step runs while the OpenBao token below may sign.
      - uses: ./.github/actions/install-cosign
      - uses: ./.github/actions/install-scanners
      # The token may read ci/harbor and sign with the Transit key (ADR 0033). It is revoked right after the signing
      # step; the uploads come after that.
      - uses: ./.github/actions/bao-login
        with:
          addr: ${{ vars.BAO_ADDR }}
          audience: ${{ vars.BAO_AUDIENCE }}
          role: deploy
      # Postgres + pgvector (ADR 0011): built and pushed only when postgres.image.tag is not in Harbor yet. Its digest
      # goes to the list of what this run pushed, for the signing step.
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
        run: make -C deploy/k8s postgres-image ENGINE="$ENGINE" PUSHED="$RUNNER_TEMP/pushed.txt"
      # Per component (ADR 0033): what changed since the commit pushed before. A new branch (no commit before) or a
      # base not in the clone gives everything.
      - name: Changed components
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          .github/scripts/changes.sh "$BEFORE" HEAD > "$RUNNER_TEMP/changes.env"
          build=$(awk -F= '$2 == "true" && ($1 == "web" || $1 == "public" || $1 == "backoffice") {print $1}' "$RUNNER_TEMP/changes.env" | xargs)
          from=""
          [[ $BEFORE =~ ^0+$ ]] || from=${BEFORE::12}
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "Images built: ${build:-none}; the others carry the signed image of ${from:-nothing} (ADR 0033)" >> "$GITHUB_STEP_SUMMARY"
      # The three images (web, public app, back office; ADR 0032) all get TAG: a changed one is built from `git archive`
      # of the commit and pushed, an unchanged one gets TAG on the image of the commit before (same digest, Harbor API),
      # only when that image is signed by our key. Otherwise it is built. The digests pushed go to pushed.txt.
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
          BUILD: ${{ steps.changes.outputs.build }}
          FROM: ${{ steps.changes.outputs.from }}
        run: make -C deploy/k8s ci-images TAG="${GITHUB_SHA::12}" FROM="$FROM" BUILD="$BUILD" ENGINE="$ENGINE" PUSHED="$RUNNER_TEMP/pushed.txt"
      # SBOM of each image (ADR 0033), read from Harbor; release.yml attaches them to the GitHub release. The Postgres
      # image of postgres.image.tag, new or not: the daily scan sees new CVEs in it too. Uploaded after the revocation.
      - run: |
          set -euo pipefail
          make -C deploy/k8s sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom.cdx.json"
          make -C deploy/k8s backoffice-sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom-backoffice.cdx.json"
          make -C deploy/k8s web-sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom-web.cdx.json"
          make -C deploy/k8s postgres-sbom SBOM="$GITHUB_WORKSPACE/sbom-postgres.cdx.json"
      # Signs exactly the digests this run pushed (pushed.txt), with the OpenBao Transit key; then every image of TAG and
      # the Postgres image must verify. An image pushed before signing fails here: it is signed by hand, never by CD.
      - run: make -C deploy/k8s sign TAG="${GITHUB_SHA::12}" PUSHED="$RUNNER_TEMP/pushed.txt"
      # The token may sign: revoke it now, also when a step above failed, and blank it for the steps below.
      - name: Revoke the OpenBao token
        if: always()
        run: |
          if [ -n "${BAO_TOKEN:-}" ]; then bao token revoke -self >/dev/null || echo "::warning::could not revoke the OpenBao token"; fi
          echo "BAO_TOKEN=" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-backoffice
          path: sbom-backoffice.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom-web.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-postgres
          path: sbom-postgres.cdx.json
          retention-days: 90

  # Grype on the SBOMs of the images just pushed (ADR 0033), on a GitHub-hosted runner: it reads the run's artifacts,
  # never Harbor. Report-only until 18 Nov 2026: findings with a fix go to code scanning (image/app, image/postgres
  # on main, likewise image/backoffice and image/web) and the job log, nothing fails. Not a need of staging yet: the gate adds `--fail-on critical` and that need.
  scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-scanners
        with:
          grype: 'true'
      - uses: ./.github/actions/grype-db
      - name: SBOMs of this run
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-backoffice -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-web -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-postgres -D sboms
      - name: Vulnerability scan (report-only)
        run: |
          set -euo pipefail
          for image in app backoffice web postgres; do
            sbom=sboms/sbom-$image.cdx.json; [[ $image == app ]] && sbom=sboms/sbom.cdx.json
            echo "== $image"
            grype "sbom:$sbom" --only-fixed -o table -o "sarif=grype-$image.sarif"
          done
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-app.sarif
          category: image/app
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-backoffice.sarif
          category: image/backoffice
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-web.sarif
          category: image/web
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-postgres.sarif
          category: image/postgres
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

  # Main only: a release branch never deploys staging (ADR 0034).
  staging:
    if: github.ref == 'refs/heads/main'
    needs: image
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      rollback: ${{ inputs.rollback }}
