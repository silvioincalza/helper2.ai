name: cd

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        description: environment to deploy
        type: choice
        options: [staging, prod]
        default: staging
      tag:
        description: 12-char commit already built, or a release version YYYY.N.P. Empty = HEAD of main for staging, what staging runs for prod
        type: string
        default: ''
      rollback:
        description: the tag is older than what the environment runs, on purpose
        type: boolean
        default: false
      keep-unhealthy:
        description: this one deploy keeps a release that is not healthy after the upgrade (no automatic rollback); the run still fails
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    concurrency:
      group: cd-build-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
    with:
      full: true

  image:
    needs: ci
    runs-on: [self-hosted, incalzame]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cd-build-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-cosign
      - uses: ./.github/actions/install-scanners
      - uses: ./.github/actions/bao-login
        with:
          addr: ${{ vars.BAO_ADDR }}
          audience: ${{ vars.BAO_AUDIENCE }}
          role: deploy
      - id: postgres
        env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
        run: make -C deploy/k8s postgres-image ENGINE="$ENGINE" PUSHED="$RUNNER_TEMP/pushed.txt"
      - name: Sign the Postgres image, also when a newer push cancels the run
        if: always() && steps.postgres.outcome != 'skipped'
        run: make -C deploy/k8s sign-pushed PUSHED="$RUNNER_TEMP/pushed.txt"
      - name: Changed components
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          .github/scripts/changes.sh "$BEFORE" HEAD > "$RUNNER_TEMP/changes.env"
          build=$(awk -F= '$2 == "true" && ($1 == "web" || $1 == "public" || $1 == "backoffice") {print $1}' "$RUNNER_TEMP/changes.env" | xargs)
          from=""
          [[ $BEFORE =~ ^0+$ ]] || from=${BEFORE::12}
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "Images built: ${build:-none}; the others carry the signed image of ${from:-nothing} (ADR 0044)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
          BUILD: ${{ steps.changes.outputs.build }}
          FROM: ${{ steps.changes.outputs.from }}
        run: make -C deploy/k8s ci-images TAG="${GITHUB_SHA::12}" FROM="$FROM" BUILD="$BUILD" ENGINE="$ENGINE" PUSHED="$RUNNER_TEMP/pushed.txt" PREBUILT="$RUNNER_TEMP/prebuilt"
      - run: |
          set -euo pipefail
          make -C deploy/k8s sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom.cdx.json"
          make -C deploy/k8s backoffice-sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom-backoffice.cdx.json"
          make -C deploy/k8s web-sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom-web.cdx.json"
          make -C deploy/k8s postgres-sbom SBOM="$GITHUB_WORKSPACE/sbom-postgres.cdx.json"
      - run: make -C deploy/k8s sign TAG="${GITHUB_SHA::12}" PUSHED="$RUNNER_TEMP/pushed.txt"
      - name: Revoke the OpenBao token
        if: always()
        run: |
          if [ -n "${BAO_TOKEN:-}" ]; then bao token revoke -self >/dev/null || echo "::warning::could not revoke the OpenBao token"; fi
          echo "BAO_TOKEN=" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-backoffice
          path: sbom-backoffice.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-web
          path: sbom-web.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-postgres
          path: sbom-postgres.cdx.json
          retention-days: 90

  scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cd-build-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/install-scanners
        with:
          grype: 'true'
      - uses: ./.github/actions/grype-db
      - name: SBOMs of this run
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-backoffice -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-web -D sboms
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n sbom-postgres -D sboms
      - name: Vulnerability scan (fails on a Critical finding with a fix)
        id: grype
        run: |
          set -euo pipefail
          critical=()
          for image in app backoffice web postgres; do
            sbom=sboms/sbom-$image.cdx.json; [[ $image == app ]] && sbom=sboms/sbom.cdx.json
            echo "== $image"
            status=0
            grype "sbom:$sbom" --only-fixed --fail-on critical -o table -o "sarif=grype-$image.sarif" || status=$?
            case $status in
              0) ;;
              2) critical+=("$image") ;;
              *) echo "::error::grype failed on $image (exit $status)"; exit "$status" ;;
            esac
          done
          echo "critical=${critical[*]}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-app.sarif
          category: image/app
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-backoffice.sarif
          category: image/backoffice
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-web.sarif
          category: image/web
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - uses: ./.github/actions/upload-sarif
        continue-on-error: true
        with:
          sarif: grype-postgres.sarif
          category: image/postgres
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
      - name: Fail on a Critical finding with a fix
        if: steps.grype.outputs.critical != ''
        env:
          CRITICAL: ${{ steps.grype.outputs.critical }}
        run: |
          echo "::error::a Critical vulnerability with a fix in: $CRITICAL (see the scan step, or code scanning)"
          exit 1

  staging:
    if: github.ref == 'refs/heads/main'
    needs: image
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: staging

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
      actions: read
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      rollback: ${{ inputs.rollback }}
      keep-unhealthy: ${{ inputs.keep-unhealthy }}
