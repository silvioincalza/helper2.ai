# CD: every push to main runs CI, builds the image once and deploys staging. Prod is not deployed from
# here: a release tag vX.Y.Z does that (release.yml). Manual runs redeploy or roll back a given tag.
# No pull_request trigger here: self-hosted jobs must never run fork code (the repo is public).
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: environment to deploy
        type: choice
        options: [staging, prod]
        default: prod
      tag:
        description: 12-char commit already built. Empty = HEAD of main for staging, what staging runs for prod
        type: string
        default: ''
      rollback:
        description: the tag is older than what the environment runs, on purpose
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    # The ceiling for ci.yml's jobs: only its pull-request image scans ask for security-events (skipped here).
    permissions:
      contents: read
      security-events: write

  image:
    needs: ci
    runs-on: [self-hosted, incalzame]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: image-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bao-login
        with:
          addr: ${{ vars.BAO_ADDR }}
          audience: ${{ vars.BAO_AUDIENCE }}
          role: deploy
      # Postgres + pgvector (ADR 0012): built and pushed only when postgres.image.tag is not in Harbor yet.
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
        run: make -C deploy/k8s postgres-image ENGINE="$ENGINE"
      # Built from `git archive` of the commit (Makefile), pushed to Harbor as TAG.
      - env:
          ENGINE: ${{ vars.IMAGE_ENGINE || 'podman' }}
        run: make -C deploy/k8s image TAG="${GITHUB_SHA::12}" ENGINE="$ENGINE"
      # SBOM of the pushed image (ADR 0046), read from Harbor; release.yml attaches it to the GitHub release.
      - uses: ./.github/actions/install-scanners
      - run: make -C deploy/k8s sbom TAG="${GITHUB_SHA::12}" SBOM="$GITHUB_WORKSPACE/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  staging:
    needs: image
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      rollback: ${{ inputs.rollback }}
