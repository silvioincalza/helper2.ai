# CI: frontend and backend checks, the chart and the diagrams, on GitHub-hosted runners. No image build:
# images are built, pushed and scanned only on main (cd.yml); a release tag reuses them (release.yml).
# Runs on pull requests and is called by cd.yml before every deploy, so main never ships
# a commit that did not pass here. Never add `pull_request_target`: the repo is public.
# Per component (ADR 0071): on a pull request, the job `changes` maps the changed paths (.github/scripts/changes.sh)
# and each job runs only when its part changed; a path the map does not know runs everything. cd.yml calls this with
# full: true, so a push to main runs every job. The job `ci-ok` is the one check to require.
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current).
name: ci

on:
  pull_request:
  workflow_call:
    inputs:
      full:
        description: run every job, whatever changed (cd.yml, on every push)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Which parts the change touches: key=true|false outputs from .github/scripts/changes.sh, after its self-test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.map.outputs.frontend }}
      backend: ${{ steps.map.outputs.backend }}
      chart: ${{ steps.map.outputs.chart }}
      monitoring: ${{ steps.map.outputs.monitoring }}
      postgres: ${{ steps.map.outputs.postgres }}
      diagrams: ${{ steps.map.outputs.diagrams }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/changes.sh --self-test
      - id: map
        env:
          FULL: ${{ inputs.full == true || github.event_name != 'pull_request' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ $FULL == true ]]; then
            .github/scripts/changes.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            .github/scripts/changes.sh "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The schemas are generated from ../api/public.yaml and admin.yaml (git-ignored); lint/typecheck/build regenerate it too.
      - run: npm run gen:api
      # Code format (Prettier): fails on any unformatted file.
      - run: npm run format:check
      - run: npm run lint
      # Dead code (knip, ADR 0054): fails on any unused file, export, type or dependency.
      - run: npm run knip
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - run: npm run check:bundle
      # Known vulnerabilities (ADR 0054): a High or Critical one in a library the browser gets fails the job.
      - run: npm audit --omit=dev --audit-level=high
      # Every library, the build and test tools too: a report in the log, never a failure.
      - name: npm audit (report only)
        run: npm audit
        continue-on-error: true

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # A pull request only reads the Gradle cache: what main restores was written by main.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Code format (google-java-format, ktfmt Google style): fails on any unformatted file.
      - run: ./gradlew --no-daemon spotlessCheck
      # Testcontainers (Postgres, Redis) uses the runner's Docker.
      - run: ./gradlew --no-daemon test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  # No image is built here: pull requests stay light. CD builds, pushes and scans the images on main (cd.yml, ADR 0046).
  # A pushed Postgres tag is never rebuilt (make postgres-image), so a change under deploy/postgres must come with a
  # new postgres.image.tag: a git check, no build.
  postgres-tag:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changed, and tag bumped?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- deploy/postgres; then
            echo "deploy/postgres unchanged"; exit 0
          fi
          tag() { git show "$1:deploy/helm/helper2/values.yaml" | yq '.postgres.image.tag'; }
          old=$(tag "$BASE"); new=$(tag HEAD)
          if [[ $old == "$new" ]]; then
            echo "::error file=deploy/helm/helper2/values.yaml::deploy/postgres changed but postgres.image.tag is still $old: a pushed tag is never rebuilt, so set a new one"
            exit 1
          fi
          echo "postgres.image.tag $old -> $new"

  # Lint and render the chart for staging and prod and validate it against the Kubernetes schemas.
  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: Install helm and kubeconform
        run: |
          go install helm.sh/helm/v4/cmd/helm@v4.3.1
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make -C deploy/k8s chart-check

  # Alert rules: syntax and the unit tests in deploy/monitoring/tests. promtool from the release tarball, checked
  # against its SHA-256: `go install` cannot build it (the Prometheus module has replace directives).
  monitoring:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_VERSION: 3.15.1
      PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install promtool
        run: |
          set -euo pipefail
          dir="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSLo prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${dir}.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar -xzf prometheus.tar.gz --strip-components=1 -C "$RUNNER_TEMP" "${dir}/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: promtool check rules deploy/monitoring/helper2-rules.yaml
      - run: promtool test rules deploy/monitoring/tests/*.yaml

  # The committed SVGs must be what d2 renders from the committed sources (docs/diagrams/README.md).
  diagrams:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: Install d2
        run: |
          # Stamp the release version, as release builds do; it is written into every SVG.
          go install -ldflags "-X github.com/d2lang/d2/lib/version.Version=v0.9.0" github.com/d2lang/d2@v0.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Re-render and compare
        working-directory: docs/diagrams
        run: |
          set -euo pipefail
          ./render.sh
          if [[ -n $(git status --porcelain -- .) ]]; then
            git status --short -- .
            echo "::error::docs/diagrams is not what d2 v0.9.0 renders: run docs/diagrams/render.sh with d2 v0.9.0 and commit the result"
            exit 1
          fi

  # The one check to require on main: on a pull request green when every job above passed or was skipped (its part
  # did not change), red when one failed or was cancelled. Called by cd.yml (a push) every job runs, so each must pass;
  # only postgres-tag and diagrams are pull-request jobs. Never skipped itself, so a required check cannot hang.
  ci-ok:
    if: always()
    needs: [changes, frontend, backend, postgres-tag, chart, monitoring, diagrams]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r --argjson pr "$PR" '[to_entries[]
            | select(if $pr or .key == "postgres-tag" or .key == "diagrams"
                     then .value.result == "failure" or .value.result == "cancelled"
                     else .value.result != "success" end)
            | .key] | join(", ")' <<< "$NEEDS")
          if [[ -n $bad ]]; then echo "::error::failed or cancelled: $bad"; exit 1; fi
