name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: also pack the jars and the web bundle the images use
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: run the job of every component in the tree, whatever changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.map.outputs.frontend }}
      backend-libs: ${{ steps.map.outputs.backend-libs }}
      backend-public: ${{ steps.map.outputs.backend-public }}
      backend-backoffice: ${{ steps.map.outputs.backend-backoffice }}
      chart: ${{ steps.map.outputs.chart }}
      monitoring: ${{ steps.map.outputs.monitoring }}
      postgres: ${{ steps.map.outputs.postgres }}
      diagrams: ${{ steps.map.outputs.diagrams }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: .github/scripts/changes.sh --self-test
      - run: .github/scripts/release-version.sh --self-test
      - run: .github/scripts/ci-ok.sh --self-test
      - run: .github/scripts/branch-name.sh --self-test
      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: .github/scripts/branch-name.sh "$HEAD_REF"
      - name: Released migrations are unchanged
        run: |
          set -euo pipefail
          .github/scripts/released-migrations.sh --self-test
          .github/scripts/released-migrations.sh check
      - name: ADR references and history words
        run: |
          set -euo pipefail
          python3 scripts/adr-check.py --self-test
          python3 scripts/adr-check.py
      - name: Backlog script
        run: python3 scripts/backlog.py --self-test
      - name: Script tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/*.test.mjs)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "no scripts/*.test.mjs in the tree"; exit 0
          fi
          node --test "${tests[@]}"
      - id: map
        env:
          FULL: ${{ inputs.full == true || github.event_name != 'pull_request' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ $FULL == true ]]; then
            .github/scripts/changes.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            .github/scripts/changes.sh "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"
          fi

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/frontend-setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (report only)
        run: npm audit
        continue-on-error: true

  frontend-public-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/frontend-setup
        with:
          save-modules: true
      - run: npx vite build
      - run: npm run check:bundle
      - if: inputs.full
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-public-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  frontend-public-test:
    name: frontend-public-test (${{ matrix.shard }}/2)
    needs: [changes, frontend-public-build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/frontend-setup
      - name: Vitest, every test outside src/admin (${{ matrix.shard }}/2)
        run: npx vitest run --passWithNoTests --exclude 'src/admin/**' --shard=${{ matrix.shard }}/2

  frontend-backoffice-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/frontend-setup
      - run: npx vite build --config vite.admin.config.ts
      - if: inputs.full
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-backoffice-dist
          path: frontend/dist-admin
          if-no-files-found: error
          retention-days: 1

  frontend-backoffice-test:
    needs: [changes, frontend-backoffice-build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/frontend-setup
      - name: Vitest, the tests in src/admin
        run: npx vitest run --passWithNoTests src/admin

  backend-libs-build:
    needs: changes
    if: needs.changes.outputs.backend-libs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Format and compile the libs, the build logic and the load test
        run: |
          set -euo pipefail
          tasks=(:spotlessCheck spotlessCheck classes testClasses testFixturesClasses)
          if [[ -d loadtest ]]; then tasks+=(:loadtest:spotlessCheck :loadtest:gatlingClasses); fi
          ./gradlew --no-daemon -p libs "${tasks[@]}"
      - uses: ./.github/actions/backend-build-cache
        with:
          name: backend-libs-build-cache

  backend-libs-test:
    needs: [changes, backend-libs-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend-libs == 'true' && needs.backend-libs-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          build-caches: backend-libs-build-cache
      - run: ./gradlew --no-daemon -p libs test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-libs-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  backend-public-build:
    needs: [changes, backend-libs-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend-public == 'true' && contains(fromJSON('["success", "skipped"]'), needs.backend-libs-build.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          build-caches: ${{ needs.backend-libs-build.result == 'success' && 'backend-libs-build-cache' || '' }}
      - name: Format and compile the public app
        run: ./gradlew --no-daemon -p apps/public spotlessCheck classes testClasses
      - uses: ./.github/actions/backend-build-cache
        with:
          name: backend-public-build-cache

  backend-public-test:
    needs: [changes, backend-public-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend-public == 'true' && needs.backend-public-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          build-caches: backend-public-build-cache
      - run: ./gradlew --no-daemon -p apps/public test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-public-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  backend-backoffice-build:
    needs: [changes, backend-libs-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend-backoffice == 'true' && contains(fromJSON('["success", "skipped"]'), needs.backend-libs-build.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          build-caches: ${{ needs.backend-libs-build.result == 'success' && 'backend-libs-build-cache' || '' }}
      - name: Format and compile the back office app
        run: ./gradlew --no-daemon -p apps/backoffice spotlessCheck classes testClasses
      - uses: ./.github/actions/backend-build-cache
        with:
          name: backend-backoffice-build-cache

  backend-backoffice-test:
    needs: [changes, backend-backoffice-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend-backoffice == 'true' && needs.backend-backoffice-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          build-caches: backend-backoffice-build-cache
      - run: ./gradlew --no-daemon -p apps/backoffice test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-backoffice-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  package:
    needs: [changes, frontend-public-build, frontend-backoffice-build, backend-public-build, backend-backoffice-build]
    if: >-
      ${{ !cancelled() && inputs.full
      && needs.changes.outputs.frontend == 'true'
      && needs.changes.outputs.backend-public == 'true'
      && needs.changes.outputs.backend-backoffice == 'true'
      && needs.frontend-public-build.result == 'success'
      && needs.frontend-backoffice-build.result == 'success'
      && needs.backend-public-build.result == 'success'
      && needs.backend-backoffice-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/backend-setup
        with:
          build-caches: backend-*-build-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-public-dist
          path: ${{ runner.temp }}/frontend/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-backoffice-dist
          path: ${{ runner.temp }}/frontend/dist-admin
      - name: Jars and web bundle the images pack
        env:
          FRONTEND: ${{ runner.temp }}/frontend
          OUT: ${{ runner.temp }}/prebuilt
        run: .github/scripts/package.sh "$FRONTEND" "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prebuilt
          path: ${{ runner.temp }}/prebuilt
          if-no-files-found: error
          retention-days: 1

  postgres-tag:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Changed, and tag bumped?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          VALUES: deploy/helm/helper2/values.yaml
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- deploy/postgres; then
            echo "deploy/postgres unchanged"; exit 0
          fi
          tag() {
            git cat-file -e "$1:$VALUES" 2> /dev/null || return 0
            git show "$1:$VALUES" | yq '.postgres.image.tag'
          }
          old=$(tag "$BASE"); new=$(tag HEAD)
          if [[ $old == "$new" ]]; then
            echo "::error file=$VALUES::deploy/postgres changed but postgres.image.tag is still $old: a pushed tag is never rebuilt, so set a new one"
            exit 1
          fi
          echo "postgres.image.tag ${old:-none} -> $new"

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/go-tool
        with:
          name: helm
          module: helm.sh/helm/v4/cmd/helm
          version: v4.3.1
      - uses: ./.github/actions/go-tool
        with:
          name: kubeconform
          module: github.com/yannh/kubeconform/cmd/kubeconform
          version: v0.8.0
      - run: make -C deploy/k8s chart-check

  monitoring:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install promtool
        run: |
          set -euo pipefail
          docker pull --quiet "$PROMETHEUS_IMAGE"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/promtool" << 'SH'
          #!/usr/bin/env bash
          exec docker run --rm --network=none -v "$PWD:$PWD:ro" -w "$PWD" --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/promtool" --version
      - run: promtool check rules deploy/monitoring/helper2-rules.yaml
      - run: promtool test rules deploy/monitoring/tests/*.yaml

  diagrams:
    needs: changes
    if: needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/go-tool
        with:
          name: d2
          module: github.com/d2lang/d2
          version: v0.9.0
          ldflags: -X github.com/d2lang/d2/lib/version.Version=v0.9.0
      - name: Re-render and compare
        working-directory: docs/diagrams
        run: |
          set -euo pipefail
          ./render.sh
          if [[ -n $(git status --porcelain -- .) ]]; then
            git status --short -- .
            echo "::error::docs/diagrams is not what d2 v0.9.0 renders: run docs/diagrams/render.sh with d2 v0.9.0 and commit the result"
            exit 1
          fi

  ci-ok:
    if: always()
    needs:
      - changes
      - frontend-check
      - frontend-public-build
      - frontend-public-test
      - frontend-backoffice-build
      - frontend-backoffice-test
      - backend-libs-build
      - backend-libs-test
      - backend-public-build
      - backend-public-test
      - backend-backoffice-build
      - backend-backoffice-test
      - package
      - postgres-tag
      - chart
      - monitoring
      - diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event_name == 'pull_request' }}
          FULL: ${{ inputs.full == true }}
        run: .github/scripts/ci-ok.sh
