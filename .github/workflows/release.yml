# Release (ADR 0034): pushing an annotated tag vX.Y.Z on a commit of main, or of a release/* branch, publishes
# the GitHub release, adds the tag X.Y.Z to that commit's image in Harbor (same digest, no rebuild), then deploys
# X.Y.Z to prod after the approval on the `prod` environment. This is the only automatic way to prod: a push to
# main reaches staging only, a push to release/* only builds the image (cd.yml).
# A release branch carries fixes: its tag must be the next patch after the release just below it.
# A release tag is never moved or deleted: a push that rewrites or deletes an existing v* tag fails
# here and publishes nothing. The repository's tag ruleset is what blocks such a push up front;
# this job is the check that it held.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      source: ${{ steps.check.outputs.source }}
    steps:
      - name: Refuse a moved or deleted tag
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          if [[ $DELETED == true ]]; then
            echo "::error::release tag $TAG was deleted; release tags are permanent"; exit 1
          fi
          # A new tag has no previous value; anything else means an existing tag was rewritten.
          if [[ $FORCED == true || ! $BEFORE =~ ^0+$ ]]; then
            echo "::error::release tag $TAG was moved (it pointed at $BEFORE); release tags are immutable, publish a new version instead"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag, commit and versions
        id: check
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          version=${BASH_REMATCH[1]}
          # checkout may turn an annotated tag into a lightweight one: fetch the tag object itself.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ $(git cat-file -t "refs/tags/$TAG") == tag ]] || { echo "::error::$TAG must be an annotated tag"; exit 1; }
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          # Main, or a release branch (ADR 0034).
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main '+refs/heads/release/*:refs/remotes/origin/release/*'
          if git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            source=main
          else
            source=$(git for-each-ref --contains "$sha" --format='%(refname:lstrip=3)' refs/remotes/origin/release/ | head -1)
            [[ -n $source ]] || { echo "::error::$TAG is not on main nor on a release/* branch"; exit 1; }
            # Patch only: the release just below this one has the same major and minor and the patch before.
            prev=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -x -B1 -- "$TAG" | head -1)
            [[ $prev != "$TAG" ]] || { echo "::error::$TAG is on $source but no release comes before it"; exit 1; }
            IFS=. read -r major minor patch <<< "${prev#v}"
            next="v$major.$minor.$((patch + 1))"
            [[ $TAG == "$next" ]] || { echo "::error::$TAG is on $source: a release branch raises the patch only, after $prev comes $next"; exit 1; }
          fi
          echo "$TAG comes from $source"
          # One version, six files (ADR 0034), all at the tagged commit.
          gradle=$(git show "$sha:backend/build.gradle.kts" | sed -n 's/^version = "\(.*\)"$/\1/p')
          npm=$(git show "$sha:frontend/package.json" | jq -r .version)
          chart=$(git show "$sha:deploy/helm/helper2/Chart.yaml" | yq .version)
          public=$(git show "$sha:api/public.yaml" | yq .info.version)
          admin=$(git show "$sha:api/admin.yaml" | yq .info.version)
          common=$(git show "$sha:api/common.yaml" | yq .info.version)
          for v in "build.gradle.kts=$gradle" "package.json=$npm" "Chart.yaml=$chart" "public.yaml=$public" "admin.yaml=$admin" "common.yaml=$common"; do
            [[ ${v#*=} == "$version" ]] || { echo "::error::${v%%=*} has version ${v#*=}, the tag says $version"; exit 1; }
          done
          { echo "sha=$sha"; echo "commit=${sha::12}"; echo "version=$version"; echo "source=$source"; } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already, left as is"; exit 0
          fi
          notes=$(mktemp)
          git tag -l --format='%(contents)' "$TAG" > "$notes"
          printf '\nImages (commit `%s`):\n- `harbor-i.infra.incalza.me/helper2/apps/helper2-web:%s`\n- `harbor-i.infra.incalza.me/helper2/apps/helper2:%s`\n- `harbor-i.infra.incalza.me/helper2/apps/helper2-backoffice:%s`\n' "${SHA::12}" "${TAG#v}" "${TAG#v}" "${TAG#v}" >> "$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"

  # The release commit must have reached staging: its CD run (push to main) finished with success, so its
  # image exists and its staging rollout was healthy. Waits while that run is still going.
  staged:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.release.outputs.sha }}
      SOURCE: ${{ needs.release.outputs.source }}
    outputs:
      run: ${{ steps.wait.outputs.run }}
    steps:
      # From main: the run built the image and passed staging. From a release branch: the run built the image only;
      # staging never ran it (ADR 0034), and the log says so.
      - name: Wait for the commit's CD run
        id: wait
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            # Filtered by the full commit and the source branch on the server, so an old release commit is found as well
            # as a new one, and a release/* run of the same commit (no staging) never stands in for main's.
            run=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs" \
              -f event=push -f head_sha="$SHA" -f branch="$SOURCE" -f per_page=1 \
              --jq ".workflow_runs[0] // empty | [.status, (.conclusion // \"\"), .html_url, .id] | @tsv")
            if [[ -z $run ]]; then
              echo "::error::no CD run for $SHA on $SOURCE: the commit never went through CD"; exit 1
            fi
            IFS=$'\t' read -r status conclusion url id <<< "$run"
            if [[ $status == completed ]]; then
              if [[ $conclusion == success ]]; then
                if [[ $SOURCE == main ]]; then
                  # The run's staging deploy (job "staging / deploy") itself must have passed, not been skipped.
                  staged=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" -f per_page=100 -X GET \
                    --jq '[.jobs[] | select(.name | startswith("staging")) | .conclusion] | all(. == "success") and length > 0')
                  [[ $staged == true ]] || { echo "::error::the CD run of $SHA on main did not deploy staging ($url)"; exit 1; }
                  echo "staging passed: $url"
                else
                  echo "::warning::$SHA is on $SOURCE: its CD run built the image, staging never ran it ($url)"
                fi
                echo "run=$id" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "::error::the CD run of $SHA on $SOURCE ended '$conclusion' ($url): fix it, then tag a new version"; exit 1
            fi
            echo "CD run of $SHA is $status, waiting ($url)"
            sleep 30
          done
          echo "::error::the CD run of $SHA did not finish in 40 minutes"; exit 1

  # The SBOM of the image that goes to prod (ADR 0033): the one CD made when it pushed that image, attached to the
  # release. Public: it lists packages and versions, no data. A CD run from before SBOMs has none: a warning only.
  sbom:
    needs: [release, staged]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      RUN: ${{ needs.staged.outputs.run }}
    steps:
      - name: Attach the CD run's SBOM to the release
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          if ! gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n sbom -D "$dir"; then
            echo "::warning::CD run $RUN has no SBOM artifact (expired after 90 days, or older than ADR 0033): release $TAG has none"
            exit 0
          fi
          mv "$dir/sbom.cdx.json" "$dir/helper2-$TAG.cdx.json"
          gh release upload "$TAG" "$dir/helper2-$TAG.cdx.json" -R "$GITHUB_REPOSITORY" --clobber
          # The back office image's SBOM (ADR 0032); a CD run before the split has none.
          if gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n sbom-backoffice -D "$dir"; then
            mv "$dir/sbom-backoffice.cdx.json" "$dir/helper2-backoffice-$TAG.cdx.json"
            gh release upload "$TAG" "$dir/helper2-backoffice-$TAG.cdx.json" -R "$GITHUB_REPOSITORY" --clobber
          else
            echo "::warning::CD run $RUN has no back office SBOM: release $TAG has the public app's only"
          fi
          # The web image's SBOM (ADR 0032); a CD run before the web image has none.
          if gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n sbom-web -D "$dir"; then
            mv "$dir/sbom-web.cdx.json" "$dir/helper2-web-$TAG.cdx.json"
            gh release upload "$TAG" "$dir/helper2-web-$TAG.cdx.json" -R "$GITHUB_REPOSITORY" --clobber
          else
            echo "::warning::CD run $RUN has no web SBOM: release $TAG has none for the web image"
          fi

  # Only after every check above: the image of that commit, built by CD (and, from main, run on staging), goes to
  # prod under its version tag. deploy.yml adds the tag X.Y.Z to that image in Harbor after the prod approval
  # (ADR 0034), so no job reaches Harbor's credentials from a tag push before a reviewer said yes.
  prod:
    needs: [release, staged]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      tag: ${{ needs.release.outputs.version }}
      release-commit: ${{ needs.release.outputs.sha }}
