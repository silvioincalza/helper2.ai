# Release (ADR 0029): pushing an annotated tag vX.Y.Z on a commit of main publishes the GitHub release,
# then deploys that commit to prod after the approval on the `prod` environment. This is the only
# automatic way to prod: a push to main reaches staging only (cd.yml).
# A release tag is never moved or deleted: a push that rewrites or deletes an existing v* tag fails
# here and publishes nothing. The repository's tag ruleset is what blocks such a push up front;
# this job is the check that it held.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Refuse a moved or deleted tag
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          if [[ $DELETED == true ]]; then
            echo "::error::release tag $TAG was deleted; release tags are permanent"; exit 1
          fi
          # A new tag has no previous value; anything else means an existing tag was rewritten.
          if [[ $FORCED == true || ! $BEFORE =~ ^0+$ ]]; then
            echo "::error::release tag $TAG was moved (it pointed at $BEFORE); release tags are immutable, publish a new version instead"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag, commit and versions
        id: check
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          version=${BASH_REMATCH[1]}
          # checkout may turn an annotated tag into a lightweight one: fetch the tag object itself.
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ $(git cat-file -t "refs/tags/$TAG") == tag ]] || { echo "::error::$TAG must be an annotated tag"; exit 1; }
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          # One version, four files (ADR 0029), all at the tagged commit.
          gradle=$(git show "$sha:backend/build.gradle.kts" | sed -n 's/^version = "\(.*\)"$/\1/p')
          npm=$(git show "$sha:frontend/package.json" | jq -r .version)
          chart=$(git show "$sha:deploy/helm/helper2/Chart.yaml" | yq .version)
          api=$(git show "$sha:api/openapi.yaml" | yq .info.version)
          for v in "build.gradle.kts=$gradle" "package.json=$npm" "Chart.yaml=$chart" "openapi.yaml=$api"; do
            [[ ${v#*=} == "$version" ]] || { echo "::error::${v%%=*} has version ${v#*=}, the tag says $version"; exit 1; }
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "commit=${sha::12}" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already, left as is"; exit 0
          fi
          notes=$(mktemp)
          git tag -l --format='%(contents)' "$TAG" > "$notes"
          printf '\nImage: `harbor-i.infra.incalza.me/helper2/apps/helper2:%s`\n' "${SHA::12}" >> "$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"

  # Only after every check above: the image of that commit, built when it reached main and already run
  # on staging, goes to prod. Never rebuilt (ADR 0028).
  prod:
    needs: release
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      tag: ${{ needs.release.outputs.commit }}
