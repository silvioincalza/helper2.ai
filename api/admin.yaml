openapi: 3.1.0
info:
  title: helper2.ai back office API
  version: 2026.11.9
  summary: Federated metasearch for AI resources, with explicit provenance and source status.
  description: |
    Back office API (ADR 0036, 0038): served by the back office app on the in-network admin host only. Shared
    types live in common.yaml.

    Contract-first REST API for helper2.ai. This file is the source of truth:
    the Spring backend generates its controller interfaces and DTOs from it, and the
    React frontend generates its TypeScript types from it.

    Honesty rules encoded in the contract:
    * Every search response lists every configured source and what happened to it.
    * Every date is a `DateFact`, which can say "unknown"; nothing is invented.
    * Every field value carries an `origin` (source-provided, AI-extracted, curated, ...).
    * Relationships and AI-extracted facts carry a `verification` status and evidence.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
tags:
  - name: search
  - name: sources
  - name: categories
  - name: me
  - name: review
  - name: scout-runs
  - name: enrichment-recheck
  - name: category-backfill
  - name: audit
  - name: overview
  - name: enrichment-queue
  - name: settings
  - name: runtime-settings
  - name: discovery-hosts
  - name: list-seeds
  - name: shadow-libraries
  - name: known-targets
  - name: relationship-targets
  - name: examples-admin
  - name: review-research
  - name: review-research-events

paths:
  /search:
    $ref: "./common.yaml#/paths/~1search"
  /sources:
    $ref: "./common.yaml#/paths/~1sources"
  /categories:
    $ref: "./common.yaml#/paths/~1categories"
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current session. Anonymous use is fully supported.
      description: >-
        A session whose account no longer exists is ended and gets 401 `sign-in-again`; the next call is anonymous.
      responses:
        "200":
          description: Session info.
          content:
            application/json:
              schema: { $ref: "./common.yaml#/components/schemas/Me" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
  /admin/review-items:
    get:
      tags: [review]
      operationId: listReviewItems
      parameters:
        - {
            name: status,
            in: query,
            description: Omit for every status.,
            schema: { $ref: "#/components/schemas/ReviewStatus" },
          }
        - {
            name: kind,
            in: query,
            description: Omit for every kind.,
            schema: { $ref: "#/components/schemas/ReviewKind" },
          }
        - name: category
          in: query
          description: >-
            Only resource candidates in this discovery category (its id, e.g. `coding`); omit for every item.
          schema:
            { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 40 }
        - name: research
          in: query
          description: >-
            Only items whose newest research run is DONE with this verdict (KEEP, REJECT, DUPLICATE), items with a
            queued or running run (ACTIVE), or items never researched (NONE). Omit for every item (ADR 0048).
          schema:
            { type: string, enum: [KEEP, REJECT, DUPLICATE, ACTIVE, NONE] }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: One page of the human review queue, newest first, filtered by status and kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewItemPage" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-items/{id}/resolution:
    put:
      tags: [review]
      operationId: resolveReviewItem
      description: >-
        409 when the item is no longer OPEN (another decision, a double click, or a newer enrichment run superseded
        it): nothing changes, and the audit trail records NOT_OPEN. Accepting a resource candidate whose address is
        already listed (as a resource or as a source record of one) adds nothing: the item is ACCEPTED, the decision
        is kept, the resolution note says "Already listed as <title>." and `alreadyListed` names that resource.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewResolution" }
      responses:
        "200":
          description: Resolved item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewItem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-items/resolutions:
    post:
      tags: [review]
      operationId: resolveReviewItems
      summary: Decide several review items at once (ADR 0038).
      description: >-
        Each item is decided in its own transaction, the way one decision is, and writes its own audit entry; the
        outcome carries the batch, e.g. `ACCEPTED bulk:<batch>`. Rejecting works for every kind. Accepting works only
        for an enrichment check whose run has no CONFLICTING license, open source or pricing, and for a resource
        or course candidate whose newest research is DONE with verdict KEEP and no CONFLICT value: its CONFIRMED
        changed values go into the candidate first, as one Accept with them confirmed would. Any other item, and a
        candidate whose confirmed values the candidate edit refuses, is NOT_ALLOWED and stays open. An item already decided is NOT_OPEN, an unknown one NOT_FOUND. Decisions are final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewBulkResolution" }
      responses:
        "200":
          description: One outcome per item, in the order sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewBulkResult" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-items/{id}/evidence:
    get:
      tags: [review]
      operationId: getReviewEvidence
      summary: What a review item is about, with the quotes behind it (ADR 0038).
      description: >-
        Read through the item's link, never from its details. An item from an enrichment run: the run, its validation
        errors and the fields it stored, each with at most 5 quotes, CONFLICTING first. A relationship candidate: the
        run and the relationship, with at most 5 quotes. Any other item: the item only. Field values and the
        relationship are AI-written (`aiContent`); quotes come from the sources. The run of a decided or superseded
        item can have no fields left: a newer run replaced them.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The item and its evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewEvidence" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/resources/{id}/fields/{field}:
    put:
      tags: [review]
      operationId: setResourceField
      summary: Set a resource's own value of a field (ADR 0038).
      description: >-
        The value is written to the resource and wins over every source and every enrichment run: no record changes
        it, and the model's values of the field are dropped. Only type, pricing, license, openSource, techLevel,
        audience, language, publishedAt (YYYY-MM-DD, not in the future) and description (1 to 4000 characters,
        stored as written by the admin) (400 for the others). The value must be one the field takes.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: field,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ResourceField" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceFieldValue" }
      responses:
        "204": { description: Set. }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/resources/{id}/fields/{field}/drop:
    post:
      tags: [review]
      operationId: dropResourceField
      summary: Drop what the AI said about a field of a resource (ADR 0038).
      description: >-
        Rejects the field's AI-written values (extracted, self-declared, estimated); a value the sources state or an
        admin set stays. The page then shows the source's value, or "Not stated".
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: field,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/ResourceField" },
          }
      responses:
        "204": { description: Dropped (also when there was nothing to drop). }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-items/{id}/candidate:
    put:
      tags: [review]
      operationId: editCandidate
      summary: Fix an open resource candidate's values before accepting it (ADR 0038, 0048).
      description: >-
        At least one value; what is left out stays as the collector wrote it. Title, type and tags replace the
        candidate's own. The other values are kept as confirmed by the admin: accepting writes them to the resource
        as the admin's own values, which no source or enrichment run changes (`canonicalUrl` replaces the page the
        candidate is indexed at, and an already listed URL closes the item as listed). The type may be any candidate type,
        not only the ones its finders declare. A collector that finds the page again keeps what the admin wrote. 409
        `not-applicable` for an item that is not a resource candidate, `already-decided` for one no longer open,
        `version-conflict` when the candidate changed since it was shown (`expectedRevision`; reload, then edit
        again).
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateEdit" }
      responses:
        "200":
          description: The item with its new details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewItem" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-items/{id}/known-target:
    put:
      tags: [review]
      operationId: editKnownTargetCandidate
      summary: Change an open known target proposal's name, kind and other names before accepting it (ADR 0019).
      description: >-
        The body replaces the kind and every name. Accepting the item then adds the known target as written. When the
        name is one an existing target of the same kind holds, accepting adds the other names to that target instead.
        409 `not-applicable` for an item that is not a known target proposal, `already-decided` for one no longer
        open.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownTargetWrite" }
      responses:
        "200":
          description: The item with its new details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewItem" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-items/{id}/relationship-target:
    put:
      tags: [review]
      operationId: changeRelationshipTarget
      summary: Point an open relationship candidate at the right resource (ADR 0038).
      description: >-
        Exactly one of `resourceId` (a catalog resource), `newResource` (a resource to add: its name, official https
        address and type; an address the catalog already has gives that resource, never a second one) or `title` (a
        new name, not linked). The target then is a person's choice: its targetOrigin becomes CURATED. The origin stays
        the model's, since the kind is still AI-written. The item stays
        open: accepting it makes the link VERIFIED. 409 when the item is no longer open, is not a relationship
        candidate, or another relationship of the resource already has that target.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationshipTargetChange" }
      responses:
        "200":
          description: The item and its evidence, with the new target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewEvidence" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/relationship-targets:
    get:
      tags: [relationship-targets]
      operationId: listRelationshipTargetGroups
      summary: The open relationship candidates grouped by target name, the largest group first (ADR 0038).
      description: >-
        A relationship candidate is open because its target is not a known resource: its quotes already passed. Items
        are grouped by the target key (lower case, spaces folded, a trailing 's dropped), the same key known targets
        use, so "PyTorch" and "pytorch" are one group.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: One page of groups.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RelationshipTargetGroupPage" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/relationship-targets/decision:
    post:
      tags: [relationship-targets]
      operationId: decideRelationshipTargetGroup
      summary: One decision for every open relationship candidate of one target name (ADR 0038).
      description: >-
        LINK points each item at the catalog resource `resourceId` and accepts it (VERIFIED). VENDOR, SERVICE or
        TOOL adds the name as a known target and closes the items it now matches (SUPERSEDED). REJECT rejects each
        item and its relationship. Each item is decided in its own transaction with its own audit entry, `<decision>
        bulk:<batch>`; an item decided meanwhile, one whose resource already has this target, or the target
        resource itself, is skipped and stays as it is. At most 1000 items per call: `left` says how many wait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RelationshipTargetGroupDecision" }
      responses:
        "200":
          description: What was decided.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RelationshipTargetGroupOutcome" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/scout-runs:
    get:
      tags: [scout-runs]
      operationId: listScoutRuns
      responses:
        "200":
          description: The latest run of each source, newest first.
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/ScoutRun" },
                }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      tags: [scout-runs]
      operationId: startScoutRun
      summary: Start collection for one source (or all) now.
      description: >-
        Answers as soon as the run holds the cluster-wide Scout run lock; the run then collects in the background.
        Poll GET /admin/scout-runs for its progress.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoutRunRequest" }
      responses:
        "202":
          description: >-
            Run started: one record per selected collector, RUNNING (SKIPPED when the collector is disabled). The ids
            match the records listed by GET /admin/scout-runs.
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/ScoutRun" },
                }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404":
          description: No collector has the given sourceId; nothing starts.
          content:
            application/problem+json:
              schema: { $ref: "./common.yaml#/components/schemas/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/enrichment-recheck:
    post:
      tags: [enrichment-recheck]
      operationId: recheckEnrichments
      summary: Re-check the stored enrichment answers by code, with no model call (ADR 0014).
      description: >-
        Rejects a verified pricing, type or use case whose quotes do not state it, drops summary sentences that fail
        the claim check, and puts back in the enrichment backlog the resources that still miss a fact and have more
        to read. Idempotent: a second call changes nothing. Runs once by itself after the first start. It takes the
        Scout's run lock: while a Scout run holds it, 409 `run-in-progress` and nothing changes.
      responses:
        "200":
          description: What the re-check did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrichmentRecheck" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
  /admin/category-backfill:
    post:
      tags: [category-backfill]
      operationId: backfillCategories
      summary: Assign the categories of every resource again.
      description: >-
        Answers at once; the backfill then runs in the background on one replica, in batches (ADR 0026). It is
        idempotent. Counts go to the metric `helper2.categories.backfill.resources` and the log.
      responses:
        "202":
          {
            description: Started (skipped when another replica is already running it).,
          }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/overview:
    get:
      tags: [overview]
      operationId: getAdminOverview
      summary: What needs a person now, for the back office landing page.
      description: >-
        Open review items per kind, the enrichment backlog, today's model budgets and web credits, the recent Scout
        runs and the failed ones of the last 24 hours, and the home examples shown and hidden. Counts only, no personal data. Computed at most once a minute
        (generatedAt says when).
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/enrichment-queue:
    get:
      tags: [enrichment-queue]
      operationId: listEnrichmentQueue
      summary: The enrichment backlog, in the order the Scout takes it.
      description: >-
        WAITING (the default): the ones an admin moved to the top first, then never-run resources, then
        model-unavailable and failed ones with retries left, each part the most popular first, then the newest
        discovery. SKIPPED: the ones an
        admin skipped, the latest skip first. OUT_OF_RETRIES: the ones whose failed runs reached the cap, newest
        discovery first. Paged by cursor: pass `next` from the
        previous page as `after`, with the same view.
      parameters:
        - {
            name: view,
            in: query,
            schema: { $ref: "#/components/schemas/EnrichmentQueueView" },
          }
        - {
            name: after,
            in: query,
            description: The previous page's next cursor; omit for the first page.,
            schema: { type: string, maxLength: 200 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: One page of the backlog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrichmentQueuePage" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/ai-check:
    get:
      tags: [enrichment-queue]
      operationId: checkAiWords
      summary: The catalog's resources checked against today's "is it about AI" word rule, the most popular first.
      description: >-
        Reads the next `size` indexed or observed resources by popularity (then id), checks each with
        `Classification.isAiRelated` on its title, description and tags, and answers the ones that fail. Nothing is
        changed or deleted: an admin decides, for example by skipping a waiting one. Paged by cursor: pass `next` as
        `after`; null when the catalog is read to the end.
      parameters:
        - {
            name: after,
            in: query,
            description: The previous page's next cursor; omit to start at the most popular.,
            schema: { type: string, maxLength: 200 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 2000, default: 500 },
          }
      responses:
        "200":
          description: The resources of this page that fail the rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiCheckPage" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/ai-check/awesome-lists:
    post:
      tags: [enrichment-queue]
      operationId: checkAwesomeLists
      summary: Re-check the catalog's GitHub repositories named awesome-* and type the real awesome lists.
      description: >-
        Reads each repository's README and applies the awesome-list rule (ADR 0012 §6): the name starts with "awesome",
        at least 20 list items carry a link, and they are at least half of the README's text lines. A repository that
        passes gets the curated type AWESOME_LIST, with a SET_FIELD audit entry. A type an admin curated is never
        changed. Safe to run again: a resource already AWESOME_LIST is not read.
      responses:
        "200":
          description: What the check did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwesomeListCheck" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/ai-check/{resourceId}/remove:
    post:
      tags: [enrichment-queue]
      operationId: removeResourceNotAboutAi
      summary: Remove a listed resource that is not about AI, and keep the Scout from adding its address again.
      description: >-
        For a resource the AI check lists. In one transaction: an audit entry REMOVE_RESOURCE with the resource's
        address and the reason, a rejected decision for the address (the key a rejected resource candidate keeps,
        never the address itself), then the resource and what belongs to it (source records, labels, embedding,
        enrichment runs, review items, links to it). The Scout and the review queue skip an address with a rejected
        decision. Saved items keep their own title and address.
      parameters:
        - {
            name: resourceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceRemoval" }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/enrichment-queue/{resourceId}/requeue:
    post:
      tags: [enrichment-queue]
      operationId: requeueEnrichment
      summary: Put a skipped resource, or one out of retries, back into the enrichment queue.
      description: >-
        Undoes a skip. For a resource out of retries, only the failed runs from now on count against the cap. The
        resource takes its own place again; the daily enrichment cap still applies. 409 not-applicable when the
        resource is neither skipped nor out of retries. Every call is in the audit trail (REQUEUE_ENRICHMENT).
      parameters:
        - {
            name: resourceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Requeued. }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/enrichment-queue/{resourceId}/skip:
    post:
      tags: [enrichment-queue]
      operationId: skipEnrichment
      summary: Take a waiting resource out of the enrichment queue until it is requeued.
      description: >-
        Drops a move to the top. 409 not-applicable when the resource does not wait or is already skipped. Every call
        is in the audit trail (SKIP_ENRICHMENT).
      parameters:
        - {
            name: resourceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrichmentSkip" }
      responses:
        "204": { description: Skipped. }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/enrichment-queue/{resourceId}/prioritise:
    post:
      tags: [enrichment-queue]
      operationId: prioritiseEnrichment
      summary: Move a waiting resource to the top of the enrichment queue until its next run.
      description: >-
        The Scout takes it in its next batch, within the daily enrichment cap: the order changes, the number of model
        calls does not. At most 50 resources wait at the top. 409 not-applicable when the resource does not wait, is
        already at the top, or the top is full. Every call is in the audit trail (PRIORITISE_ENRICHMENT).
      parameters:
        - {
            name: resourceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Moved to the top. }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: What administrators did, newest first.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
        - {
            name: size,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: One page of the admin audit trail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryPage" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/config:
    get:
      tags: [settings]
      operationId: getEffectiveConfig
      summary: The settings the app runs with now, read-only.
      description: >-
        Grouped by module, each read from the module's typed settings: model ids per use, prompt versions, the guide's
        configuration hash, daily budgets and caps, the Scout's schedule and the sources that are on. The groups only
        the public app has (the guide, the setup guide) are the ones it wrote to the database at its last start. An
        allow-list: never a secret, a key, a credential in a URL or a secret's path. Fixed until the next restart.
      responses:
        "200":
          description: Every group, in page order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveConfig" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/runtime-settings:
    get:
      tags: [runtime-settings]
      operationId: listRuntimeSettings
      summary: The spending limits and the switches an administrator may change at runtime, with their history.
      description: >-
        Each setting of the allow-list (ADR 0007): the value applied now, the default (the H2_ variable), the allowed
        range, its version and its last changes. The value a replica applies can be up to one refresh interval
        (20 s by default) behind.
      responses:
        "200":
          description: Every runtime setting, in a fixed order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeSettings" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/runtime-settings/{key}:
    parameters:
      - {
          name: key,
          in: path,
          required: true,
          schema: { type: string, maxLength: 100 },
        }
    put:
      tags: [runtime-settings]
      operationId: changeRuntimeSetting
      summary: Set a runtime setting's value.
      description: >-
        400 when the value is outside 0 to the setting's maximum. 404 for a key that is not in the allow-list. 409
        when the version is not the setting's newest (someone changed it first). Recorded in the audit trail with
        the value before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeSettingChange" }
      responses:
        "200":
          description: Changed; this replica applies it now, the others within one refresh interval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeSettingState" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/runtime-settings/{key}/reset:
    parameters:
      - {
          name: key,
          in: path,
          required: true,
          schema: { type: string, maxLength: 100 },
        }
    post:
      tags: [runtime-settings]
      operationId: resetRuntimeSetting
      summary: Back to the default (the H2_ variable).
      description: >-
        Appends a change with no value. 404 for a key that is not in the allow-list; 409 when the version is not the
        setting's newest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeSettingReset" }
      responses:
        "200":
          description: Back to the default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeSettingState" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/runtime-switches/{key}:
    parameters:
      - {
          name: key,
          in: path,
          required: true,
          schema: { type: string, maxLength: 100 },
        }
    put:
      tags: [runtime-settings]
      operationId: changeRuntimeSwitch
      summary: Turn a runtime switch on or off.
      description: >-
        404 for a key that is not a switch of the allow-list. 409 when the version is not the switch's newest (someone
        changed it first). Recorded in the audit trail with the value before and after (true or false).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeSwitchChange" }
      responses:
        "200":
          description: Changed; this replica applies it now, the others within one refresh interval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeSwitchState" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/runtime-switches/{key}/reset:
    parameters:
      - {
          name: key,
          in: path,
          required: true,
          schema: { type: string, maxLength: 100 },
        }
    post:
      tags: [runtime-settings]
      operationId: resetRuntimeSwitch
      summary: Back to the default (the H2_ variable).
      description: >-
        Appends a change with no value. 404 for a key that is not a switch of the allow-list; 409 when the version is
        not the switch's newest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuntimeSettingReset" }
      responses:
        "200":
          description: Back to the default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeSwitchState" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/discovery-hosts:
    get:
      tags: [discovery-hosts]
      operationId: listDiscoveryHosts
      summary: The hosts discovery knows by name, with who added each and why.
      description: >-
        WRITING hosts publish articles about many products (a post there is an ARTICLE candidate); DIRECTORY hosts
        list products (a page there is never kept). A DIRECTORY host with `readsLists` has its list pages read as
        lists (ADR 0055). Discovery reads the lists at the start of each run (ADR 0013).
      responses:
        "200":
          description: Every host, by kind and name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryHosts" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      tags: [discovery-hosts]
      operationId: addDiscoveryHost
      summary: Add a host to one list.
      description: >-
        The host is kept in lower case, without "www." and a trailing dot. 400 when it is not a host name, when it
        would match too much (a top-level domain, "co.uk", an IP address), for github.com, for a reason that is not
        one plain line, and when the lists are full (500 hosts). 409 when the host is in a list already, of either
        kind. Recorded in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryHostAdd" }
      responses:
        "201":
          description: Added; the next discovery run uses it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryHostEntry" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/discovery-hosts/{host}/remove:
    parameters:
      - {
          name: host,
          in: path,
          required: true,
          schema: { type: string, maxLength: 260 },
        }
    post:
      tags: [discovery-hosts]
      operationId: removeDiscoveryHost
      summary: Remove a host from its list.
      description: 404 when the host is in no list. Recorded in the audit trail with the list it was in.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryHostRemove" }
      responses:
        "204":
          { description: Removed; the next discovery run no longer uses it. }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/discovery-hosts/{host}/list-reading:
    parameters:
      - {
          name: host,
          in: path,
          required: true,
          schema: { type: string, maxLength: 260 },
        }
    post:
      tags: [discovery-hosts]
      operationId: readDirectoryLists
      summary: Turn the reading of a directory host's list pages on or off.
      description: >-
        Off for every host until an administrator turns it on, after checking the host. With the switch on, a list
        page discovery finds on the host is added as a list to read (ADR 0055); with it off, the page waits for
        review and the lists discovery added from the host are no longer read. 400 when the host is a WRITING host
        or the reason is not one plain line; 404 when the host is in no list. Recorded in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryListReading" }
      responses:
        "200":
          description: The host with its switch; the next discovery run uses it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryHostEntry" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/list-seeds:
    get:
      tags: [list-seeds]
      operationId: listListSeeds
      summary: The lists the Scout reads on every pass, with who added each and why.
      description: >-
        An administrator adds a list; discovery adds a list page it finds on a directory host whose lists are read
        (`origin`, ADR 0055).
        The awesome-list collector reads these GitHub repositories at the start of every pass, before the lists its
        own search finds, whatever their stars and name. It reads an added web page through the live web page reader,
        at most once in the days set by H2_SCOUT_AWESOME_WEB_PAGES_EVERY (ADR 0012).
      responses:
        "200":
          description: Every list, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSeeds" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      tags: [list-seeds]
      operationId: addListSeed
      summary: Add a GitHub repository or a web page as a list to read.
      description: >-
        A GitHub repository is "owner/name" or "https://github.com/owner/name", kept in lower case as "owner/name".
        A web page is an https address with a public host name and no user info, port or fragment. 400 when the
        address is anything else (a file path or a branch on GitHub, http, an IP address, a private name), when the
        page is on a host that is never read (the detail gives the host and the reason), for a reason that is not
        one plain line, and when 50 lists are added already. 409 when the list is added already. Recorded in the
        audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListSeedAdd" }
      responses:
        "201":
          description: Added; the next pass of the awesome-list collector reads it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSeedEntry" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/list-seeds/{id}/remove:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [list-seeds]
      operationId: removeListSeed
      summary: Stop reading an added list.
      description: >-
        404 when no added list has this id. The list and the resources found in it stay in the catalog.
        Recorded in the audit trail.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListSeedRemove" }
      responses:
        "204": { description: Removed; the next pass no longer reads it. }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/shadow-libraries:
    get:
      tags: [shadow-libraries]
      operationId: listShadowLibraries
      summary: The names of the shadow libraries no search shows, with who added each and why.
      description: >-
        A web result is never shown when one label of its host, before the last, is one of these names: "libgen"
        drops libgen.rs, libgen.is and every subdomain. The live web search and the Scout's web collectors read the
        list (ADR 0049).
      responses:
        "200":
          description: Every name, in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowLibraries" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      tags: [shadow-libraries]
      operationId: addShadowLibrary
      summary: Add a name to the list.
      description: >-
        The name is kept in lower case. 400 when it is not one host label (a dot, a space, a scheme), when it is
        shorter than 3 characters, a label many sites use ("www", "com", "blog") or a label of a source's host
        ("github", "huggingface"), for a reason that is not one plain line, and when the list is full (200 names). 409 when the name is listed already. Recorded in the audit
        trail. The search on this host uses it at once, the public app within 30 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShadowLibraryAdd" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowLibraryEntry" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/shadow-libraries/{name}/remove:
    parameters:
      - {
          name: name,
          in: path,
          required: true,
          schema: { type: string, maxLength: 70 },
        }
    post:
      tags: [shadow-libraries]
      operationId: removeShadowLibrary
      summary: Remove a name from the list.
      description: 404 when the name is not listed. Recorded in the audit trail.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShadowLibraryRemove" }
      responses:
        "204": { description: Removed; results on its sites are shown again. }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/known-targets:
    get:
      tags: [known-targets]
      operationId: listKnownTargets
      summary: The vendors, services and tools a relationship may name with no catalog resource.
      description: >-
        A VENDOR is a company; a SERVICE is what a resource connects to (Slack, GitHub); a TOOL is an application a
        resource runs in or plugs into (VS Code, Claude Desktop). A relationship whose target
        is one of these names is verified with no target resource (ADR 0019). `relationships` counts the ones that
        carry the target now.
      responses:
        "200":
          description: Every known target, by kind and name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownTargets" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      tags: [known-targets]
      operationId: addKnownTarget
      summary: Add a vendor or a service.
      description: >-
        A name is 2 to 60 characters, one plain line. Names are compared without case, repeated spaces and a final
        "'s". 400 for an unusable name or more than 20 other names. 409 when another known target holds one of the
        names, and when the list is full (1000). The open relationship candidates that name it are confirmed at the
        end of the next Scout run. Recorded in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownTargetWrite" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownTargetEntry" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/known-targets/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      tags: [known-targets]
      operationId: changeKnownTarget
      summary: Change the kind, the name or the other names of a known target.
      description: >-
        The body replaces the kind and every name. A relationship that carried a name the body no longer has becomes
        UNVERIFIED and gets an open review item; the others take the new kind. 404 for an unknown id, 400 and 409 as
        for adding. Recorded in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnownTargetWrite" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownTargetEntry" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/known-targets/{id}/remove:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [known-targets]
      operationId: removeKnownTarget
      summary: Remove a known target.
      description: >-
        Every relationship that carried it becomes UNVERIFIED and gets an open review item, so a person can decide it
        and adding the name again confirms it. 404 for an unknown id. Recorded in the audit trail.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/home-examples:
    get:
      tags: [examples-admin]
      operationId: listAdminHomeExamples
      summary: Every home example, with its last check.
      parameters:
        - {
            name: outcome,
            in: query,
            schema: { $ref: "#/components/schemas/ExampleCheckOutcome" },
          }
      responses:
        "200":
          description: Newest change first.
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/AdminHomeExample" },
                }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
    post:
      tags: [examples-admin]
      operationId: addHomeExample
      summary: Add an example; it waits for its first check (PENDING).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeExampleInput" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHomeExample" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/home-examples/drafts:
    post:
      tags: [examples-admin]
      operationId: draftHomeExamples
      summary: Ask a model to draft examples for well-known catalog resources; each draft waits in the review queue.
      description: >-
        One model call from the drafts' own daily budget. A draft is kept only when it follows the example rules,
        names one of the resources it was given, and does not repeat an example. 503 unavailable when no model is
        configured, the budget is used up or the model cannot answer.
      responses:
        "202":
          description: Drafts opened in the review queue (kind EXAMPLE_CANDIDATE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExampleDrafts" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "503": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/home-examples/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      tags: [examples-admin]
      operationId: changeHomeExample
      summary: Change, pause or activate an example.
      description: >-
        409 when the version is not the stored one (someone changed it first) or when another example has the same
        label or query. A change of the query, path or expected results sends the example back to PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeExampleChange" }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHomeExample" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }
    delete:
      tags: [examples-admin]
      operationId: removeHomeExample
      summary: Remove an example.
      responses:
        "204": { description: "Removed, or already gone." }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-research:
    post:
      tags: [review-research]
      operationId: startReviewResearch
      summary: Start research on review items (ADR 0048).
      description: >-
        Queues a run for each item that is an open RESOURCE_CANDIDATE or COURSE_CANDIDATE and has no queued or
        running run; other ids are skipped. `itemIds` takes at most 500 ids, and an item already researched runs
        again. With `allOpen`, the server queues every such item whose newest run is not DONE, at most 20,000: ask
        `/admin/review-research/estimate` first. Runs are async: the answer lists the queued runs. While research is
        off on the back office (H2_RESEARCH_ENABLED), the answer is 503 and nothing is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewResearchStart" }
      responses:
        "202":
          description: The runs queued now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResearchRuns" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "503": { $ref: "./common.yaml#/components/responses/Problem" }
    get:
      tags: [review-research]
      operationId: listReviewResearch
      summary: The newest run of each given item, for the status of the queue rows.
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            {
              type: array,
              minItems: 1,
              maxItems: 200,
              items: { type: string, format: uuid },
            }
          explode: true
      responses:
        "200":
          description: One run per item that has one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResearchRuns" }
        "400": { $ref: "./common.yaml#/components/responses/Problem" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-research/estimate:
    get:
      tags: [review-research]
      operationId: estimateReviewResearch
      summary: How many items research on every open candidate would queue, and the most model calls it can take.
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResearchEstimate" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-research/{runId}:
    get:
      tags: [review-research]
      operationId: getReviewResearch
      summary: One run with its checked result and every step, request and response as plain text.
      parameters:
        - {
            name: runId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResearchDetail" }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-research/{runId}/cancel:
    post:
      tags: [review-research]
      operationId: cancelReviewResearch
      summary: Cancel a queued or running run. A running one stops before its next step.
      parameters:
        - {
            name: runId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "409": { $ref: "./common.yaml#/components/responses/Problem" }

  /admin/review-research/{runId}/events:
    get:
      tags: [review-research-events]
      operationId: streamReviewResearch
      summary: The steps of one run as they are stored, then its end.
      description: >-
        `text/event-stream`. Event `step`: one ReviewResearchStep, in order, from `afterSeq` on. Event `status`: the
        run (ReviewResearchRun) when its status or its `startedAt` changes, before the steps of that state. A run that
        goes back to QUEUED, or starts again with a new `startedAt`, is a new attempt: its steps start again at seq 1,
        so the client drops the steps it holds. The stream ends after the run is DONE, FAILED or CANCELLED,
        or when the browser leaves. New rows are read once a second; a comment line keeps a quiet stream open. A back
        office serves a few streams at a time (H2_RESEARCH_MAX_STREAMS) and answers 429 beyond them.
      parameters:
        - {
            name: runId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: afterSeq,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "./common.yaml#/components/responses/Problem" }
        "403": { $ref: "./common.yaml#/components/responses/Problem" }
        "404": { $ref: "./common.yaml#/components/responses/Problem" }
        "429": { $ref: "./common.yaml#/components/responses/Problem" }

components:
  schemas:
    HomeExampleInput:
      type: object
      required: [label, query, path, expectedResourceIds]
      properties:
        label: { type: string, minLength: 2, maxLength: 32 }
        query: { type: string, minLength: 3, maxLength: 200 }
        path: { $ref: "./common.yaml#/components/schemas/AudiencePath" }
        expectedResourceIds:
          type: array
          minItems: 1
          maxItems: 3
          description: Catalog resource ids that are a right answer; the quality check looks for them in the top 3.
          items: { type: string, format: uuid }

    HomeExampleChange:
      type: object
      required: [label, query, path, expectedResourceIds, status, version]
      properties:
        label: { type: string, minLength: 2, maxLength: 32 }
        query: { type: string, minLength: 3, maxLength: 200 }
        path: { $ref: "./common.yaml#/components/schemas/AudiencePath" }
        expectedResourceIds:
          {
            type: array,
            minItems: 1,
            maxItems: 3,
            items: { type: string, format: uuid },
          }
        status: { $ref: "#/components/schemas/ExampleStatus" }
        version:
          {
            type: integer,
            minimum: 0,
            description: The version the change was made on.,
          }

    ExampleDrafts:
      type: object
      required: [drafted, model]
      properties:
        drafted:
          {
            type: integer,
            minimum: 0,
            description: Drafts opened in the review queue.,
          }
        model: { type: string }

    ExampleStatus: { type: string, enum: [ACTIVE, PAUSED] }

    ExampleCheckOutcome:
      type: string
      enum: [PENDING, PASS, WEAK, FAIL]
      description: >-
        PASS: an expected result in the top 3 of the example's own search (shown). WEAK: in the top 4 to 10. FAIL: not
        in the top 10. PENDING: not checked since its last change. Only PASS is shown.

    AdminHomeExample:
      type: object
      required:
        [
          id,
          label,
          query,
          path,
          status,
          origin,
          expected,
          check,
          version,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        query: { type: string }
        path: { $ref: "./common.yaml#/components/schemas/AudiencePath" }
        status: { $ref: "#/components/schemas/ExampleStatus" }
        origin: { type: string, enum: [BUILT_IN, CURATED, AI_DRAFTED] }
        model:
          {
            type: [string, "null"],
            description: The model that drafted it (AI_DRAFTED only).,
          }
        expected:
          type: array
          items: { $ref: "#/components/schemas/ExpectedResource" }
        check: { $ref: "#/components/schemas/ExampleCheck" }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    ExpectedResource:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        title:
          {
            type: [string, "null"],
            description: null when the catalog no longer has it.,
          }

    ExampleCheck:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/ExampleCheckOutcome" }
        bestRank:
          {
            type: [integer, "null"],
            minimum: 1,
            description: Best rank of an expected result; null when none was found.,
          }
        resultCount: { type: [integer, "null"], minimum: 0 }
        checkedAt: { type: [string, "null"], format: date-time }

    ReviewStatus:
      type: string
      description: SUPERSEDED is set by a newer enrichment run of the same resource, never by a person.
      enum: [OPEN, ACCEPTED, REJECTED, SUPERSEDED]

    ReviewKind:
      type: string
      description: >-
        COURSE_CANDIDATE is a course page found by Scout and not yet in the catalog (no resource; the candidate in
        `details`).
        EXAMPLE_CANDIDATE is a home example a model drafted for the resource (the draft in `draft`: label, query,
        path, model); accepting it adds the example. RESOURCE_CANDIDATE is a product page found by the Scout's
        discovery and not yet in the catalog (no resource; the candidate in `details`: url, title, type, tags,
        snippet, foundBy); accepting it indexes it, unless another source listed the page
        meanwhile. KNOWN_TARGET_CANDIDATE is a vendor or service a rule proposes as a known target (no resource; the
        proposal in `details`: name, kind, rule, count, otherNames, examples);
        accepting it adds the known target, or adds its names to the target of the same kind that holds its
        name; a 409 says a name is taken. It is accepted one at a time.
      enum:
        [
          ENRICHMENT_VALIDATION,
          RELATIONSHIP_CANDIDATE,
          USER_REPORT,
          COURSE_CANDIDATE,
          EXAMPLE_CANDIDATE,
          RESOURCE_CANDIDATE,
          KNOWN_TARGET_CANDIDATE,
        ]

    AdminOverview:
      type: object
      required:
        [
          generatedAt,
          openReviewItems,
          enrichmentBacklog,
          budgets,
          recentRuns,
          failedRunsLast24h,
          homeExamples,
          overridesActive,
        ]
      properties:
        generatedAt: { type: string, format: date-time }
        openReviewItems:
          type: array
          description: Every kind, 0 when none waits.
          items: { $ref: "#/components/schemas/ReviewKindCount" }
        enrichmentBacklog:
          {
            type: integer,
            minimum: 0,
            description: Resources waiting for enrichment (the Scout takes them by its own order).,
          }
        budgets:
          type: array
          description: Every daily model budget, by name.
          items: { $ref: "#/components/schemas/BudgetToday" }
        webCredits:
          oneOf:
            [
              { $ref: "./common.yaml#/components/schemas/WebCredits" },
              { type: "null" },
            ]
          description: Live web search calls today; null when the metered source is off or its counter cannot answer.
        recentRuns:
          type: array
          description: The last Scout runs, newest first (at most 10).
          items: { $ref: "#/components/schemas/ScoutRun" }
        failedRunsLast24h: { type: integer, minimum: 0 }
        homeExamples: { $ref: "#/components/schemas/HomeExampleCounts" }
        overridesActive:
          {
            type: integer,
            minimum: 0,
            description: Runtime settings whose value is not the default now (ADR 0007).,
          }
        validationIssues:
          { $ref: "#/components/schemas/ValidationIssueSummary" }
        grafanaUrl:
          {
            type: [string, "null"],
            format: uri,
            description: "The metrics dashboard for trends (H2_ADMIN_GRAFANA_URL): an http(s) URL with a host and a path only, never user info, a query or a fragment; null when not set.",
          }

    ValidationIssueSummary:
      type: object
      description: >-
        The enrichment validation issues of the runs started in the last `days` days, read from each run's errors. An
        issue is its subject (a field with its name, a relationship with its kind, or a summary claim) and its rule,
        with quotes, parentheses and numbers taken out. The most frequent first, at most 10.
      required: [days, runs, top]
      properties:
        days: { type: integer, minimum: 1 }
        runs:
          {
            type: integer,
            minimum: 0,
            description: Runs with at least one issue.,
          }
        top:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ValidationIssueCount" }

    ValidationIssueCount:
      type: object
      required: [subject, rule, runs]
      properties:
        subject:
          {
            type: string,
            description: 'For example "field pricing", "relationship INTEGRATES_WITH", "summary claim".',
          }
        rule:
          {
            type: string,
            description: 'For example "the cited excerpt does not state the value", "excerpt length N outside N..N".',
          }
        runs: { type: integer, minimum: 1, description: Runs with this issue. }

    HomeExampleCounts:
      type: object
      description: >-
        The home examples of every locale (ADR 0028). Shown: ACTIVE and the check is PASS. Hidden: ACTIVE and the
        check is WEAK, FAIL or PENDING. Paused: PAUSED, whatever the check.
      required: [shown, hidden, paused]
      properties:
        shown:
          type: array
          description: Every path, 0 when none is shown.
          items: { $ref: "#/components/schemas/ExamplePathCount" }
        hidden:
          type: array
          description: WEAK, FAIL and PENDING, 0 when none; never PASS.
          items: { $ref: "#/components/schemas/ExampleOutcomeCount" }
        paused: { type: integer, minimum: 0 }

    ExamplePathCount:
      type: object
      required: [path, count]
      properties:
        path: { $ref: "./common.yaml#/components/schemas/AudiencePath" }
        count: { type: integer, minimum: 0 }

    ExampleOutcomeCount:
      type: object
      required: [outcome, count]
      properties:
        outcome: { $ref: "#/components/schemas/ExampleCheckOutcome" }
        count: { type: integer, minimum: 0 }

    EffectiveConfig:
      type: object
      required: [groups, publicApp]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/ConfigGroup" }
        publicApp:
          oneOf:
            [
              { $ref: "#/components/schemas/PublicAppPublication" },
              { type: "null" },
            ]
          description: >-
            What the public app wrote when it last started (ADR 0007); null when it has not started on this database
            yet, and then no group has app PUBLIC.

    PublicAppPublication:
      type: object
      required: [build, publishedAt]
      properties:
        build:
          {
            type: string,
            description: The public app's version when it wrote its settings.,
          }
        publishedAt: { type: string, format: date-time }

    ConfigGroup:
      type: object
      required: [id, title, app, settings]
      properties:
        id:
          {
            type: string,
            description: "A stable id: models, guide, search, scout, ...",
          }
        title: { type: string }
        app:
          type: string
          description: >-
            BACK_OFFICE: read from this app's own settings now. PUBLIC: a group only the public app has, as it wrote
            it at its last start.
          enum: [BACK_OFFICE, PUBLIC]
        settings:
          type: array
          items: { $ref: "#/components/schemas/ConfigSetting" }

    ConfigSetting:
      type: object
      required: [key, label, kind, value, unit, variable]
      properties:
        key: { type: string, description: "A stable id, <group>.<name>." }
        label: { type: string }
        kind:
          type: string
          description: >-
            How to read value. COUNT and CAP are whole numbers (CAP null = no cap); FLAG is true or false; DURATION is
            seconds; MODEL and VERSION are null when there is none; SCHEDULE is a Spring cron, UTC; NAMES are
            comma-separated.
          enum: [COUNT, CAP, FLAG, DURATION, MODEL, VERSION, SCHEDULE, NAMES]
        value:
          type: [string, "null"]
          maxLength: 500
          description: '"(hidden)" when the value has a quote, an @ or more than 500 characters.'
        unit:
          {
            type: [string, "null"],
            description: "The unit of a COUNT or CAP: calls a day, tokens, ...",
          }
        variable:
          {
            type: [string, "null"],
            description: The H2_ variable that sets it; null when the code or the chart fixes it.,
          }

    RuntimeSettings:
      type: object
      required: [overridesActive, settings, switches]
      properties:
        overridesActive:
          {
            type: integer,
            minimum: 0,
            description: Spending limits whose value is not the default now.,
          }
        settings:
          type: array
          description: The spending limits.
          items: { $ref: "#/components/schemas/RuntimeSettingState" }
        switches:
          type: array
          description: The switches, on or off.
          items: { $ref: "#/components/schemas/RuntimeSwitchState" }

    RuntimeSwitchState:
      type: object
      required:
        [
          key,
          label,
          help,
          variable,
          defaultOn,
          "on",
          overridden,
          inUse,
          version,
          history,
        ]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string, description: One line on what on and off do. }
        variable:
          {
            type: string,
            description: The H2_ variable (true or false) whose value is the default.,
          }
        defaultOn: { type: boolean, description: The H2_ value. }
        "on": { type: boolean, description: The value applied now. }
        overridden:
          {
            type: boolean,
            description: True when an administrator set the value; false when the default applies.,
          }
        inUse:
          {
            type: boolean,
            description: False when no module of this replica uses the switch; a change is kept and applies when it is.,
          }
        version:
          {
            type: integer,
            minimum: 0,
            description: The switch's newest change; send it back with a change. 0 = never changed.,
          }
        history:
          type: array
          description: The last changes, newest first (at most 10).
          items: { $ref: "#/components/schemas/RuntimeSwitchHistoryEntry" }

    RuntimeSwitchHistoryEntry:
      type: object
      required: [version, "on", changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        "on":
          {
            type: [boolean, "null"],
            description: The value set; null = back to the default.,
          }
        changedBy:
          {
            type: string,
            description: "The administrator's provider subject (GitHub: the numeric user id).",
          }
        changedAt: { type: string, format: date-time }
        reason: { type: [string, "null"] }

    RuntimeSwitchChange:
      type: object
      required: ["on", version]
      properties:
        "on": { type: boolean }
        version:
          {
            type: integer,
            minimum: 0,
            description: The version the change was made on.,
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    RuntimeSettingState:
      type: object
      required:
        [
          key,
          label,
          unit,
          help,
          min,
          max,
          variable,
          defaultValue,
          value,
          overridden,
          inUse,
          version,
          history,
        ]
      properties:
        key:
          {
            type: string,
            description: The setting's key on the Settings page (ConfigSetting.key).,
          }
        label: { type: string }
        unit:
          {
            type: string,
            description: "calls a day, calls a run, credits a day",
          }
        help:
          {
            type: string,
            description: One line on what the setting does and what 0 means.,
          }
        min:
          {
            type: integer,
            minimum: 0,
            description: Always 0; 0 turns the use off.,
          }
        max:
          {
            type: integer,
            minimum: 0,
            description: The absolute maximum,
            in code; more needs a pull request.,
          }
        variable:
          {
            type: string,
            description: The H2_ variable whose value is the default.,
          }
        defaultValue:
          {
            type: [integer, "null"],
            minimum: 0,
            description: The H2_ value; null = no cap,
            or the setting is not used on this replica.,
          }
        value:
          {
            type: [integer, "null"],
            minimum: 0,
            description: The value applied now; null = no cap.,
          }
        overridden:
          {
            type: boolean,
            description: True when an administrator set the value; false when the default applies.,
          }
        inUse:
          {
            type: boolean,
            description: False when no module of this replica uses the setting (the feature is off); a change is kept and applies when it is on.,
          }
        version:
          {
            type: integer,
            minimum: 0,
            description: The setting's newest change; send it back with a change. 0 = never changed.,
          }
        history:
          type: array
          description: The last changes, newest first (at most 10).
          items: { $ref: "#/components/schemas/RuntimeSettingHistoryEntry" }

    RuntimeSettingHistoryEntry:
      type: object
      required: [version, value, changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        value:
          {
            type: [integer, "null"],
            minimum: 0,
            description: The value set; null = back to the default.,
          }
        changedBy:
          {
            type: string,
            description: "The administrator's provider subject (GitHub: the numeric user id).",
          }
        changedAt: { type: string, format: date-time }
        reason: { type: [string, "null"] }

    RuntimeSettingChange:
      type: object
      required: [value, version]
      properties:
        value:
          {
            type: integer,
            minimum: 0,
            description: "0 to the setting's max; 0 turns the use off.",
          }
        version:
          {
            type: integer,
            minimum: 0,
            description: The version the change was made on.,
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    RuntimeSettingReset:
      type: object
      required: [version]
      properties:
        version:
          {
            type: integer,
            minimum: 0,
            description: The version the reset was made on.,
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    DiscoveryHostKind:
      type: string
      enum: [WRITING, DIRECTORY]
      description: WRITING publishes articles about many products; DIRECTORY lists products.

    DiscoveryHostEntry:
      type: object
      required: [host, kind, readsLists, addedBy, addedAt]
      properties:
        host: { type: string, maxLength: 253 }
        kind: { $ref: "#/components/schemas/DiscoveryHostKind" }
        readsLists:
          {
            type: boolean,
            description: Whether the list pages of this DIRECTORY host are read as lists; always false for a WRITING host.,
          }
        addedBy:
          {
            type: string,
            description: 'The administrator (provider subject), or "migration" for the first lists.',
          }
        addedAt: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 500 }

    DiscoveryHosts:
      type: object
      required: [hosts, max]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryHostEntry" }
        max:
          {
            type: integer,
            description: The most hosts the two lists hold together.,
          }

    DiscoveryHostAdd:
      type: object
      required: [host, kind]
      properties:
        host:
          {
            type: string,
            maxLength: 260,
            description: 'A host name such as "techcrunch.com"; no scheme or path.',
          }
        kind: { $ref: "#/components/schemas/DiscoveryHostKind" }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    DirectoryListReading:
      type: object
      required: [read]
      properties:
        read:
          {
            type: boolean,
            description: True to read the host's list pages,
            false to stop.,
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    DiscoveryHostRemove:
      type: object
      properties:
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    ListSeedEntry:
      type: object
      required: [id, kind, origin, address, addedBy, addedAt]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: The same for the same address; the remove path takes it.,
          }
        kind: { type: string, enum: [GITHUB_REPOSITORY, WEB_PAGE] }
        origin:
          type: string
          enum: [ADMINISTRATOR, DISCOVERY]
          description: >-
            ADMINISTRATOR = an administrator added it. DISCOVERY = discovery found the page on a directory host
            whose lists are read; such a list does not count against `max`.
        address:
          {
            type: string,
            description: 'A GitHub repository as "owner/name" in lower case, or the https address of a web page.',
          }
        addedBy:
          {
            type: string,
            description: The administrator who added it,
            or the id of the discovery collector that found it.,
          }
        addedAt: { type: string, format: date-time }
        reason: { type: [string, "null"] }

    ListSeeds:
      type: object
      required: [lists, max]
      properties:
        lists:
          type: array
          items: { $ref: "#/components/schemas/ListSeedEntry" }
        max:
          {
            type: integer,
            description: The most lists an administrator can add.,
          }

    ListSeedAdd:
      type: object
      required: [address]
      properties:
        address:
          {
            type: string,
            maxLength: 300,
            description: '"owner/name", "https://github.com/owner/name" or the https address of a web page.',
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    ListSeedRemove:
      type: object
      properties:
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    ShadowLibraryEntry:
      type: object
      required: [name, addedBy, addedAt]
      properties:
        name: { type: string, maxLength: 63 }
        addedBy:
          {
            type: string,
            description: 'The administrator (provider subject), or "migration" for the first list.',
          }
        addedAt: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 500 }

    ShadowLibraries:
      type: object
      required: [libraries, max]
      properties:
        libraries:
          type: array
          items: { $ref: "#/components/schemas/ShadowLibraryEntry" }
        max: { type: integer, description: The most names the list holds. }

    ShadowLibraryAdd:
      type: object
      required: [name]
      properties:
        name:
          {
            type: string,
            maxLength: 70,
            description: 'One host label, such as "libgen"; no dot.',
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    ShadowLibraryRemove:
      type: object
      properties:
        reason:
          {
            type: [string, "null"],
            maxLength: 500,
            description: "One plain line; a control or format character is a 400.",
          }

    KnownTargets:
      type: object
      required: [targets, max]
      properties:
        targets:
          type: array
          items: { $ref: "#/components/schemas/KnownTargetEntry" }
        max:
          { type: integer, description: The most known targets the list holds. }

    KnownTargetKind:
      type: string
      description: >-
        VENDOR: a company. SERVICE: what a resource connects to, not an AI resource itself. TOOL: an application a
        resource runs in or plugs into (an editor, a desktop app), not an AI resource itself.
      enum: [VENDOR, SERVICE, TOOL]

    KnownTargetEntry:
      type: object
      required:
        [id, kind, name, otherNames, addedBy, addedAt, origin, relationships]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/KnownTargetKind" }
        name: { type: string, description: The name shown on a relationship. }
        otherNames:
          type: array
          description: Other names that mean the same target.
          items: { type: string }
        addedBy:
          {
            type: string,
            description: 'An admin id, or "migration" for the first list.',
          }
        addedAt: { type: string, format: date-time }
        origin:
          type: string
          description: "CURATED: a person typed it. DISCOVERED: a rule proposed it and a person accepted the proposal."
          enum: [CURATED, DISCOVERED]
        relationships:
          {
            type: integer,
            description: The relationships that carry this target now.,
          }

    KnownTargetWrite:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/KnownTargetKind" }
        name: { type: string, maxLength: 60 }
        otherNames:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }

    ResourceRemoval:
      type: object
      required: [reason]
      properties:
        reason:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: Why the resource is removed; kept in the audit trail.,
          }

    AwesomeListCheck:
      type: object
      required: [checked, set, notAList, keptCurated, unavailable]
      properties:
        checked: { type: integer }
        set: { type: integer, description: Typed AWESOME_LIST now. }
        notAList: { type: integer, description: The README is not a link list. }
        keptCurated:
          { type: integer, description: An admin curated the type; left alone. }
        unavailable:
          {
            type: integer,
            description: The README could not be read now; run again later.,
          }

    AiCheckPage:
      type: object
      required: [notAboutAi, checked]
      properties:
        notAboutAi:
          type: array
          items: { $ref: "#/components/schemas/AiCheckRow" }
        checked:
          {
            type: integer,
            minimum: 0,
            description: Resources read on this page.,
          }
        next:
          {
            type: [string, "null"],
            description: The cursor of the next page; null at the end of the catalog.,
          }

    AiCheckRow:
      type: object
      required: [resourceId, title, type, popularity, waiting]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        type: { type: string }
        popularity: { type: number, minimum: 0, maximum: 1 }
        waiting:
          {
            type: boolean,
            description: "In the enrichment queue and not skipped: the one an admin can skip.",
          }

    EnrichmentQueuePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EnrichmentQueueEntry" }
        next:
          {
            type: [string, "null"],
            description: The cursor of the next page; null on the last page.,
          }

    EnrichmentQueueView:
      type: string
      description: "WAITING: the backlog in the Scout's order. SKIPPED: skipped by an admin. OUT_OF_RETRIES: failed runs reached the cap."
      enum: [WAITING, SKIPPED, OUT_OF_RETRIES]
      default: WAITING

    EnrichmentSkip:
      type: object
      properties:
        reason:
          {
            type: [string, "null"],
            maxLength: 200,
            description: Why the resource is skipped; optional.,
          }

    EnrichmentQueueEntry:
      type: object
      required: [resourceId, title, state, firstDiscoveredAt, failedRuns]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        state:
          type: string
          description: "PRIORITISED: moved to the top by an admin. WAITING: in its own part. SKIPPED: skipped by an admin. OUT_OF_RETRIES: failed runs reached the cap."
          enum: [PRIORITISED, WAITING, SKIPPED, OUT_OF_RETRIES]
        waiting:
          type: [string, "null"]
          description: "Why it waits; null when it does not (SKIPPED, OUT_OF_RETRIES). NEW: never enriched. MODEL_UNAVAILABLE: the last run found no model. RETRY: the last run FAILED and retries are left."
          enum: [NEW, MODEL_UNAVAILABLE, RETRY, null]
        skippedAt:
          {
            type: [string, "null"],
            format: date-time,
            description: When it was skipped; null unless SKIPPED.,
          }
        skipReason:
          {
            type: [string, "null"],
            description: The reason given when it was skipped.,
          }
        firstDiscoveredAt: { type: string, format: date-time }
        failedRuns:
          {
            type: integer,
            minimum: 0,
            description: Failed runs since an admin last requeued it; the number the cap is checked against.,
          }
        lastOutcome:
          {
            type: [string, "null"],
            enum: [VALIDATED, PARTIAL, REJECTED, LLM_UNAVAILABLE, FAILED, null],
          }
        lastRunAt: { type: [string, "null"], format: date-time }

    ReviewKindCount:
      type: object
      required: [kind, count]
      properties:
        kind: { $ref: "#/components/schemas/ReviewKind" }
        count: { type: integer, minimum: 0 }

    BudgetToday:
      type: object
      required: [name, dailyLimit]
      properties:
        name:
          {
            type: string,
            description: "guide, translation, enrichment, enrichment-gap, classifier, tool-guide, ...",
          }
        dailyLimit:
          {
            type: integer,
            description: Model calls a UTC day; 0 turns the use off.,
          }
        usedToday:
          {
            type: [integer, "null"],
            minimum: 0,
            description: Calls counted today across every replica; null when the shared counter cannot answer.,
          }

    ReviewItemPage:
      type: object
      required: [items, total]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/ReviewItem" } }
        total:
          {
            type: integer,
            description: Items with the requested status and kind,
            across all pages.,
          }

    ReviewItem:
      type: object
      required: [id, kind, status, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ReviewKind" }
        status: { $ref: "#/components/schemas/ReviewStatus" }
        resourceId: { type: [string, "null"], format: uuid }
        resourceTitle: { type: [string, "null"] }
        reason: { type: string }
        details:
          oneOf:
            [{ $ref: "#/components/schemas/ReviewDetails" }, { type: "null" }]
          description: >-
            What the item holds besides its reason, by shape. Null when it holds nothing, and for an EXAMPLE_CANDIDATE
            whose draft is in `draft`.
        draft:
          oneOf:
            [{ $ref: "#/components/schemas/DraftedExample" }, { type: "null" }]
          description: >-
            The drafted example of an EXAMPLE_CANDIDATE (ADR 0028, 0038); null for every other kind, and when the item
            holds no readable draft (then `details` has the TEXT shape).
        aiContent:
          oneOf:
            [
              { $ref: "./common.yaml#/components/schemas/AiContentMarker" },
              { type: "null" },
            ]
          description: >-
            Present when the item has a draft (EU AI Act Art. 50, ADR 0033): `fields` names `draft.label` and
            `draft.query`, paths in this item, and `models` the draft's model. Null for every other item.
        categories:
          type: array
          items: { type: string }
          description: >-
            The discovery categories of a resource candidate (its tags, e.g. `coding`, `self-hosted`); empty for every
            other kind.
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
        resolvedBy: { type: [string, "null"] }
        alreadyListed:
          oneOf:
            [{ $ref: "#/components/schemas/AlreadyListed" }, { type: "null" }]
          description: >-
            Only in the answer to accepting a resource candidate whose address the catalog already lists (ADR 0013):
            the listed resource, so the page can link to it. Null otherwise.

    ReviewDetails:
      description: >-
        The details of a review item, one shape each (`shape` says which). CANDIDATE: a RESOURCE_CANDIDATE, and a
        COURSE_CANDIDATE found as a candidate. KNOWN_TARGET_PROPOSAL: a KNOWN_TARGET_CANDIDATE. TEXT: every other
        kind (the validation errors of an ENRICHMENT_VALIDATION, why a RELATIONSHIP_CANDIDATE is not verified, the
        note of a USER_REPORT), and under any kind a stored value that does not read as its shape: the page shows it
        as it is stored.
      oneOf:
        - $ref: "#/components/schemas/ReviewTextDetails"
        - $ref: "#/components/schemas/ReviewCandidateDetails"
        - $ref: "#/components/schemas/ReviewKnownTargetProposalDetails"
      discriminator:
        propertyName: shape
        mapping:
          TEXT: "#/components/schemas/ReviewTextDetails"
          CANDIDATE: "#/components/schemas/ReviewCandidateDetails"
          KNOWN_TARGET_PROPOSAL: "#/components/schemas/ReviewKnownTargetProposalDetails"

    ReviewDetailsShape:
      type: string
      description: Which shape the details have. Each shape holds its own value, and only that one.
      enum: [TEXT, CANDIDATE, KNOWN_TARGET_PROPOSAL]

    ReviewTextDetails:
      type: object
      required: [shape, text]
      properties:
        shape: { $ref: "#/components/schemas/ReviewDetailsShape" }
        text: { type: string }

    ReviewCandidateDetails:
      type: object
      description: A page a collector found and the catalog does not list yet (ADR 0013, 0038).
      required: [shape, revision, url, title, type, tags, foundBy, edited]
      properties:
        shape: { $ref: "#/components/schemas/ReviewDetailsShape" }
        revision:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            Names the candidate as stored now. It changes when a collector finds the page again or an admin edits it.
            An edit sends it back as `expectedRevision`.
        url: { type: string, description: An https address. }
        title: { type: string }
        type:
          type: string
          description: A resource type, as stored (an old candidate may hold a type the catalog no longer has).
        tags:
          type: array
          items: { type: string }
        snippet: { type: [string, "null"] }
        foundBy:
          type: array
          description: The ids of the sources that found the page, first finder first.
          items: { type: string }
        edited:
          type: array
          description: The values an admin changed (`title`, `type`, `tags`, `canonicalUrl`, a confirmed value).
          items: { type: string }

    ReviewKnownTargetProposalDetails:
      type: object
      description: A vendor, service or tool a rule proposes as a known target (ADR 0019).
      required: [shape, name, kind, rule, count, examples, otherNames, edited]
      properties:
        shape: { $ref: "#/components/schemas/ReviewDetailsShape" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/KnownTargetKind" }
        rule:
          type: string
          description: "The rule that found it. OWNER: it owns `count` resources."
          enum: [OWNER]
        count: { type: integer }
        examples:
          type: array
          description: The titles of some of the resources the rule counted.
          items: { type: string }
        otherNames:
          type: array
          items: { type: string }
        edited:
          {
            type: boolean,
            description: An admin changed the name,
            the kind or the other names.,
          }

    AlreadyListed:
      type: object
      required: [resourceId, title]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }

    DraftedExample:
      type: object
      required: [label, query, path, model]
      description: >-
        A home example a model drafted, as it waits for review. The label and the query are AI-written, by `model`
        (EU AI Act Art. 50, ADR 0033): the review page labels them and marks them `data-ai-generated`.
      properties:
        label: { type: string }
        query: { type: string }
        path: { $ref: "./common.yaml#/components/schemas/AudiencePath" }
        model: { type: string, description: The model that drafted it. }

    ReviewBulkResolution:
      type: object
      required: [ids, status]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            Each id once. A repeated id is refused with 400. The list is not declared uniqueItems on purpose: a set would
            drop the repeat before the server sees it.
          items: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        note: { type: [string, "null"], maxLength: 1000 }

    RelationshipTargetGroupPage:
      type: object
      required: [items, total]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/RelationshipTargetGroup" },
          }
        total:
          { type: integer, minimum: 0, description: Groups across all pages. }

    RelationshipTargetGroup:
      type: object
      required: [key, name, items, kinds, examples]
      properties:
        key: { type: string, description: The target key the group is made of. }
        name:
          { type: string, description: The name as most of its items write it. }
        items:
          { type: integer, minimum: 1, description: Open items in the group. }
        kinds:
          type: array
          items:
            {
              type: string,
              enum: [INTEGRATES_WITH, USES, SUPPORTS, COMPATIBLE_WITH, ABOUT],
            }
        examples:
          type: array
          maxItems: 3
          description: Titles of up to three resources that name this target, oldest item first.
          items: { type: string }

    RelationshipTargetGroupDecision:
      type: object
      required: [key, decision]
      properties:
        key: { type: string, minLength: 1, maxLength: 300 }
        decision: { type: string, enum: [LINK, VENDOR, SERVICE, TOOL, REJECT] }
        resourceId:
          {
            type: string,
            format: uuid,
            description: Required for LINK,
            not allowed otherwise.,
          }
        note: { type: [string, "null"], maxLength: 1000 }

    RelationshipTargetGroupOutcome:
      type: object
      required: [batch, decided, skipped, left]
      properties:
        batch:
          {
            type: string,
            format: uuid,
            description: The id in the audit entries of this decision (`bulk:<batch>`).,
          }
        decided: { type: integer, minimum: 0 }
        skipped:
          {
            type: integer,
            minimum: 0,
            description: Items that stay as they are (decided meanwhile,
            or the link does not fit them).,
          }
        left:
          {
            type: integer,
            minimum: 0,
            description: Items of the group past the 1000 of one call.,
          }

    ReviewBulkResult:
      type: object
      required: [batch, items]
      properties:
        batch:
          {
            type: string,
            format: uuid,
            description: The id in the audit entries of this batch (`bulk:<batch>`).,
          }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewBulkItem" }

    ReviewBulkItem:
      type: object
      required: [id, outcome]
      properties:
        id: { type: string, format: uuid }
        outcome:
          type: string
          description: >-
            RESOLVED: decided now. NOT_OPEN: already decided. NOT_FOUND: no such item. NOT_ALLOWED: this item cannot be
            accepted in bulk (it adds to the catalog or publishes, or its run has a conflict on license, open source or
            pricing); it stays open.
          enum: [RESOLVED, NOT_OPEN, NOT_FOUND, NOT_ALLOWED]

    CandidateEdit:
      type: object
      description: At least one value; null leaves it as it is.
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            The `revision` of the item's `details` as the admin saw them: 64 lower-case hex characters, or the edit is
            refused with 400. The edit applies only to that revision: when the candidate changed since (a collector
            found the page again, another admin edited it), it is refused with 409 `version-conflict`.
        title: { type: [string, "null"], minLength: 1, maxLength: 300 }
        type:
          oneOf:
            [{ $ref: "#/components/schemas/CandidateType" }, { type: "null" }]
        tags:
          type: [array, "null"]
          maxItems: 12
          items:
            { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 40 }
        canonicalUrl:
          {
            type: [string, "null"],
            maxLength: 2000,
            description: An https URL.,
          }
        pricing:
          {
            type: [string, "null"],
            maxLength: 40,
            description: "FREE, FREEMIUM, PAID or OPEN_SOURCE_SELF_HOSTED.",
          }
        openSource: { type: [boolean, "null"] }
        license: { type: [string, "null"], pattern: "^[A-Za-z0-9.+-]{2,40}$" }
        audience:
          {
            type: [string, "null"],
            maxLength: 40,
            description: "USE_AI, BUILD_WITH_AI or BOTH.",
          }
        techLevel:
          {
            type: [string, "null"],
            maxLength: 40,
            description: "BEGINNER, INTERMEDIATE or ADVANCED.",
          }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        descriptionWrittenByAi:
          type: [boolean, "null"]
          description: >-
            True when the description is the research model's text, confirmed as it is: the resource keeps it as
            AI-written (AI_SUMMARY) and the public site labels it. False or null: the admin wrote it (CURATED).
        language: { type: [string, "null"], pattern: "^(simple|[a-z]{2})$" }
        publishedAt: { type: [string, "null"], format: date }

    ResourceField:
      type: string
      description: >-
        A field of a resource. The enrichment fills type to platforms (ADR 0014), and only those can be dropped. An
        admin sets every field but useCase and platforms (ADR 0038).
      enum:
        [
          type,
          pricing,
          license,
          openSource,
          techLevel,
          audience,
          useCase,
          platforms,
          language,
          publishedAt,
          description,
        ]

    ResourceFieldValue:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 4000 }

    CandidateType:
      type: string
      description: The types a resource or course candidate may have (ADR 0013, 0012, 0031, 0038).
      enum:
        [
          PRODUCT,
          AGENT,
          PROMPT,
          SKILL,
          MCP_SERVER,
          LIBRARY,
          MODEL,
          DATASET,
          ARTICLE,
          NEWS,
          EVENT,
          COURSE,
          AWESOME_LIST,
        ]

    RelationshipTargetChange:
      type: object
      description: Exactly one of the three.
      properties:
        resourceId: { type: [string, "null"], format: uuid }
        newResource:
          oneOf:
            [{ $ref: "#/components/schemas/NewResource" }, { type: "null" }]
        title: { type: [string, "null"], minLength: 1, maxLength: 120 }

    NewResource:
      type: object
      required: [title, url, type]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        url:
          {
            type: string,
            maxLength: 2000,
            description: The official https address.,
          }
        type:
          {
            type: string,
            enum:
              [
                PRODUCT,
                MODEL,
                AGENT,
                PROMPT,
                SKILL,
                MCP_SERVER,
                LIBRARY,
                DATASET,
              ],
          }

    ReviewEvidence:
      type: object
      required:
        [item, validationErrors, fields, directoryLists, directoryRatings]
      properties:
        item: { $ref: "#/components/schemas/ReviewItem" }
        run:
          oneOf: [{ $ref: "#/components/schemas/ReviewRun" }, { type: "null" }]
          description: The enrichment run the item links to; null for items with no run.
        validationErrors:
          type: array
          maxItems: 50
          items: { type: string }
          description: What the code check refused in the run, in its words. Each error can quote the refused model output, so aiContent lists it as AI-written. Empty for a relationship candidate.
        fields:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ReviewField" }
          description: The fields the run stored, CONFLICTING first, then UNVERIFIED, VERIFIED and REJECTED. Empty for a relationship candidate.
        directoryLists:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DirectoryList" }
          description: >-
            The lists on directory hosts that name the item's resource, by title (ADR 0055). The public page gives
            only their number. Empty for an item with no resource.
        directoryRatings:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DirectoryRatingSource" }
          description: >-
            The figures directories state for the item's resource, by host (ADR 0056). The public page gives only
            the rating made from them and the number of directories. Empty for an item with no resource.
        relationship:
          oneOf:
            [
              { $ref: "#/components/schemas/ReviewRelationship" },
              { type: "null" },
            ]
          description: The relationship a relationship candidate is about; null for every other kind.
        aiContent:
          oneOf:
            [
              { $ref: "./common.yaml#/components/schemas/AiContentMarker" },
              { type: "null" },
            ]
          description: >-
            Present when the evidence holds AI-written values (ADR 0033): the run's values, and a drafted example's
            `item.draft.label` and `item.draft.query`, also for an item with no run.

    DirectoryRatingSource:
      type: object
      required: [host, page, average, scale, votes, readAt]
      properties:
        host: { type: string, description: The directory host. }
        page:
          {
            type: string,
            format: uri,
            description: The list page or the page of the item that states the figures.,
          }
        average:
          { type: number, description: The average as the page states it. }
        scale:
          {
            type: integer,
            minimum: 5,
            maximum: 100,
            description: "The scale the page states for the average: 5, 10 or 100.",
          }
        votes:
          {
            type: integer,
            minimum: 1,
            description: "The number of votes, reviews or ratings the page states.",
          }
        readAt:
          {
            type: string,
            format: date-time,
            description: When the page was read.,
          }

    DirectoryList:
      type: object
      required: [title, page, headingPath]
      properties:
        title: { type: string, description: "The list's title in the catalog." }
        page:
          {
            type: string,
            format: uri,
            description: The address of the list page on the directory host.,
          }
        headingPath:
          {
            type: string,
            maxLength: 200,
            description: The headings above the entry; empty when the entry has none.,
          }

    ReviewRun:
      type: object
      required: [id, provider, model, promptVersion, outcome, startedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        outcome:
          {
            type: string,
            enum: [VALIDATED, PARTIAL, REJECTED, LLM_UNAVAILABLE, FAILED],
          }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        extraEvidence:
          type: [string, "null"]
          description: The README or model card the run read in its gap round (ADR 0014), e.g. `github-readme:owner/name`.

    ReviewField:
      type: object
      required: [field, value, origin, verification, quotes]
      properties:
        field: { type: string }
        value: { type: string, description: AI-written. }
        origin: { $ref: "./common.yaml#/components/schemas/ValueOrigin" }
        verification: { $ref: "./common.yaml#/components/schemas/Verification" }
        quotes:
          {
            type: array,
            maxItems: 5,
            items: { $ref: "#/components/schemas/ReviewQuote" },
          }

    ReviewRelationship:
      type: object
      required: [kind, target, verification, origin, quotes]
      properties:
        kind:
          {
            type: string,
            enum: [INTEGRATES_WITH, USES, SUPPORTS, COMPATIBLE_WITH, ABOUT],
          }
        target:
          {
            type: string,
            description: The name the model gave (AI-written),
            or the one an admin chose.,
          }
        targetId:
          {
            type: [string, "null"],
            format: uuid,
            description: The catalog resource of that name; null when none.,
          }
        verification: { $ref: "./common.yaml#/components/schemas/Verification" }
        origin: { $ref: "./common.yaml#/components/schemas/ValueOrigin" }
        targetOrigin:
          description: CURATED when an admin chose the target (ADR 0038); the target then is not AI-written. Null otherwise.
          oneOf:
            [
              { $ref: "./common.yaml#/components/schemas/ValueOrigin" },
              { type: "null" },
            ]
        quotes:
          {
            type: array,
            maxItems: 5,
            items: { $ref: "#/components/schemas/ReviewQuote" },
          }

    ReviewQuote:
      type: object
      required: [sourceUrl, retrievedAt]
      description: Copied from a source, not AI-written.
      properties:
        excerpt: { type: [string, "null"], maxLength: 500 }
        sourceUrl:
          {
            type: string,
            description: As the source gave it; a page shows it as a link only when it is http(s).,
          }
        sourceId:
          {
            type: [string, "null"],
            description: The source the quote was read from; null for a page the run read itself.,
          }
        retrievedAt: { type: string, format: date-time }

    ReviewResolution:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        note: { type: [string, "null"], maxLength: 1000 }

    AuditEntryPage:
      type: object
      required: [items, total]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        total: { type: integer, description: Entries across all pages. }

    AuditEntry:
      type: object
      required: [id, adminId, action, at, outcome]
      properties:
        id: { type: string, format: uuid }
        adminId:
          {
            type: string,
            description: "The administrator's provider subject (GitHub: the numeric user id); `system` for an action no administrator took (REMOVE_GONE_LIST_SEED).",
          }
        action:
          {
            type: string,
            enum:
              [
                RESOLVE_REVIEW_ITEM,
                START_SCOUT_RUN,
                ADD_HOME_EXAMPLE,
                CHANGE_HOME_EXAMPLE,
                REMOVE_HOME_EXAMPLE,
                DRAFT_HOME_EXAMPLES,
                RECHECK_ENRICHMENT,
                BACKFILL_CATEGORIES,
                REQUEUE_ENRICHMENT,
                SKIP_ENRICHMENT,
                PRIORITISE_ENRICHMENT,
                CHANGE_SETTING,
                ADD_DISCOVERY_HOST,
                REMOVE_DISCOVERY_HOST,
                CHANGE_RELATIONSHIP_TARGET,
                ADD_RESOURCE,
                EDIT_CANDIDATE,
                SET_FIELD,
                DROP_FIELD,
                ADD_KNOWN_TARGET,
                EDIT_KNOWN_TARGET,
                REMOVE_KNOWN_TARGET,
                ADD_SHADOW_LIBRARY,
                REMOVE_SHADOW_LIBRARY,
                REMOVE_RESOURCE,
                ADD_LIST_SEED,
                REMOVE_LIST_SEED,
                READ_DIRECTORY_LISTS,
                REMOVE_GONE_LIST_SEED,
              ],
          }
        targetId:
          {
            type: [string, "null"],
            description: "The review item id, the source id, the home example id, the resource id or the setting's key; null when a run covered every source.",
          }
        at: { type: string, format: date-time }
        outcome:
          {
            type: string,
            description: "ACCEPTED, REJECTED, NOT_OPEN or NOT_FOUND for a review item, NOT_ALLOWED for one refused in bulk, followed by bulk:<batch> when decided in bulk; STARTED or BUSY for a Scout run; STARTED for a category backfill; ADDED, CHANGED, PAUSED, ACTIVATED, REMOVED, DUPLICATE, CONFLICT, INVALID or NOT_FOUND for a home example; REQUEUED, REQUEUED_RESET, SKIPPED, PRIORITISED, NOT_FOUND, NOT_STOPPED, NOT_WAITING, ALREADY_SKIPPED, ALREADY_PRIORITISED or TOP_FULL for the enrichment queue; CHANGED, RESET, OUT_OF_RANGE or CONFLICT for a runtime setting. LINKED <resource id> or RENAMED for a relationship target; ADDED for a resource added from the review list. EDITED <fields> for a resource candidate. SET <field> or DROPPED <field> <count> for a resource field. REMOVED for a discovered list that is gone at its site.",
          }
        before:
          {
            type: [string, "null"],
            maxLength: 1000,
            description: 'The value before the action ("default" for the default of a setting), at most 1000 characters; null when the action has none.',
          }
        after:
          {
            type: [string, "null"],
            maxLength: 1000,
            description: "The value after the action, at most 1000 characters; null when the action has none.",
          }
        reason:
          {
            type: [string, "null"],
            maxLength: 1000,
            description: "Why the administrator acted (optional; an administrator types at most 500 characters), or what made the system act: for a discovered list that is gone at its site, the number of checks and the time of the first one. The entry holds at most 1000 characters.",
          }

    EnrichmentRecheck:
      type: object
      description: Counts only (ADR 0014).
      required: [checked, fieldsRejected, claimsDropped, runsRequested]
      properties:
        checked:
          {
            type: integer,
            minimum: 0,
            description: Resources whose stored answer was checked.,
          }
        fieldsRejected:
          {
            type: integer,
            minimum: 0,
            description: Verified pricing,
            type or use case values whose quotes do not state them.,
          }
        claimsDropped:
          {
            type: integer,
            minimum: 0,
            description: Summary sentences that failed the claim check.,
          }
        runsRequested:
          {
            type: integer,
            minimum: 0,
            description: Resources put back in the enrichment backlog.,
          }

    ScoutRunRequest:
      type: object
      properties:
        sourceId:
          {
            type: [string, "null"],
            description: Omit to run every enabled collector.,
          }

    ScoutRun:
      type: object
      required: [id, sourceId, status, startedAt, itemsSeen, itemsChanged]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, SKIPPED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        itemsSeen: { type: integer }
        itemsChanged: { type: integer }
        enrichmentsQueued:
          {
            type: integer,
            description: "Changed resources this run enriched with an answer of which something was kept. Failed and rejected enrichments are counted in the message.",
          }
        message: { type: [string, "null"] }

    ReviewResearchStart:
      type: object
      properties:
        itemIds:
          { type: array, maxItems: 500, items: { type: string, format: uuid } }
        allOpen:
          type: boolean
          default: false
          description: Every open resource and course candidate with no active run and no DONE run as its newest.

    ReviewResearchEstimate:
      type: object
      required: [items, maxModelCalls, alreadyResearched]
      properties:
        items:
          type: integer
          description: Open resource and course candidates with no queued or running run and no DONE run as their newest.
        maxModelCalls:
          {
            type: integer,
            format: int64,
            description: At most 14 model calls per item.,
          }
        alreadyResearched:
          type: integer
          description: >-
            Open resource and course candidates with no queued or running run whose newest run is DONE; all open
            skips them.

    ReviewResearchRuns:
      type: object
      required: [runs]
      properties:
        runs:
          {
            type: array,
            items: { $ref: "#/components/schemas/ReviewResearchRun" },
          }

    ReviewResearchRun:
      type: object
      required:
        [
          id,
          itemId,
          status,
          model,
          requestedAt,
          steps,
          promptTokens,
          completionTokens,
        ]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        status:
          { type: string, enum: [QUEUED, RUNNING, DONE, FAILED, CANCELLED] }
        model: { type: string }
        requestedAt: { type: string, format: date-time }
        startedAt:
          type: [string, "null"]
          format: date-time
          description: When this attempt started. It changes when a run put back in the queue starts again.
        finishedAt: { type: [string, "null"], format: date-time }
        steps: { type: integer }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        verdict:
          { type: [string, "null"], enum: [KEEP, REJECT, DUPLICATE, null] }
        error: { type: [string, "null"] }

    ReviewResearchDetail:
      type: object
      required: [run, steps]
      properties:
        run: { $ref: "#/components/schemas/ReviewResearchRun" }
        result:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/ReviewResearchResult" },
                { type: "null" },
              ],
          }
        steps:
          {
            type: array,
            items: { $ref: "#/components/schemas/ReviewResearchStep" },
          }

    ReviewResearchResult:
      type: object
      description: >-
        The checked answer (ADR 0048 §6). The status of each attribute is computed by code from the citations that
        are found in the evidence of this run; `dropped` says which citations did not count and why. Every value is a
        proposal written with AI: the admin confirms it before it reaches the catalog.
      required: [verdict, reason, attributes, dropped, aiWritten]
      properties:
        verdict: { type: string, enum: [KEEP, REJECT, DUPLICATE] }
        reason: { type: string }
        duplicateOf: { type: [string, "null"] }
        aiWritten:
          {
            type: boolean,
            description: "Always true: machine-readable AI marking (EU AI Act Art. 50).",
          }
        attributes:
          type: array
          items:
            type: object
            required: [name, proposed, status, sources]
            properties:
              name: { type: string }
              current: { type: [string, "null"] }
              proposed: { type: array, items: { type: string } }
              status:
                {
                  type: string,
                  enum: [CONFIRMED, SINGLE_SOURCE, CONFLICT, NOT_FOUND],
                }
              sources:
                type: array
                items:
                  type: object
                  required:
                    [evidenceId, tool, url, excerpt, value, authoritative]
                  properties:
                    evidenceId: { type: string }
                    tool: { type: string }
                    url: { type: string }
                    excerpt: { type: string }
                    value: { type: string }
                    authoritative: { type: boolean }
        dropped: { type: array, items: { type: string } }

    ReviewResearchStep:
      type: object
      required: [seq, kind, name, request, durationMs, at]
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [MODEL_CALL, TOOL_CALL, CHECK] }
        name: { type: string }
        request:
          {
            type: string,
            description: Plain text. Show it as text,
            never as HTML.,
          }
        response:
          {
            type: [string, "null"],
            description: Plain text. Show it as text,
            never as HTML.,
          }
        error: { type: [string, "null"] }
        durationMs: { type: integer, format: int64 }
        promptTokens: { type: [integer, "null"] }
        completionTokens: { type: [integer, "null"] }
        at: { type: string, format: date-time }
