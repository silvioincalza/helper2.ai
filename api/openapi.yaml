openapi: 3.1.0
info:
  title: Helper2.ai API
  version: 2.0.0
  summary: Federated metasearch for AI resources, with explicit provenance and source status.
  description: |
    Contract-first REST API for Helper2.ai. This file is the source of truth:
    the Spring backend generates its controller interfaces and DTOs from it, and the
    React frontend generates its TypeScript types from it.

    Honesty rules encoded in the contract:
    * Every search response lists every configured source and what happened to it.
    * Every date is a `DateFact`, which can say "unknown"; nothing is invented.
    * Every field value carries an `origin` (source-provided, AI-extracted, curated, ...).
    * Relationships and AI-extracted facts carry a `verification` status and evidence.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
tags:
  - name: search
  - name: resources
  - name: guide-stream
  - name: setup
  - name: sources
  - name: categories
  - name: me
  - name: admin
  - name: review
  - name: audit
  - name: overview
  - name: enrichment-queue
  - name: settings
  - name: runtime-settings
  - name: discovery-hosts
  - name: examples
  - name: examples-admin
  - name: policy

paths:
  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search once across all configured sources.
      description: |
        Queries every enabled source in parallel with a per-source timeout. A slow or failed
        source never blocks the others; its outcome is reported in `sources[]` and the
        response is marked partial in `coverage`.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - name: path
          in: query
          description: Audience path. Changes ranking emphasis only; never hides results.
          schema: { $ref: '#/components/schemas/AudiencePath' }
        - { name: type, in: query, schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ResourceType' } }, style: form, explode: true }
        - { name: source, in: query, schema: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }, style: form, explode: true }
        - { name: license, in: query, description: "SPDX-ish license id, or `unknown`.", schema: { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }, style: form, explode: true }
        - { name: openSource, in: query, schema: { $ref: '#/components/schemas/TriState' } }
        - { name: pricing, in: query, schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PricingFilter' } }, style: form, explode: true }
        - { name: platform, in: query, schema: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }, style: form, explode: true }
        - { name: useCase, in: query, schema: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }, style: form, explode: true }
        - { name: techLevel, in: query, schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/TechLevelFilter' } }, style: form, explode: true }
        - { name: audience, in: query, schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Audience' } }, style: form, explode: true }
        - { name: updatedAfter, in: query, description: "Only results whose last-updated date is known and on/after this day.", schema: { type: string, format: date } }
        - name: category
          in: query
          description: >-
            Category ids from GET /categories (ADR 0053), or `unknown` for results with no category yet. A result in any
            of them is kept (OR); with the other filters it is AND. An id that is not a category is a 400.
          schema: { type: array, maxItems: 40, items: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 30 } }
          style: form
          explode: true
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/SortOrder' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 50, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Aggregated (possibly partial) results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /recent:
    get:
      tags: [resources]
      operationId: listRecent
      summary: Newest resources in the Helper2 index, by the publication date their source states.
      description: |
        For the home page "Today" list. Only resources whose source states a publication date, from
        `days` ago up to now, newest first; never Helper2's discovery date. Served from the index, so it
        does not call live sources.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 14 } }
        - { name: type, in: query, schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ResourceType' } }, style: form, explode: true }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
      responses:
        '200':
          description: Newest resources (possibly empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /events/upcoming:
    get:
      tags: [resources]
      operationId: listUpcomingEvents
      summary: Next AI events (conferences and industry events), soonest first.
      description: |
        For the home page "Coming up" list. Only EVENTs whose source states when they take place and
        that have not ended yet; an event without a stated date is never listed. With `days`, only events
        that start before the end of that window (counted from the start of today, UTC); an event already
        running is listed until it ends. Served from the index.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 6 } }
      responses:
        '200':
          description: Upcoming events (possibly empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpcomingEventsResponse' }
        '400': { $ref: '#/components/responses/Problem' }
  /resources/{id}:
    get:
      tags: [resources]
      operationId: getResource
      summary: Resource detail with provenance, evidence and relationships.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resource detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /resources/{id}/setup:
    get:
      tags: [setup]
      operationId: getResourceSetup
      summary: How to install, configure and connect this resource to AI tools, from its source data only.
      description: |
        The setup facts come only from the resource's own source records, fetched at request time with their
        retrieval time: for an MCP server, its entry in the Official MCP Registry (remote URL or package,
        transport, environment variables). Each AI client's snippet is generated from those facts with the
        format that client's own documentation states (`docsUrl`). A client that cannot use an option is
        listed with the reason instead of a snippet. Nothing is invented: when the sources state no setup
        data, `options` is empty and the answer says so.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Setup guide (possibly without options when the sources state none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupGuide' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /resources/{id}/guide:
    post:
      tags: [setup]
      operationId: askResourceGuide
      summary: Step-by-step guide for one tool from its own documentation.
      description: |
        Reads the tool's own documents (GitHub README, npm package README, Hugging Face model or Space card) from
        fixed hosts. A model may only pick and order passages from them; a deterministic check keeps a step only
        when its quote is found in the cited document and its command is whole lines of one code block (or one
        inline code span) of that document, exactly as written. The answer is the full guide (requirements,
        install, configure, use, connect) and is the same for every visitor. POST because it can call a model: it
        shares the guide's rate limit and has its own daily cap. `status` says when there is nothing to show and why.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Guide (possibly without steps; see status).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolGuide' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /resources/{id}/reports:
    post:
      tags: [resources]
      operationId: reportResource
      summary: Report wrong or outdated information. Goes to the human review queue.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueReportRequest' }
      responses:
        '202':
          description: Accepted for review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueReportAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /guide/stream:
    post:
      # Own tag: the stream is a hand-written SseEmitter handler (the generator has no SseEmitter return type).
      tags: [guide-stream]
      operationId: askGuideStream
      summary: Ask the AI guide which catalog resources fit a need, and receive each step as a server-sent event while it works.
      description: |
        Retrieval first, AI second. The request is turned into search terms (fast model), real
        candidates are retrieved with the normal federated search, and the reasoning model may only
        choose among those candidates. A deterministic validator drops any recommendation that was
        not a candidate or whose quote does not appear in the candidate's own text. Without a model
        the guide degrades to the top search results with status LLM_UNAVAILABLE.

        The answer comes as `text/event-stream` so the client can show real progress. Events, in this order (a step that does not happen is skipped; nothing is invented). The event
        names are the values of `GuideStreamEvent`:

        | event | data | when |
        |---|---|---|
        | `planned` | `GuideStreamPlanned` | the fast model turned the need into search terms |
        | `understood` | `GuideStreamUnderstood` | how the question was read: intent, subjects, period (also without a model, from fixed rules) |
        | `clarify` | `GuideClarification` | the question is too vague, or its one subject names different kinds of resource; it is followed only by `answer` (status NEEDS_CLARIFICATION) |
        | `retrieved` | `GuideStreamRetrieved` | federated search returned the candidates |
        | `chosen` | `GuideStreamChosen` | the reasoning model proposed its picks |
        | `validated` | `GuideStreamValidated` | the validator kept or rejected each pick |
        | `checked` | `GuideStreamChecked` | a second model call checked each kept pick's reason against its quote |
        | `answer` | `GuideResponse` | always last on success |
        | `error` | `Problem` | always last on failure |

        A cached answer is sent as a single `answer` event. There is no retry on the server: a client
        must not reconnect automatically, because each question costs model calls. When too many
        questions are running, the stream is one `error` event with status 503; past the deadline the
        question is cancelled and the last event is an `error` with status 504. Shares the rate limit
        of `POST /resources/{id}/guide`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuideRequest' }
      responses:
        '200':
          description: Stream of guide events; see the table above for each event's data schema.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: Disclosed source registry with last known health, response time, circuit state and web credits.
      description: >-
        Public and rate-limited like every API path. Response time and circuit state are measured by the replica that
        answers (each replica calls the sources on its own); the web credits are counted in Redis for the whole cluster.
      responses:
        '200':
          description: All configured sources, enabled or not.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceInfo' }

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: The categories of the AI world search can filter by, in the order people see them.
      description: >-
        Read from the running configuration (`helper2.categories`, ADR 0051, 0053). The same answer for everyone, no
        personal data; cached for an hour and validated by its ETag. Rate-limited like the other public reads.
      responses:
        '200':
          description: Every category, in the configured order.
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=3600' }
            ETag: { schema: { type: string }, description: 'Changes when a category is added, removed or renamed.' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '304': { description: Not modified (If-None-Match matched the ETag). }
        '429': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current session. Anonymous use is fully supported.
      responses:
        '200':
          description: Session info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
    delete:
      tags: [me]
      operationId: deleteMyAccount
      summary: Delete the signed-in user's account and bookmarks, and end the session.
      description: >-
        Needs the X-XSRF-TOKEN header. Issue reports the user sent stay, without the reporter. Signing in again
        creates a new, empty account.
      responses:
        '204': { description: Account deleted and signed out. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /me/preferences:
    patch:
      tags: [me]
      operationId: changePreferences
      summary: Change the signed-in user's display settings. Fields left out stay as they are.
      description: Needs the X-XSRF-TOKEN header. The settings live with the account and go when it is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesChange' }
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /me/bookmarks:
    get:
      tags: [me]
      operationId: listBookmarks
      responses:
        '200':
          description: Server-side bookmarks of the signed-in user.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Bookmark' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [me]
      operationId: mergeLocalBookmarks
      summary: Merge the bookmarks kept in the browser into the account, right after sign-in.
      description: >-
        Idempotent: a resource already saved keeps its first savedAt. All or nothing: an invalid URL, or more than 500
        bookmarks in the account afterwards, refuses the whole request with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/BookmarkRequest' }
      responses:
        '200':
          description: Full bookmark list after merge.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Bookmark' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /me/bookmarks/{resourceId}:
    put:
      tags: [me]
      operationId: addBookmark
      summary: Save one resource. Saving it again changes nothing (the first savedAt stays).
      description: An account keeps at most 500 bookmarks; one more is refused with 400.
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkRequest' }
      responses:
        '200':
          description: The saved bookmark.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bookmark' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [me]
      operationId: deleteBookmark
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed (idempotent). }
        '401': { $ref: '#/components/responses/Problem' }

  /admin/review-items:
    get:
      tags: [admin]
      operationId: listReviewItems
      parameters:
        - { name: status, in: query, description: Omit for every status., schema: { $ref: '#/components/schemas/ReviewStatus' } }
        - { name: kind, in: query, description: Omit for every kind., schema: { $ref: '#/components/schemas/ReviewKind' } }
        - name: category
          in: query
          description: >-
            Only resource candidates in this discovery category (its id, e.g. `coding`); omit for every item.
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 40 }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of the human review queue, newest first, filtered by status and kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewItemPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/review-items/{id}/resolution:
    put:
      tags: [admin]
      operationId: resolveReviewItem
      description: >-
        409 when the item is no longer OPEN (another decision, a double click, or a newer enrichment run superseded
        it): nothing changes, and the audit trail records NOT_OPEN.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewResolution' }
      responses:
        '200':
          description: Resolved item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewItem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/review-items/resolutions:
    post:
      tags: [review]
      operationId: resolveReviewItems
      summary: Decide several review items at once (ADR 0045).
      description: >-
        Each item is decided in its own transaction, the way one decision is, and writes its own audit entry; the
        outcome carries the batch, e.g. `ACCEPTED bulk:<batch>`. Rejecting works for every kind. Accepting works only
        for an enrichment check whose run has no CONFLICTING licence, open source or pricing; any other item is
        NOT_ALLOWED and stays open. An item already decided is NOT_OPEN, an unknown one NOT_FOUND. Decisions are final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewBulkResolution' }
      responses:
        '200':
          description: One outcome per item, in the order sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewBulkResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/review-items/{id}/evidence:
    get:
      tags: [review]
      operationId: getReviewEvidence
      summary: What a review item is about, with the quotes behind it (ADR 0045).
      description: >-
        Read through the item's link, never from its details. An item from an enrichment run: the run, its validation
        errors and the fields it stored, each with at most 5 quotes, CONFLICTING first. A relationship candidate: the
        run and the relationship, with at most 5 quotes. Any other item: the item only. Field values and the
        relationship are AI-written (`aiContent`); quotes come from the sources. The run of a decided or superseded
        item can have no fields left: a newer run replaced them.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The item and its evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEvidence' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/review-items/{id}/relationship-target:
    put:
      tags: [review]
      operationId: changeRelationshipTarget
      summary: Point an open relationship candidate at the right resource (ADR 0064).
      description: >-
        Exactly one of `resourceId` (a catalog resource), `newResource` (a resource to add: its name, official https
        address and type; an address the catalog already has gives that resource, never a second one) or `title` (a
        new name, not linked). The target then is a person's choice: its targetOrigin becomes CURATED. The origin stays
        the model's, since the kind is still AI-written. The item stays
        open: accepting it makes the link VERIFIED. 409 when the item is no longer open, is not a relationship
        candidate, or another relationship of the resource already has that target.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationshipTargetChange' }
      responses:
        '200':
          description: The item and its evidence, with the new target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEvidence' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/scout-runs:
    get:
      tags: [admin]
      operationId: listScoutRuns
      responses:
        '200':
          description: Recent AI Resource Scout runs.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ScoutRun' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: startScoutRun
      summary: Start collection for one source (or all) now.
      description: >-
        Answers as soon as the run holds the cluster-wide Scout run lock; the run then collects in the background.
        Poll GET /admin/scout-runs for its progress.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoutRunRequest' }
      responses:
        '202':
          description: >-
            Run started: one record per selected collector, RUNNING (SKIPPED when the collector is disabled). The ids
            match the records listed by GET /admin/scout-runs.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ScoutRun' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: No collector has the given sourceId; nothing starts.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/enrichment-recheck:
    post:
      tags: [admin]
      operationId: recheckEnrichments
      summary: Re-check the stored enrichment answers by code, with no model call (ADR 0056).
      description: >-
        Rejects a verified pricing, type or use case whose quotes do not state it, drops summary sentences that fail
        the claim check, and puts back in the enrichment backlog the resources that still miss a fact and have more
        to read. Idempotent: a second call changes nothing. Runs once by itself after the first start.
      responses:
        '200':
          description: What the re-check did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentRecheck' }
  /admin/category-backfill:
    post:
      tags: [admin]
      operationId: backfillCategories
      summary: Assign the categories of every resource again.
      description: >-
        Answers at once; the backfill then runs in the background on one replica, in batches (ADR 0053). It is
        idempotent. Counts go to the metric `helper2.categories.backfill.resources` and the log.
      responses:
        '202': { description: Started (skipped when another replica is already running it). }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/overview:
    get:
      tags: [overview]
      operationId: getAdminOverview
      summary: What needs a person now, for the back office landing page.
      description: >-
        Open review items per kind, the enrichment backlog, today's model budgets and web credits, the recent Scout
        runs and the failed ones of the last 24 hours, and the home examples shown and hidden. Counts only, no personal data. Computed at most once a minute
        (generatedAt says when).
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/enrichment-queue:
    get:
      tags: [enrichment-queue]
      operationId: listEnrichmentQueue
      summary: The enrichment backlog, in the order the Scout takes it.
      description: >-
        WAITING (the default): the ones an admin moved to the top first, then never-run resources, then
        model-unavailable and failed ones with retries left, each part newest discovery first. SKIPPED: the ones an
        admin skipped, the latest skip first. OUT_OF_RETRIES: the ones whose failed runs reached the cap, newest
        discovery first. Paged by cursor: pass `next` from the
        previous page as `after`, with the same view.
      parameters:
        - { name: view, in: query, schema: { $ref: '#/components/schemas/EnrichmentQueueView' } }
        - { name: after, in: query, description: The previous page's next cursor; omit for the first page., schema: { type: string, maxLength: 200 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of the backlog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentQueuePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/enrichment-queue/{resourceId}/requeue:
    post:
      tags: [enrichment-queue]
      operationId: requeueEnrichment
      summary: Put a skipped resource, or one out of retries, back into the enrichment queue.
      description: >-
        Undoes a skip. For a resource out of retries, only the failed runs from now on count against the cap. The
        resource takes its own place again; the daily enrichment cap still applies. 409 not-applicable when the
        resource is neither skipped nor out of retries. Every call is in the audit trail (REQUEUE_ENRICHMENT).
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Requeued. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/enrichment-queue/{resourceId}/skip:
    post:
      tags: [enrichment-queue]
      operationId: skipEnrichment
      summary: Take a waiting resource out of the enrichment queue until it is requeued.
      description: >-
        Drops a move to the top. 409 not-applicable when the resource does not wait or is already skipped. Every call
        is in the audit trail (SKIP_ENRICHMENT).
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrichmentSkip' }
      responses:
        '204': { description: Skipped. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/enrichment-queue/{resourceId}/prioritise:
    post:
      tags: [enrichment-queue]
      operationId: prioritiseEnrichment
      summary: Move a waiting resource to the top of the enrichment queue until its next run.
      description: >-
        The Scout takes it in its next batch, within the daily enrichment cap: the order changes, the number of model
        calls does not. At most 50 resources wait at the top. 409 not-applicable when the resource does not wait, is
        already at the top, or the top is full. Every call is in the audit trail (PRIORITISE_ENRICHMENT).
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Moved to the top. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: What administrators did, newest first.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of the admin audit trail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/config:
    get:
      tags: [settings]
      operationId: getEffectiveConfig
      summary: The settings the app runs with now, read-only.
      description: >-
        Grouped by module, each read from the module's typed settings: model ids per use, prompt versions, the guide's
        configuration hash, daily budgets and caps, the Scout's schedule and the sources that are on. An allow-list:
        never a secret, a key, a credential in a URL or a secret's path. Fixed until the next restart.
      responses:
        '200':
          description: Every group, in page order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveConfig' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/runtime-settings:
    get:
      tags: [runtime-settings]
      operationId: listRuntimeSettings
      summary: The spending limits an administrator may change at runtime, with their history.
      description: >-
        Each setting of the allow-list (ADR 0060): the value applied now, the default (the H2_ variable), the allowed
        range, its version and its last changes. The value a replica applies can be up to one refresh interval
        (20 s by default) behind.
      responses:
        '200':
          description: Every runtime setting, in a fixed order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/runtime-settings/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, maxLength: 100 } }
    put:
      tags: [runtime-settings]
      operationId: changeRuntimeSetting
      summary: Set a runtime setting's value.
      description: >-
        400 when the value is outside 0 to the setting's maximum. 404 for a key that is not in the allow-list. 409
        when the version is not the setting's newest (someone changed it first). Recorded in the audit trail with
        the value before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeSettingChange' }
      responses:
        '200':
          description: Changed; this replica applies it now, the others within one refresh interval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSettingState' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/runtime-settings/{key}/reset:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, maxLength: 100 } }
    post:
      tags: [runtime-settings]
      operationId: resetRuntimeSetting
      summary: Back to the default (the H2_ variable).
      description: >-
        Appends a change with no value. 404 for a key that is not in the allow-list; 409 when the version is not the
        setting's newest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeSettingReset' }
      responses:
        '200':
          description: Back to the default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSettingState' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/discovery-hosts:
    get:
      tags: [discovery-hosts]
      operationId: listDiscoveryHosts
      summary: The hosts discovery knows by name, with who added each and why.
      description: >-
        WRITING hosts publish articles about many products (a post there is an ARTICLE candidate); DIRECTORY hosts
        list products (a page there is never kept). Discovery reads the lists at the start of each run (ADR 0063).
      responses:
        '200':
          description: Every host, by kind and name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryHosts' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [discovery-hosts]
      operationId: addDiscoveryHost
      summary: Add a host to one list.
      description: >-
        The host is kept in lower case, without "www." and a trailing dot. 400 when it is not a host name, when it
        would match too much (a top-level domain, "co.uk", an IP address), for github.com, for a reason that is not
        one plain line, and when the lists are full (500 hosts). 409 when the host is in a list already, of either
        kind. Recorded in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoveryHostAdd' }
      responses:
        '201':
          description: Added; the next discovery run uses it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryHostEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/discovery-hosts/{host}/remove:
    parameters:
      - { name: host, in: path, required: true, schema: { type: string, maxLength: 260 } }
    post:
      tags: [discovery-hosts]
      operationId: removeDiscoveryHost
      summary: Remove a host from its list.
      description: 404 when the host is in no list. Recorded in the audit trail with the list it was in.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoveryHostRemove' }
      responses:
        '204': { description: Removed; the next discovery run no longer uses it. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /home/examples:
    get:
      tags: [examples]
      operationId: listHomeExamples
      summary: The example searches the home page picks from.
      description: >-
        The examples that may be shown (active, and their last quality check passed), at most 50. The page picks two
        per path at random. Admin text only, no personal data; the same answer for everyone, cached for 5 minutes.
      parameters:
        - { name: lang, in: query, schema: { type: string, pattern: '^[a-z]{2}$', default: en } }
      responses:
        '200':
          description: The served pool.
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=300' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeExamplePool' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /policy:
    get:
      tags: [policy]
      operationId: getPolicy
      summary: The limits and retention periods the Mission, Privacy and Terms pages state.
      description: >-
        Read from the running configuration (ADR 0052), so the text pages show the numbers the code applies. The same
        answer for everyone, no personal data; cached for 5 minutes. Rate-limited like the other public reads.
      responses:
        '200':
          description: The current limits and retention periods.
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=300' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '429': { $ref: '#/components/responses/Problem' }

  /admin/home-examples:
    get:
      tags: [examples-admin]
      operationId: listAdminHomeExamples
      summary: Every home example, with its last check.
      parameters:
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/ExampleCheckOutcome' } }
      responses:
        '200':
          description: Newest change first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminHomeExample' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [examples-admin]
      operationId: addHomeExample
      summary: Add an example; it waits for its first check (PENDING).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeExampleInput' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHomeExample' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/home-examples/drafts:
    post:
      tags: [examples-admin]
      operationId: draftHomeExamples
      summary: Ask a model to draft examples for well-known catalog resources; each draft waits in the review queue.
      description: >-
        One model call from the drafts' own daily budget. A draft is kept only when it follows the example rules,
        names one of the resources it was given, and does not repeat an example. 503 unavailable when no model is
        configured, the budget is used up or the model cannot answer.
      responses:
        '202':
          description: Drafts opened in the review queue (kind EXAMPLE_CANDIDATE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExampleDrafts' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /admin/home-examples/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [examples-admin]
      operationId: changeHomeExample
      summary: Change, pause or activate an example.
      description: >-
        409 when the version is not the stored one (someone changed it first) or when another example has the same
        label or query. A change of the query, path or expected results sends the example back to PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeExampleChange' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHomeExample' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [examples-admin]
      operationId: removeHomeExample
      summary: Remove an example.
      responses:
        '204': { description: 'Removed, or already gone.' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Policy:
      type: object
      description: >-
        What Helper2.ai allows and keeps, as configured. Periods are in seconds; the pages round them to hours, days or
        months. Daily limits reset at 00:00 UTC.
      required: [guide, dailyLimits, retention, sources]
      properties:
        guide:
          type: object
          required: [maxCandidates, maxPicks]
          properties:
            maxCandidates: { type: integer, minimum: 1, description: "Search results the guide's model chooses from (`H2_GUIDE_MAX_CANDIDATES`, ADR 0015)." }
            maxPicks: { type: integer, minimum: 1, description: Most picks in one guide answer (ADR 0015). }
        dailyLimits:
          type: object
          required: [guideQuestions, freeAnswers, webSearches]
          properties:
            guideQuestions:
              type: integer
              minimum: 0
              description: >-
                Fresh guide questions per client address and UTC day (`H2_GUIDE_CLIENT_DAILY_QUESTIONS`, ADR 0017). An
                answer from the cache costs none.
            freeAnswers:
              type: integer
              minimum: 0
              description: >-
                Answers with no pick, and questions that fail, a client address gets a day without spending a question
                (`H2_GUIDE_CLIENT_DAILY_FREE_ANSWERS`, ADR 0017).
            webSearches:
              type: object
              description: Live web searches per visitor, feature and UTC day (ADR 0037).
              required: [guest, registered]
              properties:
                guest: { $ref: '#/components/schemas/WebSearchLimits' }
                registered:
                  oneOf: [{ $ref: '#/components/schemas/WebSearchLimits' }, { type: 'null' }]
                  description: The limits of a signed-in user; null while the registered tier is off (everyone gets the guest limits).
        retention:
          type: object
          description: How long each store keeps what it keeps (ADR 0034), in seconds.
          required: [cachedSearchesSeconds, cachedGuideAnswersSeconds, translationsSeconds, queryVectorsSeconds, storedWebResultsSeconds, webSearchCountersSeconds, guideQuestionCountersSeconds, webNewsSeconds, pendingReviewPagesSeconds, listIndexSeconds, pageTextSeconds, pageReadSeconds, backupsSeconds, inactiveAccountsSeconds, handledReportsSeconds, adminRecordsSeconds, runtimeSettingChangesSeconds]
          properties:
            webSearchCountersSeconds: { type: integer, format: int64, minimum: 0, description: "A visitor's web search counter, per feature and UTC day (fixed in code, ADR 0037)." }
            guideQuestionCountersSeconds: { type: integer, format: int64, minimum: 0, description: "A client address's guide question counter, per UTC day (fixed in code, ADR 0017)." }
            webNewsSeconds: { type: integer, format: int64, minimum: 0, description: "Articles and news found by web search, after they were last retrieved (`H2_RETENTION_WEB_NEWS`)." }
            pendingReviewPagesSeconds: { type: integer, format: int64, minimum: 0, description: "A page waiting for review, after the decision (`H2_RETENTION_RESOLVED_REVIEW_ITEMS`)." }
            listIndexSeconds: { type: integer, format: int64, minimum: 0, description: "The search index of an awesome list, after the list was last read (`H2_RETENTION_LIST_INDEX`)." }
            pageTextSeconds: { type: integer, format: int64, minimum: 0, description: "The cleaned text of a product's own page, in the cache (`H2_SCOUT_EVIDENCE_PAGE_TEXT_TTL`)." }
            pageReadSeconds: { type: integer, format: int64, minimum: 0, description: "The address and text fingerprint of a product page that was read (`H2_SCOUT_EVIDENCE_PAGE_READ_TTL`)." }
            backupsSeconds: { type: integer, format: int64, minimum: 0, description: "A database backup (`H2_BACKUP_RETENTION_DAYS`, from the chart's `backup.retentionDays`, ADR 0027)." }
            cachedSearchesSeconds: { type: integer, format: int64, minimum: 0, description: "Source answers in the search cache, served while a source fails (`H2_SEARCH_STALE_FOR`)." }
            cachedGuideAnswersSeconds: { type: integer, format: int64, minimum: 0, description: "Guide answers in the shared cache (`H2_GUIDE_CACHE_TTL`)." }
            translationsSeconds: { type: integer, format: int64, minimum: 0, description: "English translations of searches typed in another language (`H2_SEARCH_TRANSLATION_TTL`)." }
            queryVectorsSeconds: { type: integer, format: int64, minimum: 0, description: "Search vectors used to search by meaning (`H2_SEARCH_QUERY_VECTOR_TTL`)." }
            storedWebResultsSeconds: { type: integer, format: int64, minimum: 0, description: "Stored web search results (`H2_RETENTION_LIVE_WEB_RESULTS`)." }
            inactiveAccountsSeconds: { type: integer, format: int64, minimum: 0, description: "An account, its settings and its saved items, after the last sign-in (`H2_RETENTION_INACTIVE_ACCOUNTS`)." }
            handledReportsSeconds: { type: integer, format: int64, minimum: 0, description: "Reports, after their review was resolved (`H2_RETENTION_RESOLVED_ISSUE_REPORTS`)." }
            adminRecordsSeconds: { type: integer, format: int64, minimum: 0, description: "An administrator's action in the back office audit trail, with their id and the reason they wrote (`H2_RETENTION_ADMIN_AUDIT`, ADR 0045)." }
            runtimeSettingChangesSeconds: { type: integer, format: int64, minimum: 0, description: "A change to a runtime setting, with the administrator's id and reason (`H2_RETENTION_RUNTIME_SETTINGS`, ADR 0060). Each setting's newest change stays while it applies." }
        sources:
          type: object
          description: What the Scout reads from the web and how much of it, as the Privacy page states it (ADR 0051).
          required: [categories, categorySearches, quoteChars, articleExcerptChars, productPageExcerptChars, productPages, errorLogChars]
          properties:
            categories: { type: integer, minimum: 0, description: Categories of AI tools searched for once a week (`helper2.categories`). }
            categorySearches: { type: integer, minimum: 0, description: Web searches those categories make in all, once a week. }
            quoteChars: { type: integer, minimum: 1, description: Longest quote the Scout keeps from a page (fixed in code, ADR 0051). }
            articleExcerptChars: { type: integer, minimum: 1, description: Longest excerpt kept of an article found by web search (fixed in code). }
            productPageExcerptChars: { type: integer, minimum: 1, description: Longest excerpt kept of a product page found by web search (fixed in code). }
            productPages: { type: integer, minimum: 1, description: "Most pages of a product's own website read for one product (fixed in code)." }
            errorLogChars: { type: integer, minimum: 1, description: Longest piece of an NVIDIA error answer kept in the logs (fixed in code). }

    WebSearchLimits:
      type: object
      required: [search, guide]
      properties:
        search: { type: integer, minimum: 0 }
        guide: { type: integer, minimum: 0 }

    HomeExamplePool:
      type: object
      required: [examples]
      properties:
        examples: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/HomeExample' } }
        ai:
          oneOf: [{ $ref: '#/components/schemas/AiContentMarker' }, { type: 'null' }]
          description: Present when an example was drafted by a model; those carry aiDrafted true.

    HomeExample:
      type: object
      required: [id, label, query, path, aiDrafted]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 2, maxLength: 32, description: The text on the chip. }
        query: { type: string, minLength: 3, maxLength: 200, description: What the example searches. }
        path: { $ref: '#/components/schemas/AudiencePath' }
        aiDrafted: { type: boolean, description: "A model drafted the label and query, and a person accepted them (ADR 0049 §6). Labelled in the UI." }

    HomeExampleInput:
      type: object
      required: [label, query, path, expectedResourceIds]
      properties:
        label: { type: string, minLength: 2, maxLength: 32 }
        query: { type: string, minLength: 3, maxLength: 200 }
        path: { $ref: '#/components/schemas/AudiencePath' }
        expectedResourceIds:
          type: array
          minItems: 1
          maxItems: 3
          description: Catalog resource ids that are a right answer; the quality check looks for them in the top 3.
          items: { type: string, format: uuid }

    HomeExampleChange:
      type: object
      required: [label, query, path, expectedResourceIds, status, version]
      properties:
        label: { type: string, minLength: 2, maxLength: 32 }
        query: { type: string, minLength: 3, maxLength: 200 }
        path: { $ref: '#/components/schemas/AudiencePath' }
        expectedResourceIds: { type: array, minItems: 1, maxItems: 3, items: { type: string, format: uuid } }
        status: { $ref: '#/components/schemas/ExampleStatus' }
        version: { type: integer, minimum: 0, description: The version the change was made on. }

    ExampleDrafts:
      type: object
      required: [drafted, model]
      properties:
        drafted: { type: integer, minimum: 0, description: Drafts opened in the review queue. }
        model: { type: string }

    ExampleStatus: { type: string, enum: [ACTIVE, PAUSED] }

    ExampleCheckOutcome:
      type: string
      enum: [PENDING, PASS, WEAK, FAIL]
      description: >-
        PASS: an expected result in the top 3 of the example's own search (shown). WEAK: in the top 4 to 10. FAIL: not
        in the top 10. PENDING: not checked since its last change. Only PASS is shown.

    AdminHomeExample:
      type: object
      required: [id, label, query, path, status, origin, expected, check, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        query: { type: string }
        path: { $ref: '#/components/schemas/AudiencePath' }
        status: { $ref: '#/components/schemas/ExampleStatus' }
        origin: { type: string, enum: [BUILT_IN, CURATED, AI_DRAFTED] }
        model: { type: [string, 'null'], description: The model that drafted it (AI_DRAFTED only). }
        expected:
          type: array
          items: { $ref: '#/components/schemas/ExpectedResource' }
        check: { $ref: '#/components/schemas/ExampleCheck' }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }

    ExpectedResource:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'], description: null when the catalog no longer has it. }

    ExampleCheck:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: '#/components/schemas/ExampleCheckOutcome' }
        bestRank: { type: [integer, 'null'], minimum: 1, description: Best rank of an expected result; null when none was found. }
        resultCount: { type: [integer, 'null'], minimum: 0 }
        checkedAt: { type: [string, 'null'], format: date-time }

    Problem:
      type: object
      description: >-
        RFC 9457 problem details (application/problem+json). `type` is https://helper2.ai/problems/<code>; `code` is
        the same stable code on its own, so a client reacts to the code, never to the title text. Codes:
        invalid-request (400), sign-in-required (401), forbidden (403), not-found (404), method-not-allowed (405),
        not-acceptable (406), unsupported-media-type (415), already-decided, run-in-progress, version-conflict,
        duplicate, not-applicable (409), rate-limited (429), internal (500), unavailable (503), timed-out (504).
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: The stable code of the problem type. }

    AudiencePath:
      type: string
      enum: [USE_AI, BUILD_WITH_AI]
    Audience:
      type: string
      description: Who a resource is primarily for. UNKNOWN when no source says.
      enum: [USE_AI, BUILD_WITH_AI, BOTH, UNKNOWN]
    ResourceType:
      type: string
      description: |
        Tools (PRODUCT…DATASET), knowledge about AI (ARTICLE, PAPER, NEWS, EVENT) and learning (COURSE: a course or
        a certification, its platform in `platforms`, its credential and format in `tags`).
        Helper2.ai only covers the AI world; non-AI content is filtered out.
      enum: [PRODUCT, MODEL, AGENT, PROMPT, SKILL, MCP_SERVER, LIBRARY, DATASET, ARTICLE, PAPER, NEWS, EVENT, COURSE, OTHER]
    TechLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    TechLevelFilter:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED, UNKNOWN]
    Pricing:
      type: string
      enum: [FREE, FREEMIUM, PAID, OPEN_SOURCE_SELF_HOSTED]
    EventKind:
      type: string
      enum: [CONFERENCE, HACKATHON, MEETUP, TALK, WORKSHOP]
    EventFormat:
      type: string
      enum: [IN_PERSON, ONLINE, HYBRID]
    PricingFilter:
      type: string
      enum: [FREE, FREEMIUM, PAID, OPEN_SOURCE_SELF_HOSTED, UNKNOWN]
    TriState:
      type: string
      enum: ['true', 'false', unknown]
    SortOrder:
      type: string
      enum: [RELEVANCE, NEWEST, RECENTLY_UPDATED]
    ValueOrigin:
      type: string
      description: |
        SOURCE_PROVIDED = stated by the source's own metadata. AI_EXTRACTED = extracted by the
        AI Resource Scout from retrieved material and validated against evidence.
        AI_SUMMARY = generated text built only from validated claims. AI_ESTIMATED = a judgement
        (audience, tech level) an AI model made without a quote that states it: AI-generated, never
        a verified fact (ADR 0056). SELF_DECLARED = extracted by AI from a quote of the product's
        own web page only, so it is what the vendor says about itself (ADR 0056). CURATED = written
        by the Helper2 editorial seed (not live). COMMUNITY = user submission. DEMO = fixture data.
      enum: [SOURCE_PROVIDED, AI_EXTRACTED, AI_SUMMARY, AI_ESTIMATED, SELF_DECLARED, CURATED, COMMUNITY, DEMO]
    Verification:
      type: string
      enum: [VERIFIED, UNVERIFIED, CONFLICTING, REJECTED]
    SourceMode:
      type: string
      description: |
        LIVE = queried at request time. INDEXED = Helper2's own PostgreSQL index built by the
        Scout. CURATED = editorial seed shipped with the app. DEMO = fixture source for tests/demos.
      enum: [LIVE, INDEXED, CURATED, DEMO]
    SourceOutcome:
      type: string
      enum: [SUCCEEDED, FAILED, TIMED_OUT, RATE_LIMITED, SKIPPED]
    ServedFrom:
      type: string
      enum: [LIVE, CACHE, STALE_CACHE, NONE]
    Freshness:
      type: string
      description: How fresh this card's data is, from the best source that contributed it.
      enum: [LIVE, CACHED, STALE, INDEXED, CURATED, DEMO]

    DateFact:
      type: object
      required: [status, precision]
      description: A date that may be unknown. Never filled with a guess.
      properties:
        value: { type: [string, 'null'], format: date-time }
        precision: { type: string, enum: [INSTANT, DAY, UNKNOWN] }
        status:
          type: string
          description: CONFLICTING = two sources state different days for this date; `value` is still the earliest (published, event start) or latest (event end) of them, and `alternatives` holds the others.
          enum: [KNOWN, UNKNOWN, CONFLICTING]
        sourceId: { type: [string, 'null'] }
        alternatives:
          type: array
          description: Values other sources state for this date, besides `value`.
          items: { $ref: '#/components/schemas/SourcedValue' }

    Timeline:
      type: object
      required: [published, updated, discovered]
      properties:
        published: { $ref: '#/components/schemas/DateFact' }
        updated: { $ref: '#/components/schemas/DateFact' }
        discovered:
          $ref: '#/components/schemas/DateFact'
          description: When Helper2.ai first saw this resource (indexed or in a live search).
        eventStart:
          description: EVENT only — when the event takes place (distinct from when it was announced). null for other types.
          oneOf: [{ $ref: '#/components/schemas/DateFact' }, { type: 'null' }]
        eventEnd:
          description: EVENT only — last day of the event as its source states it. null for other types.
          oneOf: [{ $ref: '#/components/schemas/DateFact' }, { type: 'null' }]

    SourcedValue:
      type: object
      required: [value, sourceId]
      properties:
        value: { type: string }
        sourceId: { type: string }

    FieldConflict:
      type: object
      required: [field, values]
      properties:
        field: { type: string }
        values: { type: array, items: { $ref: '#/components/schemas/SourcedValue' } }

    PopularityMetric:
      type: object
      description: A real metric reported by a named source. Never combined across sources.
      required: [metric, value, sourceId, asOf]
      properties:
        metric: { type: string, enum: [GITHUB_STARS, HF_LIKES, HF_DOWNLOADS, NPM_DOWNLOADS_WEEKLY] }
        value: { type: integer, format: int64 }
        sourceId: { type: string }
        asOf: { type: string, format: date-time }

    ResultSourceRef:
      type: object
      required: [sourceId, sourceName, url, mode, retrievedAt]
      properties:
        sourceId: { type: string }
        sourceName: { type: string }
        url: { type: string, format: uri }
        mode: { $ref: '#/components/schemas/SourceMode' }
        retrievedAt: { type: string, format: date-time }

    ResultCard:
      type: object
      required: [id, title, type, audience, url, sources, timeline, freshness, tags, useCases, platforms, popularity, conflicts, descriptionOrigin, compatibleWith, categories]
      properties:
        id: { type: string, format: uuid, description: "Stable: UUIDv5 of the canonical URL." }
        title: { type: string }
        description: { type: [string, 'null'] }
        descriptionOrigin: { $ref: '#/components/schemas/ValueOrigin' }
        type: { $ref: '#/components/schemas/ResourceType' }
        audience: { $ref: '#/components/schemas/Audience' }
        techLevel: { oneOf: [{ $ref: '#/components/schemas/TechLevel' }, { type: 'null' }] }
        useCases: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        license: { type: [string, 'null'] }
        pricing: { oneOf: [{ $ref: '#/components/schemas/Pricing' }, { type: 'null' }] }
        platforms: { type: array, items: { type: string } }
        openSource: { type: [boolean, 'null'] }
        url: { type: string, format: uri, description: Link to the original. }
        canonicalUrl: { type: string }
        sources: { type: array, items: { $ref: '#/components/schemas/ResultSourceRef' } }
        timeline: { $ref: '#/components/schemas/Timeline' }
        popularity: { type: array, items: { $ref: '#/components/schemas/PopularityMetric' } }
        freshness: { $ref: '#/components/schemas/Freshness' }
        conflicts: { type: array, items: { $ref: '#/components/schemas/FieldConflict' } }
        compatibleWith:
          type: array
          description: AI tools this resource works with, derived by disclosed rules from source tags, type and file formats. Never model-generated.
          items: { $ref: '#/components/schemas/CompatibilityFlag' }
        categories:
          type: array
          description: >-
            Ids of the categories it belongs to (GET /categories), in their order; empty when it has none yet. Assigned
            by code from its title, what its sources wrote, its tags, type and the collectors that found it (ADR 0053).
            Never model-generated.
          items: { type: string }
        location: { type: [string, 'null'], description: "EVENT only: city and country as the source states it." }
        eventKind: { oneOf: [{ $ref: '#/components/schemas/EventKind' }, { type: 'null' }], description: "EVENT only: what kind of event the source calls it; null when it does not say." }
        eventFormat: { oneOf: [{ $ref: '#/components/schemas/EventFormat' }, { type: 'null' }], description: "EVENT only: online, in person or both, as the source states it; null when it does not say." }
        foundIn:
          description: >-
            Set when the result was found only by the words an awesome list uses around it (its entry line and its
            section heading), not by its own text (ADR 0055). The list's own words, not AI-written. Null when any source
            matched the result directly.
          oneOf: [{ $ref: '#/components/schemas/ListMatch' }, { type: 'null' }]

    ListMatch:
      type: object
      required: [listTitle, headingPath]
      properties:
        listTitle: { type: string, description: "The list's title in the catalog, e.g. owner/awesome-llm." }
        headingPath: { type: string, maxLength: 200, description: "The headings above the entry, e.g. \"Tools > Vector databases\"; empty when the entry has none." }

    CompatibilityFlag:
      type: object
      required: [tool, label, basis, evidence]
      properties:
        tool: { type: string, description: "Stable id, e.g. openai, anthropic, xai, ollama, mcp." }
        label: { type: string }
        basis: { type: string, enum: [TAG, TYPE, FORMAT], description: "TAG = a source listed the tag; TYPE = implied by resource type (MCP server); FORMAT = implied by published file format (GGUF)." }
        evidence: { type: string, description: The tag, type or format that was seen. }
        sourceId: { type: [string, 'null'], description: Source that stated the tag; null for TYPE. }

    SourceStatus:
      type: object
      required: [sourceId, name, mode, outcome, servedFrom, resultCount, checkedAt]
      properties:
        sourceId: { type: string }
        name: { type: string }
        mode: { $ref: '#/components/schemas/SourceMode' }
        outcome: { $ref: '#/components/schemas/SourceOutcome' }
        servedFrom: { $ref: '#/components/schemas/ServedFrom' }
        resultCount: { type: integer }
        latencyMs: { type: [integer, 'null'], format: int64 }
        checkedAt: { type: string, format: date-time }
        cachedAt: { type: [string, 'null'], format: date-time, description: When the served cache entry was fetched from the source. }
        message: { type: [string, 'null'], description: Safe, user-facing explanation. }
        skipReason:
          description: >-
            Why a SKIPPED source was left out; null for the other outcomes. Results offers "Try again" only when a new
            try can help: not while a source is paused (CIRCUIT_OPEN, RATE_LIMIT_PAUSE) or past a daily limit.
          oneOf: [{ $ref: '#/components/schemas/SkipReason' }, { type: 'null' }]
      # Only a SKIPPED source has a reason.
      if:
        required: [outcome]
        properties: { outcome: { not: { const: SKIPPED } } }
      then:
        properties: { skipReason: { type: 'null' } }

    SkipReason:
      type: string
      description: |
        Why a source was SKIPPED. RATE_LIMIT_PAUSE (paused after a rate limit), CIRCUIT_OPEN (paused after repeated
        failures), BUSY (too many calls at once) and QUOTA_UNAVAILABLE (the daily web limit cannot be checked) mean the
        source is failing: it counts in coverage as queried and did not answer. DISABLED, NOT_BROWSABLE, DAILY_LIMIT and
        WEB_NOT_ASKED mean it was left out on purpose and does not count.
      enum: [DISABLED, NOT_BROWSABLE, RATE_LIMIT_PAUSE, CIRCUIT_OPEN, BUSY, DAILY_LIMIT, QUOTA_UNAVAILABLE, WEB_NOT_ASKED]

    Coverage:
      type: object
      required: [partial, sourcesQueried, sourcesSucceeded, sourcesConfigured, note]
      properties:
        partial: { type: boolean }
        sourcesConfigured: { type: integer }
        sourcesQueried: { type: integer }
        sourcesSucceeded: { type: integer }
        note: { type: string, description: Disclosure that coverage is limited to the listed sources. }

    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: "`unknown` is its own bucket." }
        count: { type: integer }

    Facets:
      type: object
      required: [type, source, license, openSource, pricing, platform, useCase, techLevel, audience, category]
      properties:
        type: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        source: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        license: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        openSource: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        pricing: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        platform: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        useCase: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        techLevel: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        audience: { type: array, items: { $ref: '#/components/schemas/FacetValue' } }
        category:
          type: array
          description: >-
            Category ids (ADR 0053) with their counts over the whole merged result set, every filter applied but the
            category's own; `unknown` counts the results with no category yet.
          items: { $ref: '#/components/schemas/FacetValue' }

    Notice:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            GUIDE_DAILY_QUOTA (guide only) = this client's AI answers for the UTC day are used up; the answer is search results only.
            GUIDE_SUBJECT_NOT_FOUND (guide only) = a thing the question names (to compare, to find alternatives to, to date) is not in our sources.
          enum: [CACHE_UNAVAILABLE, INDEX_UNAVAILABLE, QUERY_EXPANDED, ALL_SOURCES_FAILED, GUIDE_DAILY_QUOTA, GUIDE_SUBJECT_NOT_FOUND]
        message: { type: string, description: "Plain-language text in our own words, except QUERY_EXPANDED: its list of terms can hold a model translation of the query (ADR 0011). Model-written parts of other notices are their own fields (subject, query)." }
        subject:
          type: [string, 'null']
          description: |
            GUIDE_SUBJECT_NOT_FOUND only: the name that was not found, as the planner read it from the question.
            AI-written (`notices[].subject` in `GuideResponse.aiContent.fields`, ADR 0038). Null on other codes and on a
            not-found date.
        query:
          type: [string, 'null']
          description: |
            GUIDE_SUBJECT_NOT_FOUND only: the planner's search the guide shows tools for instead (alternatives). AI-written
            (`notices[].query` in `GuideResponse.aiContent.fields`). Null on a comparison and on an answer reused from a
            similar question (ADR 0041): it came from another asker's words.

    QueryInterpretation:
      type: object
      description: |
        How the query was read. `expandedTerms` and `detectedUseCases` are deterministic (non-AI): equivalents and use
        cases from a fixed EN/IT lexicon, so English-only sources can match non-English queries. `translatedQuery` is
        the one AI-written part (ADR 0011, 0038).
      required: [expandedTerms, detectedUseCases]
      properties:
        expandedTerms: { type: array, items: { type: string }, description: From the fixed lexicon only; never the translation. }
        detectedUseCases: { type: array, items: { type: string } }
        translatedQuery:
          type: [string, 'null']
          description: |
            AI-written: the model's English translation of a non-English query, searched first. Null when the query is
            English or no translation came back (labelled as AI in the UI).

    SearchResponse:
      type: object
      required: [query, executedAt, coverage, sources, results, facets, total, page, size, notices, interpretation]
      properties:
        notices: { type: array, items: { $ref: '#/components/schemas/Notice' } }
        interpretation: { $ref: '#/components/schemas/QueryInterpretation' }
        query: { type: string }
        path: { oneOf: [{ $ref: '#/components/schemas/AudiencePath' }, { type: 'null' }] }
        sort: { $ref: '#/components/schemas/SortOrder' }
        executedAt: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/Coverage' }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStatus' } }
        results: { type: array, items: { $ref: '#/components/schemas/ResultCard' } }
        facets: { $ref: '#/components/schemas/Facets' }
        total: { type: integer, description: Matches after filters, across all pages. }
        page: { type: integer }
        size: { type: integer }
        webSearches: { oneOf: [{ $ref: '#/components/schemas/WebSearches' }, { type: 'null' }] }

    WebSearches:
      type: object
      description: |
        Live web searches this visitor has left today for this feature; search and the guide count apart
        (ADR 0037). Resets at 00:00 UTC. Results already stored cost none. Null when no web source is enabled or the
        count cannot be read.
      required: [limit, remaining]
      properties:
        limit: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }

    Evidence:
      type: object
      required: [id, sourceUrl, retrievedAt]
      properties:
        id: { type: string, format: uuid }
        sourceUrl: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        excerpt: { type: [string, 'null'], description: Short excerpt, stored within source terms. }

    Assertion:
      type: object
      required: [field, value, origin, verification, evidence]
      properties:
        field: { type: string }
        value: { type: string }
        origin: { $ref: '#/components/schemas/ValueOrigin' }
        verification: { $ref: '#/components/schemas/Verification' }
        sourceId: { type: [string, 'null'] }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }

    Relationship:
      type: object
      required: [kind, targetTitle, verification, evidence]
      properties:
        kind: { type: string, enum: [INTEGRATES_WITH, USES, SUPPORTS, COMPATIBLE_WITH, ABOUT] }
        targetId: { type: [string, 'null'], format: uuid }
        targetTitle: { type: string }
        verification: { $ref: '#/components/schemas/Verification' }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        origin:
          $ref: '#/components/schemas/ValueOrigin'
          description: AI_EXTRACTED, or SELF_DECLARED when only the product's own page names the target (ADR 0056).

    SummaryClaim:
      type: object
      required: [text, evidence]
      properties:
        text: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        selfDeclared:
          type: boolean
          description: True when the claim cites the product's own web page, so it is what the vendor says (ADR 0056).

    AiSummary:
      type: object
      required: [claims, model, promptVersion, generatedAt]
      properties:
        claims: { type: array, items: { $ref: '#/components/schemas/SummaryClaim' } }
        model: { type: string }
        promptVersion: { type: string }
        generatedAt: { type: string, format: date-time }

    SourceRecordInfo:
      type: object
      required: [sourceId, externalId, url, retrievedAt, fingerprint]
      properties:
        sourceId: { type: string }
        externalId: { type: string }
        url: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        fingerprint: { type: string }

    RecentResponse:
      type: object
      required: [items, total, since, generatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ResultCard' } }
        total:
          type: integer
          minimum: 0
          description: >-
            Resources in the window (and types) in all, of which `items` holds the first `size`; for "Show all N".
            A resource whose records no longer merge is counted but not shown, so `items` can be shorter.
        since: { type: string, format: date-time, description: Oldest publication date included. }
        generatedAt: { type: string, format: date-time }

    UpcomingEventsResponse:
      type: object
      required: [items, total, generatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ResultCard' } }
        total:
          type: integer
          minimum: 0
          description: >-
            Upcoming events (in the `days` window, when given) in all, of which `items` holds the first `size`; for
            "Show all N".
        until:
          type: [string, 'null']
          format: date-time
          description: End of the `days` window (exclusive); null without `days`.
        generatedAt: { type: string, format: date-time }

    ResourceDetail:
      type: object
      required: [card, assertions, relationships, sourceRecords, enrichmentStatus]
      properties:
        card: { $ref: '#/components/schemas/ResultCard' }
        assertions: { type: array, items: { $ref: '#/components/schemas/Assertion' } }
        relationships: { type: array, items: { $ref: '#/components/schemas/Relationship' } }
        summary: { oneOf: [{ $ref: '#/components/schemas/AiSummary' }, { type: 'null' }] }
        sourceRecords: { type: array, items: { $ref: '#/components/schemas/SourceRecordInfo' } }
        enrichmentStatus: { type: string, enum: [NOT_RUN, VALIDATED, PARTIAL, REJECTED, LLM_UNAVAILABLE] }

    SetupGuide:
      type: object
      required: [resourceId, title, options, clients, sources]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        version: { type: [string, 'null'], description: Version the setup facts are for, as the source states it. }
        options:
          type: array
          description: Ways to run the resource, as its source states them; empty when the sources state none.
          items: { $ref: '#/components/schemas/SetupOption' }
        clients:
          type: array
          description: One entry per AI client, in a fixed order; empty when there are no options.
          items: { $ref: '#/components/schemas/SetupClient' }
        sources:
          type: array
          description: Where the setup facts were read, with when.
          items:
            type: object
            required: [sourceId, url, retrievedAt]
            properties:
              sourceId: { type: string }
              url: { type: string, format: uri }
              retrievedAt: { type: string, format: date-time }

    SetupOption:
      type: object
      required: [id, kind, transport, label, settings]
      properties:
        id: { type: string, description: Stable within this answer; snippets refer to it. }
        kind: { type: string, enum: [REMOTE, PACKAGE, COMMAND] }
        transport: { type: string, enum: [STREAMABLE_HTTP, SSE, STDIO] }
        label: { type: string, description: 'For example "Hosted server" or "npm package @scope/name".' }
        url: { type: [string, 'null'], format: uri, description: REMOTE only. }
        registryType: { type: [string, 'null'], description: 'PACKAGE only: npm, pypi or oci, as the registry states it.' }
        identifier: { type: [string, 'null'], description: PACKAGE only. }
        runtime: { type: [string, 'null'], description: 'PACKAGE only: the program that launches it (npx, uvx, docker).' }
        requires: { type: [string, 'null'], description: 'What must be installed first, e.g. "Node.js (for npx)".' }
        settings:
          type: array
          description: Environment variables (STDIO) or headers (REMOTE) the source declares.
          items: { $ref: '#/components/schemas/SetupSetting' }

    SetupSetting:
      type: object
      required: [name, kind, required, secret]
      properties:
        name: { type: string }
        kind: { type: string, enum: [ENV, HEADER] }
        description: { type: [string, 'null'] }
        required: { type: boolean }
        secret: { type: boolean, description: Shown as a placeholder; a value is never filled in. }
        value: { type: [string, 'null'], description: 'The value or default the source publishes (never a secret''s), as it appears in the snippets.' }

    SetupClient:
      type: object
      required: [id, name, docsUrl, snippets]
      properties:
        id: { type: string }
        name: { type: string }
        docsUrl: { type: string, format: uri, description: The client's own documentation the snippet format follows. }
        snippets:
          type: array
          items:
            type: object
            required: [optionId, supported]
            properties:
              optionId: { type: string }
              supported: { type: boolean }
              where: { type: [string, 'null'], description: 'Where it goes: a terminal, or a config file path.' }
              language: { type: [string, 'null'], description: 'shell, json, jsonc, toml or yaml.' }
              text: { type: [string, 'null'], description: Ready to paste; secrets are placeholders. }
              note: { type: [string, 'null'], description: Why it is not supported, or what to do after pasting. }

    ToolGuide:
      type: object
      required: [resourceId, title, status, sections, documents, rejected, generatedAt]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        status:
          type: string
          enum: [OK, NO_STEPS, NO_MATERIAL, LLM_UNAVAILABLE]
          description: 'OK: steps passed the checks. NO_STEPS: documents read, nothing passed. NO_MATERIAL: no document to read. LLM_UNAVAILABLE: no model now (see unavailable).'
        unavailable: { type: [string, 'null'], description: 'With LLM_UNAVAILABLE: "budget" (today''s model calls are used up) or "error".' }
        sections:
          type: array
          items:
            type: object
            required: [kind, steps]
            properties:
              kind: { type: string, enum: [REQUIREMENTS, INSTALL, CONFIGURE, USE, CONNECT] }
              steps:
                type: array
                items:
                  type: object
                  required: [text, quote, source, caution]
                  properties:
                    text: { type: string, description: AI-written instruction (labelled as AI in the UI). }
                    quote: { type: string, description: Passage of the cited document that supports the step, checked. }
                    source: { type: string, description: Key of the document in documents. }
                    code:
                      oneOf:
                        - type: 'null'
                        - type: object
                          required: [text]
                          properties:
                            language: { type: [string, 'null'] }
                            text: { type: string, description: Copied from one code block of the document, checked. }
                    caution: { type: boolean, description: 'The command pipes a download into a shell, uses sudo or deletes recursively.' }
        documents:
          type: array
          items:
            type: object
            required: [key, kind, url, retrievedAt]
            properties:
              key: { type: string }
              kind: { type: string, enum: [README, PACKAGE_README, MODEL_CARD] }
              url: { type: string, format: uri }
              retrievedAt: { type: string, format: date-time }
        model: { type: [string, 'null'] }
        rejected: { type: integer, description: Proposed steps the checks removed. }
        generatedAt: { type: string, format: date-time }

    IssueReportRequest:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [WRONG, OUTDATED, BROKEN_LINK, OTHER] }
        field: { type: [string, 'null'], maxLength: 60 }
        message: { type: string, minLength: 5, maxLength: 2000 }

    IssueReportAccepted:
      type: object
      required: [reportId]
      properties:
        reportId: { type: string, format: uuid }

    GuideRequest:
      type: object
      required: [request]
      properties:
        request: { type: string, minLength: 3, maxLength: 500, description: The need in plain words, any language. }
        path: { oneOf: [{ $ref: '#/components/schemas/AudiencePath' }, { type: 'null' }] }
        clarification:
          type: [string, 'null']
          maxLength: 300
          description: |
            The user's answer to a NEEDS_CLARIFICATION answer (a chosen option or free text); "" means "search
            anyway". A request with this field is never asked back again.
        drop:
          type: array
          maxItems: 8
          description: |
            Parts of the reading the user removed from "Understood as": "intent" (answer as a plain suggestion),
            "window" (ignore the period) or "constraint:<text>". Applied by code; never sent to a model.
          items: { type: string, maxLength: 80 }
        categories:
          type: array
          maxItems: 40
          description: >-
            The category filter active on the results page (ids from GET /categories, or `unknown`). The guide picks
            only among results in one of them (ADR 0053). Applied by code; never sent to a model. Unknown ids are a 400.
          items: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 30 }

    GuideRecommendation:
      type: object
      required: [resourceId, title, url, type, reason, quote, sourceIds, aiReasoned]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        url: { type: string, format: uri }
        type: { $ref: '#/components/schemas/ResourceType' }
        reason: { type: string, description: AI-written explanation (labelled as AI in the UI). }
        quote: { type: string, description: Exact text from the resource's own description that supports the reason. }
        description:
          type: [string, 'null']
          description: The resource's own description, the text the quote was checked against, so a client can show the quote in context.
        sourceIds: { type: array, items: { type: string } }
        compatibleWith:
          type: array
          description: |
            AI tools this pick works with, by the same disclosed rules as ResultCard.compatibleWith. Never model-generated.
            The server always sends it, `[]` when no rule matched; an answer cached by a client before the field existed
            may lack it.
          items: { $ref: '#/components/schemas/CompatibilityFlag' }
        aiReasoned:
          type: boolean
          description: True when the model chose this pick and it passed the evidence check; false for a plain top search result shown because no AI pick survived.
        checks:
          type: array
          description: One entry per constraint in GuideResponse.constraints, in the same order.
          items: { $ref: '#/components/schemas/GuideCheck' }
        reasonCheck:
          type: string
          enum: [SUPPORTED, REMOVED, NOT_CHECKED]
          default: NOT_CHECKED
          description: |
            Outcome of a second model call that compares `reason` with the quote, the resource's own text
            and the confirmed checks. SUPPORTED: no claim beyond that evidence was found (a model check, not a
            proof). REMOVED: it found one, so `reason` is empty. NOT_CHECKED: no check ran (no model, budget,
            failure) or this is a fallback result.

    GuideCheck:
      type: object
      required: [constraint, status]
      properties:
        constraint: { type: string, description: 'A requirement the user stated, in a few words (e.g. "free", "self-hosted").' }
        status:
          type: string
          enum: [CONFIRMED, NOT_CONFIRMED]
          description: CONFIRMED only when the quote appears word for word in the resource's own text. NOT_CONFIRMED means the source does not show it, not that it is false.
        quote: { type: [string, 'null'], description: 'Exact text from the resource that shows the constraint is met, or for licence constraints the licence the source states (e.g. "License: MIT (stated by GitHub)").' }

    GuidePrompt:
      type: object
      required: [text, basedOn]
      properties:
        text: { type: string, description: AI-generated prompt the user can copy. }
        basedOn:
          type: array
          description: Catalog prompts this was adapted from; never empty, because a prompt not adapted from a catalog prompt is not shown.
          items:
            type: object
            required: [resourceId, title]
            properties:
              resourceId: { type: string, format: uuid }
              title: { type: string }

    GuideModelInfo:
      type: object
      required: [provider, fastModel, reasoningModel]
      properties:
        provider: { type: string }
        fastModel: { type: string }
        reasoningModel: { type: string }

    AiContentMarker:
      type: object
      required: [aiGenerated, provider, models, fields, policy]
      description: |
        Machine-readable marking of AI-written text (EU AI Act Art. 50(2), ADR 0038). Present only when a model wrote
        text in this response. `fields` lists the fields a model wrote; every other field is source text or computed.
      properties:
        aiGenerated: { type: boolean, description: Always true. }
        provider: { type: string }
        models: { type: array, items: { type: string } }
        fields:
          type: array
          description: JSON paths of the AI-written fields, with [] for every item of an array (e.g. recommendations[].reason).
          items: { type: string }
        policy: { type: string, description: Path of the page that explains how Helper2.ai marks AI text. }

    GuideResponse:
      type: object
      required: [status, searchQuery, recommendations, candidatesConsidered, sources, notices, generatedAt]
      properties:
        status:
          type: string
          enum: [OK, PARTIAL, LLM_UNAVAILABLE, NO_CANDIDATES, NEEDS_CLARIFICATION]
          description: NEEDS_CLARIFICATION = the question was too vague to search (no search ran), or its one subject matches different kinds of resource (a search ran); see `clarification`.
        searchQuery: { type: string, description: "Search terms actually used to retrieve candidates. Empty on an answer reused from a similar question (ADR 0041, 0044): the planner wrote them from another asker's words." }
        recommendations: { type: array, items: { $ref: '#/components/schemas/GuideRecommendation' } }
        prompt: { oneOf: [{ $ref: '#/components/schemas/GuidePrompt' }, { type: 'null' }] }
        model: { oneOf: [{ $ref: '#/components/schemas/GuideModelInfo' }, { type: 'null' }] }
        aiContent: { oneOf: [{ $ref: '#/components/schemas/AiContentMarker' }, { type: 'null' }] }
        candidatesConsidered: { type: integer }
        rejected: { type: integer, description: AI suggestions dropped by the validator. }
        constraints:
          type: array
          description: Requirements the planning model read from the need; each recommendation is checked against them.
          items: { type: string }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStatus' } }
        notices: { type: array, items: { $ref: '#/components/schemas/Notice' } }
        generatedAt: { type: string, format: date-time }
        intent: { $ref: '#/components/schemas/GuideIntent' }
        subjects: { type: array, items: { type: string }, description: Named things the question is about, as written. }
        window: { oneOf: [{ $ref: '#/components/schemas/GuideWindow' }, { type: 'null' }] }
        clarification: { oneOf: [{ $ref: '#/components/schemas/GuideClarification' }, { type: 'null' }] }
        comparison: { oneOf: [{ $ref: '#/components/schemas/GuideComparison' }, { type: 'null' }] }
        explanation: { oneOf: [{ $ref: '#/components/schemas/GuideExplanation' }, { type: 'null' }] }
        webSearches: { oneOf: [{ $ref: '#/components/schemas/WebSearches' }, { type: 'null' }] }
        trail: { $ref: '#/components/schemas/GuideTrail' }

    GuideTrail:
      type: object
      required: [queries, removed]
      description: >-
        The research trail (ADR 0044): the searches the guide ran and the suggestions its checks removed. Never the
        removed AI reason, raw model output or the prompt.
      properties:
        queries:
          type: array
          maxItems: 3
          description: >-
            AI-written search queries actually run (the planned query, the web query). Empty when the planner did not
            run, and on an answer reused from a similar question (ADR 0041): those came from another asker's words.
          items: { type: string, maxLength: 200 }
        removed:
          type: array
          maxItems: 12
          description: >-
            One per suggestion a check removed, in the order proposed: a pick, a comparison cell or an explanation
            sentence. Named by the source it quoted (a comparison: its subject), never by the removed text.
          items: { $ref: '#/components/schemas/GuideTrailRemoved' }

    GuideTrailRemoved:
      type: object
      required: [title, check]
      properties:
        title: { type: string, maxLength: 200, description: "The title of the candidate, compared subject or quoted source, from its source." }
        check:
          type: string
          enum: [QUOTE_NOT_FOUND, REASON_NOT_SUPPORTED, CONSTRAINT_NOT_MET]
          description: >-
            Which check removed it. QUOTE_NOT_FOUND = its quote is not in the source's text (or too short or too
            long); REASON_NOT_SUPPORTED = its reason was empty, too long, held a link, or the second model call found
            a claim the source does not show; CONSTRAINT_NOT_MET = a kind or period the question rules out.

    GuideIntent:
      type: string
      enum: [SUGGEST, NEWEST, ALTERNATIVES, COMPARE, HOW_TO, WHAT_IS, WHEN, LEARN]
      description: What kind of answer the question asks for (ADR 0032). SUGGEST is the default.

    GuideWindow:
      type: object
      required: [from, to]
      description: The period the question names, resolved from today (UTC, inclusive). A month is 30 days.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

    GuideClarification:
      type: object
      required: [question, options]
      properties:
        question: { type: string, maxLength: 120 }
        options: { type: array, minItems: 2, maxItems: 4, items: { type: string, maxLength: 40 } }

    GuideComparison:
      type: object
      required: [subjects, rows]
      properties:
        subjects:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key: { type: string }
              name: { type: string, description: The name as the user wrote it. }
              resourceId: { type: [string, 'null'], format: uuid, description: The subject's own entry; null when not found in our sources. }
              title: { type: [string, 'null'] }
              url: { type: [string, 'null'], format: uri }
        rows:
          type: array
          items:
            type: object
            required: [aspect, cells]
            properties:
              aspect: { type: string }
              cells:
                type: array
                description: One per subject, in the order of `subjects`.
                items:
                  type: object
                  required: [subjectKey]
                  properties:
                    subjectKey: { type: string }
                    text: { type: [string, 'null'], description: AI-written; null when the subject's own text does not state it. }
                    quote: { type: [string, 'null'], description: Exact text from that subject's own description. }
                    reasonCheck: { type: string, enum: [SUPPORTED, REMOVED, NOT_CHECKED], default: NOT_CHECKED }

    GuideExplanation:
      type: object
      required: [sentences]
      properties:
        sentences:
          type: array
          items:
            type: object
            required: [text, quote, resourceId, title, url]
            properties:
              text: { type: string, description: AI-written sentence. }
              quote: { type: string, description: Exact text from the resource below that supports the sentence. }
              resourceId: { type: string, format: uuid }
              title: { type: string }
              url: { type: string, format: uri }
              reasonCheck: { type: string, enum: [SUPPORTED, REMOVED, NOT_CHECKED], default: NOT_CHECKED }

    GuideStreamEvent:
      type: string
      description: The name of each server-sent event of `POST /guide/stream`; its data schema is in that operation's table.
      enum: [planned, understood, clarify, retrieved, chosen, validated, checked, answer, error]

    GuideStreamUnderstood:
      type: object
      required: [intent, subjects]
      properties:
        intent: { $ref: '#/components/schemas/GuideIntent' }
        subjects: { type: array, items: { type: string } }
        window: { oneOf: [{ $ref: '#/components/schemas/GuideWindow' }, { type: 'null' }] }

    GuideStreamPlanned:
      type: object
      required: [searchQuery, constraints]
      properties:
        searchQuery: { type: string, description: Search terms the fast model wrote (qualifiers removed). }
        constraints: { type: array, items: { type: string }, description: Requirements read from the need. }
        model: { type: string, description: The fast model's id. }

    GuideStreamRetrieved:
      type: object
      required: [candidates, sources]
      properties:
        candidates: { type: integer, description: Real search results the reasoning model may choose from. }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStatus' } }

    GuideStreamChosen:
      type: object
      required: [proposed]
      properties:
        proposed: { type: integer, description: Picks the reasoning model proposed, before validation. }
        model: { type: string, description: The reasoning model's id. }

    GuideStreamValidated:
      type: object
      required: [kept, rejected]
      properties:
        kept: { type: integer }
        rejected: { type: integer }

    GuideStreamChecked:
      type: object
      required: [supported, removed, notChecked]
      properties:
        supported: { type: integer, description: Reasons the check found supported by the quote. }
        removed: { type: integer, description: Reasons removed because the check found an unsupported claim. }
        notChecked: { type: integer, description: Reasons without a verdict (the check failed or was not answered). }

    SourceInfo:
      type: object
      required: [id, name, shortName, external, mode, enabled, metered, homepage, resourceTypes]
      properties:
        id: { type: string }
        name: { type: string }
        shortName:
          type: string
          minLength: 1
          maxLength: 12
          description: The name under the source's dot on the Home radar, at most 12 characters.
        external:
          type: boolean
          description: >-
            False for helper2's own sources (helper2-index, helper2-semantic, curated); true for every source run by
            someone else. The Home radar and its source count show only external sources.
        mode: { $ref: '#/components/schemas/SourceMode' }
        enabled: { type: boolean }
        metered:
          type: boolean
          description: >-
            True for a source whose calls spend a paid quota (today the live web source), enabled or not. Only a metered source
            can have `webCredits`.
        homepage: { type: string, format: uri }
        termsUrl: { type: [string, 'null'], format: uri }
        attribution: { type: [string, 'null'] }
        resourceTypes: { type: array, items: { $ref: '#/components/schemas/ResourceType' } }
        family:
          oneOf: [{ $ref: '#/components/schemas/SourceFamily' }, { type: 'null' }]
          description: >-
            The family of a discovery category (`discovery-<category>`, one per category of the AI world); null for
            every other source. The Sources page groups the categories by it.
        lastOutcome: { oneOf: [{ $ref: '#/components/schemas/SourceOutcome' }, { type: 'null' }] }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        lastCheckedSecondsAgo:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            How long ago the last check was, by the server's clock when it answered. A client
            shows "2 min ago" from this, not from its own clock, which may be wrong.
        responseTimeMs:
          type: [integer, 'null']
          format: int64
          description: >-
            Median duration of this replica's last 20 calls to the source (succeeded, failed or timed out; cache hits
            and skipped calls are left out). Null before this replica's first call.
        circuit:
          oneOf: [{ $ref: '#/components/schemas/CircuitState' }, { type: 'null' }]
          description: State of this replica's circuit breaker `source-<id>`; null for a disabled source or one without a circuit (Scout collectors).
        circuitOpenedAt:
          type: [string, 'null']
          format: date-time
          description: When this replica's circuit opened; set only while `circuit` is OPEN.
        webCredits:
          oneOf: [{ $ref: '#/components/schemas/WebCredits' }, { type: 'null' }]
          description: Only on an enabled metered source (`metered`); null on every other source and when the count cannot be read.
        newThisWeek:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >-
            Resources this source brought that Helper2 first discovered in the last 7 days (a rolling window, not the
            calendar week): those with a record from it, and for `helper2-index` every resource of the index (indexed
            and observed). Null for `helper2-semantic` (the same index searched by meaning, no count of its own) and
            when the catalog cannot answer.

    Category:
      type: object
      description: One category of the AI world (ADR 0051, 0053). Our own fixed words, from the configuration.
      required: [id, name, shortName, family]
      properties:
        id: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: The value of the search's `category` filter. }
        name: { type: string }
        shortName: { type: string, maxLength: 12 }
        family: { $ref: '#/components/schemas/SourceFamily' }

    SourceFamily:
      type: string
      description: The seven families of the discovery categories.
      enum: [prompts-and-skills, everyday-apps, creative-and-media, business, developers, hosting-and-infra, run-it-yourself]

    CircuitState:
      type: string
      description: |
        CLOSED = calls go through. OPEN = too many recent calls failed or were slow; the source is skipped without a
        call until the open window ends. HALF_OPEN = a few trial calls decide whether it closes again.
      enum: [CLOSED, OPEN, HALF_OPEN]

    WebCredits:
      type: object
      description: Web search credits of the metered source today (UTC), for the whole cluster. Not a visitor's own count.
      required: [usedToday]
      properties:
        usedToday:
          type: integer
          format: int64
          description: >-
            Credits taken today by live calls from search and the guide and by the Scout's discovery searches, counted
            in Redis by every replica (the Scout's other live web queries are not included).
        dailyCap:
          type: [integer, 'null']
          format: int64
          description: The global daily cap (`H2_LIVE_WEB_DAILY_CREDITS`); the code maximum of the runtime setting when it is empty (ADR 0060); null only without a runtime setting.

    Me:
      type: object
      required: [authenticated, roles, loginProviders, limits, monetisation]
      properties:
        authenticated: { type: boolean }
        displayName: { type: [string, 'null'] }
        roles: { type: array, items: { type: string, enum: [USER, ADMIN] } }
        loginProviders:
          type: array
          description: OAuth2 registrations the user can sign in with (path /oauth2/authorization/{id}).
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        limits: { $ref: '#/components/schemas/Limits' }
        preferences:
          oneOf: [{ $ref: '#/components/schemas/Preferences' }, { type: 'null' }]
          description: The signed-in user's display settings; null for a guest.
        monetisation: { $ref: '#/components/schemas/Monetisation' }

    Monetisation:
      type: object
      description: >-
        How the site funds itself (ADR 0057), as configured. Each value is null while that part is off (no link, no
        script), and all are null on the admin host. Read with GET /me, which every page already calls.
      required: [githubSponsorsUrl, stripePaymentUrl, ga4MeasurementId, ethicalAdsPublisher, adsenseClient, adsenseSlot]
      properties:
        githubSponsorsUrl: { type: [string, 'null'], format: uri, description: "GitHub Sponsors page (`H2_SUPPORT_GITHUB_SPONSORS_URL`)." }
        stripePaymentUrl: { type: [string, 'null'], format: uri, description: "Stripe Payment Link (`H2_SUPPORT_STRIPE_PAYMENT_URL`)." }
        ga4MeasurementId: { type: [string, 'null'], description: "Google Analytics 4 stream, loaded only after consent (`H2_ANALYTICS_GA4_MEASUREMENT_ID`)." }
        ethicalAdsPublisher: { type: [string, 'null'], description: "EthicalAds publisher of the one ad slot (`H2_ADS_ETHICALADS_PUBLISHER`)." }
        adsenseClient:
          type: [string, 'null']
          description: >-
            Google AdSense publisher, ca-pub-... (`H2_ADS_ADSENSE_CLIENT`, ADR 0059). Null unless the ad unit is set too:
            then the page loads Google's consent tool and shows the slot on resource pages.
        adsenseSlot: { type: [string, 'null'], description: "AdSense ad unit of the slot on resource pages (`H2_ADS_ADSENSE_SLOT`, ADR 0059)." }

    Preferences:
      type: object
      required: [radarMotion]
      properties:
        radarMotion:
          type: boolean
          description: >-
            True (the default): the Home radar moves between its sources. False: it shows one set and stays still.
            Reduced motion in the browser stops it either way.

    PreferencesChange:
      type: object
      properties:
        radarMotion: { type: boolean }

    Limits:
      type: object
      description: |
        What this visitor can still do today (UTC day). Read from the same counters that enforce the limits, without
        counting: a guest is counted under a hash of the client address, a signed-in user (with the registered tier
        on) under the user id for web searches. The response never carries the address, the hash or the id.
      required: [guideQuestions, webSearches, resetsAt]
      properties:
        guideQuestions:
          oneOf: [{ $ref: '#/components/schemas/DailyAllowance' }, { type: 'null' }]
          description: >-
            Fresh guide questions per client address (`H2_GUIDE_CLIENT_DAILY_QUESTIONS`, ADR 0017). An answer from the
            cache costs none, and an answer with no AI pick or a question that fails gives its question back (at most
            `H2_GUIDE_CLIENT_DAILY_FREE_ANSWERS` a day); past the limit the guide answers from search only. Null when the guide has no model: it
            then always answers from search only and spends nothing.
        webSearches:
          type: object
          description: Live web searches per feature (ADR 0037), the same numbers as `webSearches` on a search or guide answer.
          required: [search, guide]
          properties:
            search: { oneOf: [{ $ref: '#/components/schemas/WebSearches' }, { type: 'null' }] }
            guide: { oneOf: [{ $ref: '#/components/schemas/WebSearches' }, { type: 'null' }] }
        resetsAt: { type: string, format: date-time, description: The next 00:00 UTC, when every count starts again. }

    DailyAllowance:
      type: object
      required: [limit, remaining]
      properties:
        limit: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }

    BookmarkRequest:
      type: object
      required: [resourceId, title, url]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string, maxLength: 300 }
        url: { type: string, format: uri, description: "http(s) only, max 2000 chars (validated server-side)." }
        type: { oneOf: [{ $ref: '#/components/schemas/ResourceType' }, { type: 'null' }] }

    Bookmark:
      type: object
      required: [resourceId, title, url, savedAt]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        url: { type: string, format: uri }
        type: { oneOf: [{ $ref: '#/components/schemas/ResourceType' }, { type: 'null' }] }
        savedAt: { type: string, format: date-time }

    ReviewStatus:
      type: string
      description: SUPERSEDED is set by a newer enrichment run of the same resource, never by a person.
      enum: [OPEN, ACCEPTED, REJECTED, SUPERSEDED]

    ReviewKind:
      type: string
      description: >-
        COURSE_CANDIDATE is a course page found by Scout and not yet in the catalog (no resource; URL in details).
        EXAMPLE_CANDIDATE is a home example a model drafted for the resource (the draft as JSON in details: label,
        query, path, model); accepting it adds the example. RESOURCE_CANDIDATE is a product page found by the Scout's
        discovery and not yet in the catalog (no resource; the candidate as JSON in details: sourceId, url,
        title, type, tags, snippet); accepting it indexes it, unless another source listed the page
        meanwhile.
      enum: [ENRICHMENT_VALIDATION, RELATIONSHIP_CANDIDATE, USER_REPORT, COURSE_CANDIDATE, EXAMPLE_CANDIDATE,
        RESOURCE_CANDIDATE]

    AdminOverview:
      type: object
      required: [generatedAt, openReviewItems, enrichmentBacklog, budgets, recentRuns, failedRunsLast24h, homeExamples, overridesActive]
      properties:
        generatedAt: { type: string, format: date-time }
        openReviewItems:
          type: array
          description: Every kind, 0 when none waits.
          items: { $ref: '#/components/schemas/ReviewKindCount' }
        enrichmentBacklog: { type: integer, minimum: 0, description: Resources waiting for enrichment (the Scout takes them by its own order). }
        budgets:
          type: array
          description: Every daily model budget, by name.
          items: { $ref: '#/components/schemas/BudgetToday' }
        webCredits:
          oneOf: [{ $ref: '#/components/schemas/WebCredits' }, { type: 'null' }]
          description: Live web search calls today; null when the metered source is off or its counter cannot answer.
        recentRuns:
          type: array
          description: The last Scout runs, newest first (at most 10).
          items: { $ref: '#/components/schemas/ScoutRun' }
        failedRunsLast24h: { type: integer, minimum: 0 }
        homeExamples: { $ref: '#/components/schemas/HomeExampleCounts' }
        overridesActive: { type: integer, minimum: 0, description: Runtime settings whose value is not the default now (ADR 0060). }
        grafanaUrl: { type: [string, 'null'], format: uri, description: "The metrics dashboard for trends (H2_ADMIN_GRAFANA_URL); null when not set." }

    HomeExampleCounts:
      type: object
      description: >-
        The home examples of every locale (ADR 0049). Shown: ACTIVE and the check is PASS. Hidden: ACTIVE and the
        check is WEAK, FAIL or PENDING. Paused: PAUSED, whatever the check.
      required: [shown, hidden, paused]
      properties:
        shown:
          type: array
          description: Every path, 0 when none is shown.
          items: { $ref: '#/components/schemas/ExamplePathCount' }
        hidden:
          type: array
          description: WEAK, FAIL and PENDING, 0 when none; never PASS.
          items: { $ref: '#/components/schemas/ExampleOutcomeCount' }
        paused: { type: integer, minimum: 0 }

    ExamplePathCount:
      type: object
      required: [path, count]
      properties:
        path: { $ref: '#/components/schemas/AudiencePath' }
        count: { type: integer, minimum: 0 }

    ExampleOutcomeCount:
      type: object
      required: [outcome, count]
      properties:
        outcome: { $ref: '#/components/schemas/ExampleCheckOutcome' }
        count: { type: integer, minimum: 0 }

    EffectiveConfig:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/ConfigGroup' }

    ConfigGroup:
      type: object
      required: [id, title, settings]
      properties:
        id: { type: string, description: "A stable id: models, guide, search, scout, ..." }
        title: { type: string }
        settings:
          type: array
          items: { $ref: '#/components/schemas/ConfigSetting' }

    ConfigSetting:
      type: object
      required: [key, label, kind, value, unit, variable]
      properties:
        key: { type: string, description: "A stable id, <group>.<name>." }
        label: { type: string }
        kind:
          type: string
          description: >-
            How to read value. COUNT and CAP are whole numbers (CAP null = no cap); FLAG is true or false; DURATION is
            seconds; MODEL and VERSION are null when there is none; SCHEDULE is a Spring cron, UTC; NAMES are
            comma-separated.
          enum: [COUNT, CAP, FLAG, DURATION, MODEL, VERSION, SCHEDULE, NAMES]
        value:
          type: [string, 'null']
          maxLength: 500
          description: "\"(hidden)\" when the value has a quote, an @ or more than 500 characters."
        unit: { type: [string, 'null'], description: "The unit of a COUNT or CAP: calls a day, tokens, ..." }
        variable: { type: [string, 'null'], description: The H2_ variable that sets it; null when the code or the chart fixes it. }

    RuntimeSettings:
      type: object
      required: [overridesActive, settings]
      properties:
        overridesActive: { type: integer, minimum: 0, description: Settings whose value is not the default now. }
        settings:
          type: array
          items: { $ref: '#/components/schemas/RuntimeSettingState' }

    RuntimeSettingState:
      type: object
      required: [key, label, unit, help, min, max, variable, defaultValue, value, overridden, inUse, version, history]
      properties:
        key: { type: string, description: The setting's key on the Settings page (ConfigSetting.key). }
        label: { type: string }
        unit: { type: string, description: "calls a day, calls a run, credits a day" }
        help: { type: string, description: One line on what the setting does and what 0 means. }
        min: { type: integer, minimum: 0, description: Always 0; 0 turns the use off. }
        max: { type: integer, minimum: 0, description: The absolute maximum, in code; more needs a pull request. }
        variable: { type: string, description: The H2_ variable whose value is the default. }
        defaultValue: { type: [integer, 'null'], minimum: 0, description: The H2_ value; null = no cap, or the setting is not used on this replica. }
        value: { type: [integer, 'null'], minimum: 0, description: The value applied now; null = no cap. }
        overridden: { type: boolean, description: True when an administrator set the value; false when the default applies. }
        inUse: { type: boolean, description: False when no module of this replica uses the setting (the feature is off); a change is kept and applies when it is on. }
        version: { type: integer, minimum: 0, description: The setting's newest change; send it back with a change. 0 = never changed. }
        history:
          type: array
          description: The last changes, newest first (at most 10).
          items: { $ref: '#/components/schemas/RuntimeSettingHistoryEntry' }

    RuntimeSettingHistoryEntry:
      type: object
      required: [version, value, changedBy, changedAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        value: { type: [integer, 'null'], minimum: 0, description: The value set; null = back to the default. }
        changedBy: { type: string, description: "The administrator's provider subject (GitHub: the numeric user id)." }
        changedAt: { type: string, format: date-time }
        reason: { type: [string, 'null'] }

    RuntimeSettingChange:
      type: object
      required: [value, version]
      properties:
        value: { type: integer, minimum: 0, description: "0 to the setting's max; 0 turns the use off." }
        version: { type: integer, minimum: 0, description: The version the change was made on. }
        reason: { type: [string, 'null'], maxLength: 500, description: "One plain line; a control or format character is a 400." }

    RuntimeSettingReset:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0, description: The version the reset was made on. }
        reason: { type: [string, 'null'], maxLength: 500, description: "One plain line; a control or format character is a 400." }

    DiscoveryHostKind:
      type: string
      enum: [WRITING, DIRECTORY]
      description: WRITING publishes articles about many products; DIRECTORY lists products.

    DiscoveryHostEntry:
      type: object
      required: [host, kind, addedBy, addedAt]
      properties:
        host: { type: string, maxLength: 253 }
        kind: { $ref: '#/components/schemas/DiscoveryHostKind' }
        addedBy: { type: string, description: 'The administrator (provider subject), or "migration" for the first lists.' }
        addedAt: { type: string, format: date-time }
        reason: { type: [string, 'null'], maxLength: 500 }

    DiscoveryHosts:
      type: object
      required: [hosts, max]
      properties:
        hosts:
          type: array
          items: { $ref: '#/components/schemas/DiscoveryHostEntry' }
        max: { type: integer, description: The most hosts the two lists hold together. }

    DiscoveryHostAdd:
      type: object
      required: [host, kind]
      properties:
        host: { type: string, maxLength: 260, description: 'A host name such as "techcrunch.com"; no scheme or path.' }
        kind: { $ref: '#/components/schemas/DiscoveryHostKind' }
        reason: { type: [string, 'null'], maxLength: 500, description: "One plain line; a control or format character is a 400." }

    DiscoveryHostRemove:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500, description: "One plain line; a control or format character is a 400." }

    EnrichmentQueuePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EnrichmentQueueEntry' }
        next: { type: [string, 'null'], description: The cursor of the next page; null on the last page. }

    EnrichmentQueueView:
      type: string
      description: "WAITING: the backlog in the Scout's order. SKIPPED: skipped by an admin. OUT_OF_RETRIES: failed runs reached the cap."
      enum: [WAITING, SKIPPED, OUT_OF_RETRIES]
      default: WAITING

    EnrichmentSkip:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 200, description: Why the resource is skipped; optional. }

    EnrichmentQueueEntry:
      type: object
      required: [resourceId, title, state, firstDiscoveredAt, failedRuns]
      properties:
        resourceId: { type: string, format: uuid }
        title: { type: string }
        state:
          type: string
          description: "PRIORITISED: moved to the top by an admin. WAITING: in its own part. SKIPPED: skipped by an admin. OUT_OF_RETRIES: failed runs reached the cap."
          enum: [PRIORITISED, WAITING, SKIPPED, OUT_OF_RETRIES]
        waiting:
          type: [string, 'null']
          description: "Why it waits; null when it does not (SKIPPED, OUT_OF_RETRIES). NEW: never enriched. MODEL_UNAVAILABLE: the last run found no model. RETRY: the last run FAILED and retries are left."
          enum: [NEW, MODEL_UNAVAILABLE, RETRY, null]
        skippedAt: { type: [string, 'null'], format: date-time, description: When it was skipped; null unless SKIPPED. }
        skipReason: { type: [string, 'null'], description: The reason given when it was skipped. }
        firstDiscoveredAt: { type: string, format: date-time }
        failedRuns: { type: integer, minimum: 0, description: Failed runs since an admin last requeued it; the number the cap is checked against. }
        lastOutcome: { type: [string, 'null'], enum: [VALIDATED, PARTIAL, REJECTED, LLM_UNAVAILABLE, FAILED, null] }
        lastRunAt: { type: [string, 'null'], format: date-time }

    ReviewKindCount:
      type: object
      required: [kind, count]
      properties:
        kind: { $ref: '#/components/schemas/ReviewKind' }
        count: { type: integer, minimum: 0 }

    BudgetToday:
      type: object
      required: [name, dailyLimit]
      properties:
        name: { type: string, description: "guide, translation, enrichment, enrichment-gap, classifier, tool-guide, ..." }
        dailyLimit: { type: integer, description: Model calls a UTC day; 0 turns the use off. }
        usedToday: { type: [integer, 'null'], minimum: 0, description: Calls counted today across every replica; null when the shared counter cannot answer. }

    ReviewItemPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }
        total: { type: integer, description: Items with the requested status and kind, across all pages. }

    ReviewItem:
      type: object
      required: [id, kind, status, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ReviewKind' }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        resourceId: { type: [string, 'null'], format: uuid }
        resourceTitle: { type: [string, 'null'] }
        reason: { type: string }
        details: { type: [string, 'null'] }
        categories:
          type: array
          items: { type: string }
          description: >-
            The discovery categories of a resource candidate (its tags, e.g. `coding`, `self-hosted`); empty for every
            other kind.
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'] }

    ReviewBulkResolution:
      type: object
      required: [ids, status]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          description: >-
            Each id once. A repeated id is refused with 400. The list is not declared uniqueItems on purpose: a set would
            drop the repeat before the server sees it.
          items: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        note: { type: [string, 'null'], maxLength: 1000 }

    ReviewBulkResult:
      type: object
      required: [batch, items]
      properties:
        batch: { type: string, format: uuid, description: The id in the audit entries of this batch (`bulk:<batch>`). }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewBulkItem' }

    ReviewBulkItem:
      type: object
      required: [id, outcome]
      properties:
        id: { type: string, format: uuid }
        outcome:
          type: string
          description: >-
            RESOLVED: decided now. NOT_OPEN: already decided. NOT_FOUND: no such item. NOT_ALLOWED: this item cannot be
            accepted in bulk (it adds to the catalog or publishes, or its run has a conflict on licence, open source or
            pricing); it stays open.
          enum: [RESOLVED, NOT_OPEN, NOT_FOUND, NOT_ALLOWED]

    RelationshipTargetChange:
      type: object
      description: Exactly one of the three.
      properties:
        resourceId: { type: [string, 'null'], format: uuid }
        newResource:
          oneOf: [{ $ref: '#/components/schemas/NewResource' }, { type: 'null' }]
        title: { type: [string, 'null'], minLength: 1, maxLength: 120 }

    NewResource:
      type: object
      required: [title, url, type]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        url: { type: string, maxLength: 2000, description: The official https address. }
        type: { type: string, enum: [PRODUCT, MODEL, AGENT, PROMPT, SKILL, MCP_SERVER, LIBRARY, DATASET] }

    ReviewEvidence:
      type: object
      required: [item, validationErrors, fields]
      properties:
        item: { $ref: '#/components/schemas/ReviewItem' }
        run:
          oneOf: [{ $ref: '#/components/schemas/ReviewRun' }, { type: 'null' }]
          description: The enrichment run the item links to; null for items with no run.
        validationErrors:
          type: array
          maxItems: 50
          items: { type: string }
          description: What the code check refused in the run, in its words. Each error can quote the refused model output, so aiContent lists it as AI-written. Empty for a relationship candidate.
        fields:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ReviewField' }
          description: The fields the run stored, CONFLICTING first, then UNVERIFIED, VERIFIED and REJECTED. Empty for a relationship candidate.
        relationship:
          oneOf: [{ $ref: '#/components/schemas/ReviewRelationship' }, { type: 'null' }]
          description: The relationship a relationship candidate is about; null for every other kind.
        aiContent:
          oneOf: [{ $ref: '#/components/schemas/AiContentMarker' }, { type: 'null' }]
          description: Present when the evidence holds AI-written values (ADR 0038).

    ReviewRun:
      type: object
      required: [id, provider, model, promptVersion, outcome, startedAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        outcome: { type: string, enum: [VALIDATED, PARTIAL, REJECTED, LLM_UNAVAILABLE, FAILED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        extraEvidence:
          type: [string, 'null']
          description: The README or model card the run read in its gap round (ADR 0043), e.g. `github-readme:owner/name`.

    ReviewField:
      type: object
      required: [field, value, origin, verification, quotes]
      properties:
        field: { type: string }
        value: { type: string, description: AI-written. }
        origin: { $ref: '#/components/schemas/ValueOrigin' }
        verification: { $ref: '#/components/schemas/Verification' }
        quotes: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/ReviewQuote' } }

    ReviewRelationship:
      type: object
      required: [kind, target, verification, origin, quotes]
      properties:
        kind: { type: string, enum: [INTEGRATES_WITH, USES, SUPPORTS, COMPATIBLE_WITH, ABOUT] }
        target: { type: string, description: The name the model gave (AI-written), or the one an admin chose. }
        targetId: { type: [string, 'null'], format: uuid, description: The catalog resource of that name; null when none. }
        verification: { $ref: '#/components/schemas/Verification' }
        origin: { $ref: '#/components/schemas/ValueOrigin' }
        targetOrigin:
          description: CURATED when an admin chose the target (ADR 0064); the target then is not AI-written. Null otherwise.
          oneOf: [{ $ref: '#/components/schemas/ValueOrigin' }, { type: 'null' }]
        quotes: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/ReviewQuote' } }

    ReviewQuote:
      type: object
      required: [sourceUrl, retrievedAt]
      description: Copied from a source, not AI-written.
      properties:
        excerpt: { type: [string, 'null'], maxLength: 500 }
        sourceUrl: { type: string, description: As the source gave it; a page shows it as a link only when it is http(s). }
        sourceId: { type: [string, 'null'], description: The source the quote was read from; null for a page the run read itself. }
        retrievedAt: { type: string, format: date-time }

    ReviewResolution:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        note: { type: [string, 'null'], maxLength: 1000 }

    AuditEntryPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        total: { type: integer, description: Entries across all pages. }

    AuditEntry:
      type: object
      required: [id, adminId, action, at, outcome]
      properties:
        id: { type: string, format: uuid }
        adminId: { type: string, description: "The administrator's provider subject (GitHub: the numeric user id)." }
        action: { type: string, enum: [RESOLVE_REVIEW_ITEM, START_SCOUT_RUN, ADD_HOME_EXAMPLE, CHANGE_HOME_EXAMPLE, REMOVE_HOME_EXAMPLE, DRAFT_HOME_EXAMPLES, RECHECK_ENRICHMENT, BACKFILL_CATEGORIES, REQUEUE_ENRICHMENT, SKIP_ENRICHMENT, PRIORITISE_ENRICHMENT, CHANGE_SETTING, ADD_DISCOVERY_HOST, REMOVE_DISCOVERY_HOST, CHANGE_RELATIONSHIP_TARGET, ADD_RESOURCE] }
        targetId: { type: [string, 'null'], description: "The review item id, the source id, the home example id, the resource id or the setting's key; null when a run covered every source." }
        at: { type: string, format: date-time }
        outcome: { type: string, description: "ACCEPTED, REJECTED, NOT_OPEN or NOT_FOUND for a review item, NOT_ALLOWED for one refused in bulk, followed by bulk:<batch> when decided in bulk; STARTED or BUSY for a Scout run; STARTED for a category backfill; ADDED, CHANGED, PAUSED, ACTIVATED, REMOVED, DUPLICATE, CONFLICT, INVALID or NOT_FOUND for a home example; REQUEUED, REQUEUED_RESET, SKIPPED, PRIORITISED, NOT_FOUND, NOT_STOPPED, NOT_WAITING, ALREADY_SKIPPED, ALREADY_PRIORITISED or TOP_FULL for the enrichment queue; CHANGED, RESET, OUT_OF_RANGE or CONFLICT for a runtime setting. LINKED <resource id> or RENAMED for a relationship target; ADDED for a resource added from the review list." }
        before: { type: [string, 'null'], description: "The value before a setting change (\"default\" for the default); null for other actions." }
        after: { type: [string, 'null'], description: The value after a setting change; null for other actions. }
        reason: { type: [string, 'null'], description: Why the administrator changed a setting (optional). }

    EnrichmentRecheck:
      type: object
      description: Counts only (ADR 0056).
      required: [checked, fieldsRejected, claimsDropped, runsRequested]
      properties:
        checked: { type: integer, minimum: 0, description: Resources whose stored answer was checked. }
        fieldsRejected: { type: integer, minimum: 0, description: Verified pricing, type or use case values whose quotes do not state them. }
        claimsDropped: { type: integer, minimum: 0, description: Summary sentences that failed the claim check. }
        runsRequested: { type: integer, minimum: 0, description: Resources put back in the enrichment backlog. }

    ScoutRunRequest:
      type: object
      properties:
        sourceId: { type: [string, 'null'], description: Omit to run every enabled collector. }

    ScoutRun:
      type: object
      required: [id, sourceId, status, startedAt, itemsSeen, itemsChanged]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, SKIPPED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        itemsSeen: { type: integer }
        itemsChanged: { type: integer }
        enrichmentsQueued: { type: integer }
        message: { type: [string, 'null'] }
