# Words the guide's backup rules read in a question (IntentRules, ADR 0032). Comma-separated phrases, matched
# case-insensitively as whole words; a space matches any run of whitespace. Every language file is loaded and merged.

period.past = last, past, previous
period.this = this
period.next = next, upcoming, coming
period.today = today

unit.day = day, days
unit.week = week, weeks
unit.month = month, months
unit.year = year, years

intent.newest = latest, newest, recent, recently, just released, just launched
# "new" alone is too vague ("I am new to AI", "a new way to…"): it asks for the newest only right before a kind of
# resource, with at most one word between that is not one of new-skip ("new MCP servers", "any new open-source models").
intent.new-word = new
intent.new-kind = tool, tools, model, models, llm, llms, mcp, mcps, server, servers, library, libraries, agent, agents, \
  paper, papers, framework, frameworks, app, apps, dataset, datasets, prompt, prompts, plugin, plugins, extension, \
  extensions, release, releases, sdk, sdks, cli, clis
intent.new-skip = to, for, with, in, at, on, of, and, or, the, a, an, way, ways
intent.alternatives = alternative to, alternatives to, alternative for, alternatives for, instead of, similar to, \
  replacement for
intent.compare = vs, versus, compare to, compared to, compare with, compared with, compare, difference between
# Asked at the start of the question only. "what is X" only: "what are the new tools" asks for a list.
intent.what-is = what is, what's
intent.when = when is, when was, when does, when did, when will
intent.how-to = how do, how can, how to, how should
intent.learn = certificate, certificates, certification, certifications, course, courses, coursera, udemy, edx, o'reilly

# Words that name no subject in a question about new resources; a query of only these browses by date and type.
query.generic = ai, a.i, artificial, intelligence, tool, tools, new, latest, newest, recent, best, top, resource, \
  resources, thing, things, stuff, project, projects, app, apps, application, applications, software, launch, \
  launched, launches, release, released, releases, born, created, list, month, week, year, day, days, last, past, \
  this, today, the, of, in, what, which, are, is, was, were, been, have, has, there, any, some, show, me, give, find, \
  tell, please, can, could, you, i, a, an, and, or, for, to, out, came, appeared, month's, week's, weeks, months, \
  years, s

# A WHEN question with one of these (in its words or its planned query) asks for an event's dates.
when.event = event, events, conference, conferences, hackathon, hackathons, meetup, meetups, summit, summits, \
  webinar, webinars, workshop, workshops, expo, deadline, deadlines
# A start names an event only next to a course word (intent.learn): "when did Ollama start?" asks for a release date.
when.start = start, starts, begin, begins

# A word that names the kind of thing the subject is: "the Gemini model" is never asked which Gemini.
subject.kind = model, models, llm, llms, dataset, datasets, tool, tools, cli, app, library, sdk, framework, agent

# A trailing type word that still names the subject itself ("Ollama app").
subject.type-suffix = app, ai, cli, desktop, model, models, framework, sdk, server, studio
