spring:
  config:
    import: classpath:helper2-shared.yaml
---
spring:
  application:
    name: helper2
helper2:
  schema:
    logins:
      h2_public: ${H2_DATABASE_PUBLIC_PASSWORD:}
      h2_backoffice: ${H2_DATABASE_BACKOFFICE_PASSWORD:}
    statement-timeouts:
      h2_public: 5s
      h2_backoffice: 60s
