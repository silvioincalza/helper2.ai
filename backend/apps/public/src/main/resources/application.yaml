spring:
  config:
    import: classpath:helper2-shared.yaml
---
spring:
  application:
    name: helper2
management:
  metrics:
    tags:
      application: helper2
  opentelemetry:
    resource-attributes:
      service.name: helper2
resilience4j:
  circuitbreaker:
    instances:
      llm-chat-guide:
        base-config: model
        ignore-exception-predicate: ai.helper2.platform.llm.ModelErrors$NotFromProvider
        slow-call-duration-threshold: ${H2_RESILIENCE_LLM_SLOW_CALL:35s}
        slow-call-rate-threshold: 50
  bulkhead:
    instances:
      setup-guide:
        max-concurrent-calls: ${H2_SETUP_GUIDE_MAX_CONCURRENT:2}
        max-wait-duration: 0
helper2:
  guide:
    thinking:
      plan-tokens: ${H2_GUIDE_THINK_PLAN_TOKENS:0}
      choose-tokens: ${H2_GUIDE_THINK_CHOOSE_TOKENS:0}
      verify-tokens: ${H2_GUIDE_THINK_VERIFY_TOKENS:0}
      browse-tokens: ${H2_GUIDE_THINK_BROWSE_TOKENS:2048}
    daily-model-calls: ${H2_GUIDE_DAILY_MODEL_CALLS:600}
    client-daily-questions: ${H2_GUIDE_CLIENT_DAILY_QUESTIONS:30}
    client-daily-free-answers: ${H2_GUIDE_CLIENT_DAILY_FREE_ANSWERS:5}
    question-deadline: ${H2_GUIDE_QUESTION_DEADLINE:PT90S}
    model-call-timeout: ${H2_LLM_TIMEOUT:40s}
    model-call-minimum: 10s
    deadline-margin: 2s
    heartbeat: ${H2_GUIDE_HEARTBEAT:PT15S}
    cache-ttl: ${H2_GUIDE_CACHE_TTL:PT24H}
    similar-threshold: ${H2_GUIDE_SIMILAR_THRESHOLD:}
    max-candidates: ${H2_GUIDE_MAX_CANDIDATES:24}
    choose-max-tokens: ${H2_NEBIUS_CHOOSE_MAX_TOKENS:8192}
    model-stream: ${H2_GUIDE_MODEL_STREAM:OFF}
    fairness:
      network-daily-questions: ${H2_GUIDE_NETWORK_DAILY_QUESTIONS:300}
      client-concurrent-questions: ${H2_GUIDE_CLIENT_CONCURRENT_QUESTIONS:2}
      budget-pace-slots: ${H2_GUIDE_BUDGET_PACE_SLOTS:12}
  schema:
    logins:
      h2_public: ${H2_DATABASE_PUBLIC_PASSWORD:}
      h2_backoffice: ${H2_DATABASE_BACKOFFICE_PASSWORD:}
    statement-timeouts:
      h2_public: 5s
      h2_backoffice: 60s
  setup:
    document-timeout: ${H2_SETUP_DOCUMENT_TIMEOUT:10s}
    npm-readme-base-url: ${H2_SETUP_NPM_README_BASE_URL:https://cdn.jsdelivr.net}
    cache-ttl: ${H2_SETUP_CACHE_TTL:PT1H}
    document-cache: ${H2_SETUP_DOCUMENT_CACHE_MB:32}
    hourly-fetches: ${H2_SETUP_HOURLY_FETCHES:1000}
    github-token: ${H2_SETUP_GITHUB_TOKEN:}
    hosts:
      github: ${helper2.sources.github.base-url}
      huggingface: ${helper2.sources.huggingface.base-url}
      hf-token: ${helper2.sources.huggingface.token}
    mcp-registry:
      base-url: ${helper2.sources.mcp-registry.base-url}
      timeout: ${helper2.sources.mcp-registry.timeout}
    guide:
      daily-model-calls: ${H2_SETUP_GUIDE_DAILY_MODEL_CALLS:500}
      client-daily-guides: ${H2_SETUP_GUIDE_CLIENT_DAILY:20}
      network-daily-guides: ${H2_SETUP_GUIDE_NETWORK_DAILY:200}
      reasoning: ${H2_SETUP_GUIDE_REASONING:false}
      cache-ttl: ${H2_SETUP_GUIDE_CACHE_TTL:P7D}
      unreadable-ttl: ${H2_SETUP_UNREADABLE_TTL:PT10M}
      step-text: ${H2_SETUP_GUIDE_STEP_TEXT:VERIFIED}
