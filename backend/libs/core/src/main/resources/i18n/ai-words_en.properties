# Words that say a resource is about AI, read by Classification.isAiRelated.
# ai.strong: one of them is enough. ai.weak: they also have a common meaning outside AI (a terminal prompt, a
# user agent, vector graphics), so they count only next to a second AI word, strong or weak.
# Phrases are comma-separated; a word may end with digits (gpt4, llama3).

ai.strong = ai, a.i., ml, rag, llm, llms, gpt, genai, generative, mcp, model context protocol, agentic, machine learning, machine-learning, \
  deep learning, deep-learning, neural, openai, anthropic, claude, gemini, ollama, llama, mistral, mixtral, deepseek, qwen, gemma, \
  nemotron, langchain, langgraph, llamaindex, chatbot, nlp, chatgpt, pytorch, tensorflow, keras, huggingface, hugging face, crewai, \
  vllm, language model, language models, large language model, large language models, mixture of experts, stable diffusion, \
  named entity recognition, speech recognition, text to speech, text-to-speech, computer vision

ai.weak = agent, agents, prompt, prompts, vector, transformer, transformers, embedding, embeddings, diffusion, nvidia, \
  copilot, segmentation, inference
