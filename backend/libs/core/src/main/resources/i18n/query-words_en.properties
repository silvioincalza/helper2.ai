# Words the query analyzer and the search intent read in a query (QueryAnalyzer, IntentClass). Comma-separated, matched
# case-insensitively as whole words. Every language file is loaded and merged; a use case's .query word is English only.

# Use cases, in the order a result lists them.
usecases = writing, translation, summarization, image-generation, coding, research, transcription, automation, \
  design, learning, data-analysis, chat, video, audio
# The English term a query in another language is expanded with.
usecase.writing.query = writing
usecase.translation.query = translation
usecase.summarization.query = summarize
usecase.image-generation.query = image generation
usecase.coding.query = coding
usecase.research.query = research
usecase.transcription.query = transcription
usecase.automation.query = automation
usecase.design.query = design
usecase.learning.query = learning
usecase.data-analysis.query = data analysis
usecase.chat.query = chatbot
usecase.video.query = video
usecase.audio.query = audio

usecase.writing = write, writing, copywriting, blog, essay
usecase.translation = translate, translation, translator
usecase.summarization = summarize, summarise, summary, summarization, tldr
usecase.image-generation = image, images, illustration, picture, text-to-image
usecase.coding = code, coding, programming, developer
usecase.research = research, papers, literature, study
usecase.transcription = transcribe, transcription, speech-to-text, subtitles
usecase.automation = automate, automation, workflow, workflows
usecase.design = design, logo, ui, mockup
usecase.learning = learn, learning, tutor, education
usecase.data-analysis = analytics, spreadsheet, data, analysis
usecase.chat = chat, chatbot, assistant
usecase.video = video, videos, editing
usecase.audio = audio, music, voice, podcast

# A word that names the kind of resource asked for.
type.library = library, libraries, package
type.model = model, models
type.dataset = dataset, datasets
type.paper = paper, papers
# "server" names an MCP server only next to "mcp".
server = server, servers
repository.generic = mcp, server, servers, model, context, protocol, modelcontextprotocol

# Words that carry no subject of their own.
function = a, an, the, of, for, to, in, on, at, by, with, from, over, into, and, or, so, that, which, who, can, could, \
  will, should, is, are, be, it, its, my, me, i, we, you, your, our, how, what, some, any
request = build, create, make, find, get, need, want, use, using, help, best, good, top, new, open, free, simple, easy, \
  tool, tools, app, apps, application, applications, file, files

# Names of one thing: a query with one also searches the others. Groups are comma-separated, names space-separated.
synonyms = postgres postgresql, js javascript, ts typescript, k8s kubernetes

# A query with one of these asks for news, courses or events (IntentClass.TIME_BOUND).
time-bound = news, course, courses, certification, certifications, hackathon, hackathons, conference, conferences, \
  event, events, meetup, meetups, summit, webinar, webinars, workshop, workshops

# Words ranking leaves out when it counts the query's words in a title. Only English and Italian have them: words of
# another language would change how an English or Italian query ranks.
ranking.stop = a, an, and, as, at, by, for, from, in, into, of, on, or, the, to, with
