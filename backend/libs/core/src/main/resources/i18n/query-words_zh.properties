# Chinese words for the query analyzer; see query-words_en.properties for the format. Chinese has no spaces: a query is
# cut at these words before it is read, the longest first.

# Words that hold a shorter known word and mean something else: 数据库 is a database, not data (数据) and a library (库).
# A single character is a word here only when it is almost never part of a name (的, 了, 吗, 呢, 库): 新 is in 新加坡.
whole = 数据库, 向量数据库, 代码库, 知识库, 模型库, 图库, 工具库, 仓库

