name: searchavo

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: searchavo
      POSTGRES_USER: ${SA_DATABASE_USER:-searchavo}
      POSTGRES_PASSWORD: ${SA_DATABASE_PASSWORD:-searchavo-local-only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d searchavo"]
      interval: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: { context: ., dockerfile: deploy/Dockerfile }
    environment:
      SA_DATABASE_URL: jdbc:postgresql://postgres:5432/searchavo
      SA_DATABASE_USER: ${SA_DATABASE_USER:-searchavo}
      SA_DATABASE_PASSWORD: ${SA_DATABASE_PASSWORD:-searchavo-local-only}
      SA_REDIS_HOST: redis
      SA_SCHEMA_MIGRATE: "true"
      SA_NVIDIA_API_KEY: ${SA_NVIDIA_API_KEY:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
