{{- $name := include "helper2.appName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 1 (required "app.replicas" .Values.app.replicas) .Values.canary.only }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata:
      labels: { app: {{ $name }} }
      annotations:
        {{- with .Values.envSecret.revision }}
        checksum/env-revision: {{ . | quote }}
        {{- end }}
        {{- if and .Values.redis.auth.enabled .Values.redis.auth.existingSecret }}
        checksum/redis-auth-revision: {{ include "helper2.redisAuthRevision" . }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: helper2
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: {{ $name }} } } }
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      {{- $shutdown := .Values.app.shutdown }}
      terminationGracePeriodSeconds: {{ add (int (required "app.shutdown.preStopSeconds" $shutdown.preStopSeconds)) (int (required "app.shutdown.drainSeconds" $shutdown.drainSeconds)) 5 }}
      initContainers:
        - name: shell
          image: {{ include "helper2.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [cp, /usr/share/helper2/shell/index.html, /shell/index.html]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: shell, mountPath: /shell }]
      containers:
        - name: app
          image: {{ include "helper2.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: [{ secretRef: { name: {{ include "helper2.envSecret" . }} } }]
          env:
            - { name: H2_PROFILES, value: {{ .Values.app.springProfiles | quote }} }
            - { name: H2_SHUTDOWN_TIMEOUT, value: "{{ int $shutdown.drainSeconds }}s" }
            - { name: H2_DATABASE_URL, value: "jdbc:postgresql://postgres:5432/helper2" }
            - { name: H2_DATABASE_USER, value: h2_public }
            - name: H2_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PUBLIC_PASSWORD } }
            - { name: H2_REDIS_HOST, value: redis }
            {{- if .Values.redis.auth.enabled }}
            - { name: H2_REDIS_USER, value: h2_public }
            - name: H2_REDIS_PASSWORD
              valueFrom: { {{ include "helper2.redisPasswordFrom" (list . "H2_REDIS_PUBLIC_PASSWORD") }} }
            {{- else }}
            - { name: H2_REDIS_PASSWORD, value: "" }
            {{- end }}
            - { name: H2_BUILD_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: H2_NOINDEX, value: {{ .Values.app.noindex | toString | quote }} }
            {{- with .Values.app.monetisation }}
            {{- with .githubSponsorsUrl }}
            - { name: H2_SUPPORT_GITHUB_SPONSORS_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .stripePaymentUrl }}
            - { name: H2_SUPPORT_STRIPE_PAYMENT_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .ga4MeasurementId }}
            - { name: H2_ANALYTICS_GA4_MEASUREMENT_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .ethicalAdsPublisher }}
            - { name: H2_ADS_ETHICALADS_PUBLISHER, value: {{ . | quote }} }
            {{- end }}
            {{- with .adsenseClient }}
            - { name: H2_ADS_ADSENSE_CLIENT, value: {{ . | quote }} }
            {{- end }}
            {{- with .adsenseSlot }}
            - { name: H2_ADS_ADSENSE_SLOT, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- with .Values.app.publicBaseUrl }}
            - { name: H2_PUBLIC_BASE_URL, value: {{ . | quote }} }
            {{- end }}
            {{- $limits := .Values.app.dailyLimits }}
            {{- range $name, $value := dict "H2_LIVE_WEB_GUEST_SEARCH" $limits.webSearches.search "H2_LIVE_WEB_GUEST_GUIDE" $limits.webSearches.guide "H2_GUIDE_CLIENT_DAILY_QUESTIONS" $limits.guideQuestions "H2_LIVE_WEB_DAILY_CREDITS" $limits.webSearchCredits "H2_GUIDE_DAILY_MODEL_CALLS" $limits.guideModelCalls "H2_GUIDE_BUDGET_PACE_SLOTS" $limits.guideBudgetPaceSlots "H2_GUIDE_NETWORK_DAILY_QUESTIONS" $limits.guideNetworkQuestions "H2_SETUP_GUIDE_STEP_TEXT" .Values.app.setupGuideStepText "H2_GUIDE_MODEL_STREAM" .Values.app.guideModelStream }}
            {{- if not (kindIs "invalid" $value) }}
            - { name: {{ $name }}, value: {{ $value | toString | quote }} }
            {{- end }}
            {{- end }}
            {{- with .Values.app.guideCacheTtl }}
            - { name: H2_GUIDE_CACHE_TTL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.app.guideSimilarThreshold }}
            - { name: H2_GUIDE_SIMILAR_THRESHOLD, value: {{ . | toString | quote }} }
            {{- end }}
            - { name: H2_RETENTION_BACKUPS, value: {{ printf "P%dD" (int .Values.backup.retentionDays) | quote }} }
            - { name: H2_COOKIE_SECURE, value: "true" }
            - { name: H2_FORWARD_HEADERS_STRATEGY, value: native }
            - { name: H2_LOG_FORMAT, value: logstash }
            - { name: H2_ENVIRONMENT, value: {{ required "app.environment" .Values.app.environment | quote }} }
            - { name: H2_TRACING_EXPORT, value: {{ .Values.app.tracing.export | toString | quote }} }
            - { name: H2_TRACING_SAMPLING, value: {{ .Values.app.tracing.sampling | toString | quote }} }
            - { name: H2_OTLP_TRACES_ENDPOINT, value: {{ .Values.app.tracing.endpoint | quote }} }
            - { name: H2_MANAGEMENT_PORT, value: "8081" }
            - { name: H2_METRICS_PUBLIC, value: "true" }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 8081, name: management }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: {{ div (required "app.startupSeconds" .Values.app.startupSeconds) 5 }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: {{ int $shutdown.preStopSeconds }} }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: shell, mountPath: /shell, readOnly: true }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: shell, emptyDir: { sizeLimit: 1Mi } }]
{{- if and (not .Values.canary.only) (gt (int .Values.app.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helper2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  minAvailable: {{ sub (int .Values.app.replicas) 1 }}
  selector: { matchLabels: { app: helper2 } }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  selector: { app: {{ $name }} }
  ports: [{ port: 80, targetPort: http }]
