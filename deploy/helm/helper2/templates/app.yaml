# The public app (ADR 0069): search, guide, setup, the pages and sign-in for users. It serves no web files: the web
# image does (web.yaml). An init container copies the built shell (index.html) from the web image of the same tag;
# the app writes every page into it (ADR 0050). The back office is its own workload (backoffice.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helper2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  replicas: {{ required "app.replicas" .Values.app.replicas }}
  # One new pod at a time, and an old one goes only once the new one is ready: no capacity lost in a deploy.
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: helper2 } }
  template:
    metadata:
      labels: { app: helper2 }
      annotations:
        {{- with .Values.envSecret.revision }}
        # The chart cannot see the env Secret change: a new revision (a new app.env, e.g. a rotated
        # token) restarts the app. Postgres reads its password only at init.
        checksum/env-revision: {{ . | quote }}
        {{- end }}
        {{- if and .Values.redis.auth.enabled .Values.redis.auth.existingSecret }}
        # The Redis password from an existing Secret: a new redis.auth.revision restarts the app with Redis.
        checksum/redis-auth-revision: {{ include "helper2.redisAuthRevision" . }}
        {{- end }}
        # For a Prometheus-style scraper (allow its namespace with networkPolicy.metricsNamespace).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: helper2
      automountServiceAccountToken: false
      # No Docker-link style variables (REDIS_PORT=tcp://…) from the Services: the app reads only
      # its own H2_ variables.
      enableServiceLinks: false
      # Replicas on different nodes when the cluster can, so one node going down does not take them all.
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: helper2 } } }
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      {{- $shutdown := .Values.app.shutdown }}
      # preStop sleep + graceful drain + 5 s for the JVM to exit (values.yaml app.shutdown).
      terminationGracePeriodSeconds: {{ add (int (required "app.shutdown.preStopSeconds" $shutdown.preStopSeconds)) (int (required "app.shutdown.drainSeconds" $shutdown.drainSeconds)) 5 }}
      # The shell of the same version as the files helper2-web serves (helper2.webImage), into a read-only /shell.
      initContainers:
        - name: shell
          image: {{ include "helper2.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [cp, /usr/share/helper2/shell/index.html, /shell/index.html]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: shell, mountPath: /shell }]
      containers:
        - name: app
          image: {{ include "helper2.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: [{ secretRef: { name: {{ include "helper2.envSecret" . }} } }]
          env:
            - { name: H2_PROFILES, value: {{ .Values.app.springProfiles | quote }} }
            # spring.lifecycle.timeout-per-shutdown-phase: how long requests in flight get after SIGTERM.
            - { name: H2_SHUTDOWN_TIMEOUT, value: "{{ int $shutdown.drainSeconds }}s" }
            - { name: H2_DATABASE_URL, value: "jdbc:postgresql://postgres:5432/helper2" }
            # Its own role, never the owner (ADR 0070): rows only, no DDL. The migrate Job opens its login.
            - { name: H2_DATABASE_USER, value: h2_public }
            - name: H2_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PUBLIC_PASSWORD } }
            - { name: H2_REDIS_HOST, value: redis }
            {{- if .Values.redis.auth.enabled }}
            # Its own Redis ACL user (files/redis-users.acl): its keys and commands only.
            - { name: H2_REDIS_USER, value: h2_public }
            - name: H2_REDIS_PASSWORD
              valueFrom: { {{ include "helper2.redisPasswordFrom" (list . "H2_REDIS_PUBLIC_PASSWORD") }} }
            {{- else }}
            # No Redis auth: empty, so an H2_REDIS_PASSWORD left in the env Secret never reaches the app.
            - { name: H2_REDIS_PASSWORD, value: "" }
            {{- end }}
            # The running build: cached guide answers are kept per build, so a deploy is seen at once.
            - { name: H2_BUILD_VERSION, value: {{ .Values.image.tag | quote }} }
            - { name: H2_NOINDEX, value: {{ .Values.app.noindex | toString | quote }} }
            {{- with .Values.app.monetisation }}
            # Monetisation parts that are on (ADR 0057); an empty value stays off.
            {{- with .githubSponsorsUrl }}
            - { name: H2_SUPPORT_GITHUB_SPONSORS_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .stripePaymentUrl }}
            - { name: H2_SUPPORT_STRIPE_PAYMENT_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .ga4MeasurementId }}
            - { name: H2_ANALYTICS_GA4_MEASUREMENT_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .ethicalAdsPublisher }}
            - { name: H2_ADS_ETHICALADS_PUBLISHER, value: {{ . | quote }} }
            {{- end }}
            {{- with .adsenseClient }}
            - { name: H2_ADS_ADSENSE_CLIENT, value: {{ . | quote }} }
            {{- end }}
            {{- with .adsenseSlot }}
            - { name: H2_ADS_ADSENSE_SLOT, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- with .Values.app.publicBaseUrl }}
            # The host every canonical link and sitemap address names (ADR 0050).
            - { name: H2_PUBLIC_BASE_URL, value: {{ . | quote }} }
            {{- end }}
            {{- /* Daily limits: only the ones set in values, so an unset one keeps the app default or the env Secret. */}}
            {{- $limits := .Values.app.dailyLimits }}
            {{- range $name, $value := dict "H2_LIVE_WEB_GUEST_SEARCH" $limits.webSearches.search "H2_LIVE_WEB_GUEST_GUIDE" $limits.webSearches.guide "H2_GUIDE_CLIENT_DAILY_QUESTIONS" $limits.guideQuestions "H2_LIVE_WEB_DAILY_CREDITS" $limits.webSearchCredits "H2_GUIDE_DAILY_MODEL_CALLS" $limits.guideModelCalls }}
            {{- if not (kindIs "invalid" $value) }}
            - { name: {{ $name }}, value: {{ $value | toString | quote }} }
            {{- end }}
            {{- end }}
            {{- with .Values.app.guideCacheTtl }}
            - { name: H2_GUIDE_CACHE_TTL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.app.guideSimilarThreshold }}
            - { name: H2_GUIDE_SIMILAR_THRESHOLD, value: {{ . | toString | quote }} }
            {{- end }}
            # The Privacy page states how long a dump is kept (GET /api/v1/policy); the backup CronJob
            # deletes by the same number (backup.retentionDays).
            - { name: H2_RETENTION_BACKUPS, value: {{ printf "P%dD" (int .Values.backup.retentionDays) | quote }} }
            - { name: H2_COOKIE_SECURE, value: "true" }
            # Only the Ingress controller reaches this pod (NetworkPolicy); it sets X-Forwarded-For, and
            # Tomcat takes the right-most address that is not an internal proxy.
            - { name: H2_FORWARD_HEADERS_STRATEGY, value: native }
            - { name: H2_LOG_FORMAT, value: logstash }
            # Tag on every metric and span; spans go by OTLP/HTTP to app.tracing.endpoint when export is on.
            - { name: H2_ENVIRONMENT, value: {{ required "app.environment" .Values.app.environment | quote }} }
            - { name: H2_TRACING_EXPORT, value: {{ .Values.app.tracing.export | toString | quote }} }
            - { name: H2_TRACING_SAMPLING, value: {{ .Values.app.tracing.sampling | toString | quote }} }
            - { name: H2_OTLP_TRACES_ENDPOINT, value: {{ .Values.app.tracing.endpoint | quote }} }
            # Actuator on its own port: the Services (and so the edge) never route 8081, which keeps
            # the metrics that are open on 8081 off the public site.
            - { name: H2_MANAGEMENT_PORT, value: "8081" }
            - { name: H2_METRICS_PUBLIC, value: "true" }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 8081, name: management }
          # Startup checks the schema (waiting for the migrate Job) and loads the Lingua models: up to periodSeconds x
          # failureThreshold (app.startupSeconds) before the kubelet restarts the container. Liveness
          # and readiness only start once this has passed, so neither needs an initial delay.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: {{ div (required "app.startupSeconds" .Values.app.startupSeconds) 5 }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          # Serve on while the endpoints and the Ingress controller drop this pod; SIGTERM comes after.
          lifecycle:
            preStop:
              sleep: { seconds: {{ int $shutdown.preStopSeconds }} }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          # /shell/index.html: helper2.pages.template (H2_PAGES_TEMPLATE, default file:/shell/index.html).
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: shell, mountPath: /shell, readOnly: true }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: shell, emptyDir: { sizeLimit: 1Mi } }]
{{- if gt (int .Values.app.replicas) 1 }}
---
# Node drains and other voluntary evictions keep all replicas but one serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: helper2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  minAvailable: {{ sub (int .Values.app.replicas) 1 }}
  selector: { matchLabels: { app: helper2 } }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: helper2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  selector: { app: helper2 }
  ports: [{ port: 80, targetPort: http }]
