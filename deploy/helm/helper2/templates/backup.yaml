{{- if .Values.backup.enabled }}
{{- $offsite := .Values.backup.offsite }}
# Nightly logical backup: user data (bookmarks, reports, reviews) is not rebuildable by the Scout.
# Kept on its own PVC (ideally a storage class that outlives a node, e.g. NFS with Retain).
# Optionally copied off-site (backup.offsite). Restore: deploy/k8s/README.md, "Backups".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
  annotations:
    # Never delete the dumps with the release.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.backup.storage }} } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata: { labels: { app: pg-backup } }
        spec:
          restartPolicy: OnFailure
          serviceAccountName: helper2
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
          {{- /* With an off-site copy the dump runs first, as an init container, and the upload after it. */}}
          {{- if $offsite.enabled }}
          initContainers:
          {{- else }}
          containers:
          {{- end }}
            - name: dump
              image: {{ include "helper2.postgresImage" . }}
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: helper2 }
                - { name: PGDATABASE, value: helper2 }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: helper2-env, key: H2_DATABASE_PASSWORD } }
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  f=/backup/helper2-$(date +%Y-%m-%d).sql.gz
                  pg_dump --no-owner | gzip > "$f.tmp" && mv "$f.tmp" "$f"
                  find /backup -name 'helper2-*.sql.gz' -mtime +{{ .Values.backup.retentionDays }} -delete
                  ls -l /backup
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          {{- if $offsite.enabled }}
          containers:
            - name: upload
              image: {{ $offsite.image }}
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG_OFFSITE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_OFFSITE_PROVIDER, value: Cloudflare }
                - { name: RCLONE_CONFIG_OFFSITE_ENDPOINT, value: {{ required "backup.offsite.endpoint" $offsite.endpoint | quote }} }
                # The token is scoped to the bucket: it may not check or create buckets.
                - { name: RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: {{ $offsite.secret }}, key: access_key_id } }
                - name: RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: {{ $offsite.secret }}, key: secret_access_key } }
              args:
                - copy
                - /backup
                - offsite:{{ required "backup.offsite.bucket" $offsite.bucket }}/{{ $offsite.prefix }}
                - --include=helper2-*.sql.gz
                - --verbose
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: backup, mountPath: /backup, readOnly: true }, { name: tmp, mountPath: /tmp }]
          {{- end }}
          volumes:
            - { name: backup, persistentVolumeClaim: { claimName: pg-backup } }
            {{- if $offsite.enabled }}
            - { name: tmp, emptyDir: {} }
            {{- end }}
{{- end }}
