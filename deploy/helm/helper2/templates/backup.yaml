{{- if not .Values.canary.only }}
{{- if .Values.backup.enabled }}
{{- $offsite := .Values.backup.offsite }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.backup.storage }} } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata: { labels: { app: pg-backup } }
        spec:
          restartPolicy: OnFailure
          serviceAccountName: helper2
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
          {{- if $offsite.enabled }}
          initContainers:
          {{- else }}
          containers:
          {{- end }}
            - name: dump
              image: {{ include "helper2.postgresImage" . }}
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: helper2 }
                - { name: PGDATABASE, value: helper2 }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PASSWORD } }
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -o pipefail
                  f=/backup/helper2-$(date +%Y-%m-%d).sql.gz
                  trap 'rm -f "$f.tmp"' EXIT
                  pg_dump --no-owner | gzip > "$f.tmp"
                  gzip -t "$f.tmp"
                  [ "$(wc -c < "$f.tmp")" -gt 1024 ]
                  mv "$f.tmp" "$f"
                  ls -1 /backup/helper2-*.sql.gz | sort -r | tail -n +{{ add1 .Values.backup.retentionDays }} | xargs -r rm -f
                  ls -l /backup
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          {{- if $offsite.enabled }}
          containers:
            - name: upload
              image: {{ $offsite.image }}
              env:
                - { name: HOME, value: /tmp }
                {{- include "helper2.offsiteEnv" . | nindent 16 }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  RCLONE_CONFIG_SEALED_PASSWORD=$(printf %s "$CRYPT_PASSWORD" | rclone obscure -)
                  export RCLONE_CONFIG_SEALED_PASSWORD
                  exec rclone copy /backup sealed: --include='helper2-*.sql.gz' --max-age={{ $offsite.maxAge }} --verbose
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: backup, mountPath: /backup, readOnly: true }, { name: tmp, mountPath: /tmp }]
          {{- end }}
          volumes:
            - { name: backup, persistentVolumeClaim: { claimName: pg-backup } }
            {{- if $offsite.enabled }}
            - { name: tmp, emptyDir: {} }
            {{- end }}
{{- with .Values.backup.restoreCheck }}
{{- if .enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-restore-check
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: {{ $.Values.backup.timeZone }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata: { labels: { app: pg-restore-check } }
        spec:
          restartPolicy: Never
          serviceAccountName: helper2
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
          {{- if $offsite.enabled }}
          initContainers:
            - name: fetch
              image: {{ $offsite.image }}
              env:
                - { name: HOME, value: /tmp }
                {{- include "helper2.offsiteEnv" $ | nindent 16 }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  RCLONE_CONFIG_SEALED_PASSWORD=$(printf %s "$CRYPT_PASSWORD" | rclone obscure -)
                  export RCLONE_CONFIG_SEALED_PASSWORD
                  f=$(rclone lsf sealed: --include='helper2-*.sql.gz' | sort | tail -n 1)
                  [ -n "$f" ] || { echo "no dump off-site"; exit 1; }
                  mkdir -p /work/dumps
                  rclone copyto "sealed:$f" "/work/dumps/$f"
                  echo "fetched $f"
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: work, mountPath: /work }, { name: tmp, mountPath: /tmp }]
          {{- end }}
          containers:
            - name: check
              image: {{ include "helper2.postgresImage" $ }}
              env:
                - { name: DUMPS, value: {{ ternary "/work/dumps" "/backup" $offsite.enabled }} }
                - { name: PGDATA, value: /work/pgdata }
                - { name: PGHOST, value: /work }
                - { name: PGUSER, value: helper2 }
                - { name: PGDATABASE, value: helper2 }
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -o pipefail
                  f=$(ls -1 "$DUMPS"/helper2-*.sql.gz | sort | tail -n 1)
                  echo "restoring $f"
                  initdb --username=helper2 --auth=trust --encoding=UTF8 --locale=C --no-sync > /dev/null
                  pg_ctl -w -l /work/postgres.log \
                    -o "-c listen_addresses= -c unix_socket_directories=/work -c fsync=off -c full_page_writes=off" start > /dev/null
                  createdb helper2
                  for r in h2_public h2_backoffice; do psql -q -c "CREATE ROLE $r NOLOGIN"; done
                  start=$(date +%s)
                  gunzip -c "$f" | psql -v ON_ERROR_STOP=1 -q > /dev/null
                  echo "restored in $(( $(date +%s) - start ))s"
                  failed=$(psql -Atc 'select count(*) from flyway_schema_history where not success')
                  [ "$failed" -eq 0 ] || { echo "$failed migration(s) not successful"; exit 1; }
                  for t in flyway_schema_history source resource; do
                    n=$(psql -Atc "select count(*) from $t")
                    echo "$t: $n rows"
                    [ "$n" -gt 0 ] || { echo "$t is empty"; exit 1; }
                  done
                  pg_ctl -m fast stop > /dev/null
              {{- with .resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts:
                - { name: work, mountPath: /work }
                {{- if not $offsite.enabled }}
                - { name: backup, mountPath: /backup, readOnly: true }
                {{- end }}
          volumes:
            - { name: work, emptyDir: { sizeLimit: {{ .scratch }} } }
            {{- if $offsite.enabled }}
            - { name: tmp, emptyDir: {} }
            {{- else }}
            - { name: backup, persistentVolumeClaim: { claimName: pg-backup } }
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
