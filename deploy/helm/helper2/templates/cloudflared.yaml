{{- if .Values.cloudflared.enabled }}
# Optional edge: a remotely-managed Cloudflare tunnel routing the public hostnames ->
# http://helper2.<namespace>.svc.cluster.local:80. The token Secret is created outside the chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image }}
          # http2, not QUIC: works behind firewalls that drop outbound UDP. Token via env, never in
          # argv; remote management off; the metrics listener stays up for the probes.
          args: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "0.0.0.0:2000",
                 "--management-diagnostics=false", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.cloudflared.tokenSecret }}, key: token } }
          # /ready is 503 until at least one edge connection is up.
          readinessProbe: { httpGet: { path: /ready, port: 2000 }, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /ready, port: 2000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
{{- end }}
