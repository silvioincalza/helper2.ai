{{- $migrate := .Values.migrate }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "helper2.migrateName" . }}-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ $migrate.backoffLimit }}
  activeDeadlineSeconds: {{ $migrate.deadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: {{ include "helper2.migrateName" . }} }
    spec:
      restartPolicy: Never
      serviceAccountName: helper2
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ include "helper2.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          env:
            - { name: H2_DATABASE_URL, value: "jdbc:postgresql://postgres:5432/helper2" }
            - { name: H2_DATABASE_USER, value: helper2 }
            - name: H2_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PASSWORD } }
            - name: H2_DATABASE_PUBLIC_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PUBLIC_PASSWORD } }
            - name: H2_DATABASE_BACKOFFICE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_BACKOFFICE_PASSWORD } }
            - { name: H2_LOG_FORMAT, value: logstash }
          resources:
            {{- toYaml $migrate.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helper2.canaryPrefix" . }}ingress-postgres-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: {{ include "helper2.migrateName" . }} } } }]
      ports: [{ port: 5432, protocol: TCP }]
{{- with .Values.networkPolicy.egress }}
{{- if .enabled }}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .dns.namespace)) "podSelector" (dict "matchLabels" .dns.podLabels))) "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helper2.canaryPrefix" $ }}egress-migrate
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: {{ include "helper2.migrateName" $ }} } }
  policyTypes: [Egress]
  egress:
    - {{ toJson $dns }}
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ port: 5432, protocol: TCP }]
{{- end }}
{{- end }}
