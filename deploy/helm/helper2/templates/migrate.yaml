# The migrate step (ADR 0070): Flyway migrates as the owner, then the apps' roles get their login and
# password, and the Job ends. The only workload with the owner's password; both apps connect as their own
# role and only check the schema, waiting (helper2.schema.wait-for) while this Job runs. A plain Job, not a
# Helm hook: a pre-install hook would run before Postgres exists, and on the first upgrade its NetworkPolicy
# would not be there yet. One Job per release revision (the template of a Job cannot change), so a rollback
# runs the older image's step, which finds nothing to do. `make deploy` waits for it (--wait-for-jobs).
{{- $migrate := .Values.migrate }}
apiVersion: batch/v1
kind: Job
metadata:
  name: helper2-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ $migrate.backoffLimit }}
  activeDeadlineSeconds: {{ $migrate.deadlineSeconds }}
  # Kept a day for its logs; the next release replaces it anyway.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: helper2-migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: helper2
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ include "helper2.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The public image's migrate step (MigrateStep): no web server, no Redis, no scheduler.
          args: [migrate]
          # Only the keys the step reads, never a whole Secret.
          env:
            - { name: H2_DATABASE_URL, value: "jdbc:postgresql://postgres:5432/helper2" }
            - { name: H2_DATABASE_USER, value: helper2 }
            - name: H2_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PASSWORD } }
            - name: H2_DATABASE_PUBLIC_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PUBLIC_PASSWORD } }
            - name: H2_DATABASE_BACKOFFICE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_BACKOFFICE_PASSWORD } }
            - { name: H2_LOG_FORMAT, value: logstash }
          resources:
            {{- toYaml $migrate.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
# Postgres <- the migrate Job (NetworkPolicies add up: this one next to ingress-postgres).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-postgres-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: helper2-migrate } } }]
      ports: [{ port: 5432, protocol: TCP }]
{{- with .Values.networkPolicy.egress }}
{{- if .enabled }}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .dns.namespace)) "podSelector" (dict "matchLabels" .dns.podLabels))) "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
---
# The migrate Job -> DNS and Postgres, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-migrate
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: helper2-migrate } }
  policyTypes: [Egress]
  egress:
    - {{ toJson $dns }}
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ port: 5432, protocol: TCP }]
{{- end }}
{{- end }}
