{{- if not .Values.canary.only }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range $name, $app := dict "ingress-app" "helper2" "ingress-backoffice" "helper2-backoffice" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: {{ $app }} } }
  policyTypes: [Ingress]
  {{- with $.Values.networkPolicy }}
  {{- if or .ingressController.namespace .metricsNamespace }}
  ingress:
    {{- with .ingressController.namespace }}
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
          {{- with $.Values.networkPolicy.ingressController.podLabels }}
          podSelector: { matchLabels: {{ toJson . }} }
          {{- end }}
      ports: [{ port: 8080, protocol: TCP }]
    {{- end }}
    {{- with .metricsNamespace }}
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } } }]
      ports: [{ port: 8081, protocol: TCP }]
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: helper2-web } }
  policyTypes: [Ingress]
  {{- with .Values.networkPolicy.ingressController }}
  {{- if .namespace }}
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .namespace }} } }
          {{- with .podLabels }}
          podSelector: { matchLabels: {{ toJson . }} }
          {{- end }}
      ports: [{ port: 8080, protocol: TCP }]
  {{- end }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: helper2 } }
        - podSelector: { matchLabels: { app: helper2-backoffice } }
        {{- if .Values.backup.enabled }}
        - podSelector: { matchLabels: { app: pg-backup } }
        {{- end }}
      ports: [{ port: 5432, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: helper2 } }
        - podSelector: { matchLabels: { app: helper2-backoffice } }
      ports: [{ port: 6379, protocol: TCP }]
{{- with .Values.networkPolicy.egress }}
{{- if .enabled }}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .dns.namespace)) "podSelector" (dict "matchLabels" .dns.podLabels))) "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
{{- $internet := dict "ipBlock" (dict "cidr" .external.cidr "except" .external.except) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-default-deny
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-app
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [helper2, helper2-backoffice] }]
  policyTypes: [Egress]
  egress:
    - {{ toJson $dns }}
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ port: 5432, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ port: 6379, protocol: TCP }]
    {{- if .otlp.namespace }}
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .otlp.namespace }} } } }]
      ports: [{ port: {{ .otlp.port }}, protocol: TCP }]
    {{- end }}
    - to: [{{ toJson $internet }}]
      ports:
        {{- range .external.appPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
{{- if $.Values.backup.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-backup
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "helper2.labels" $ | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: pg-backup } }
  policyTypes: [Egress]
  egress:
    - {{ toJson $dns }}
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ port: 5432, protocol: TCP }]
    {{- if $.Values.backup.offsite.enabled }}
    - to: [{{ toJson $internet }}]
      ports: [{ port: 443, protocol: TCP }]
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
