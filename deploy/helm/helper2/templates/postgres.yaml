# Small single-instance Postgres. Staging data is rebuildable: the Scout re-indexes the sources.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
      {{- if .Values.postgres.exporter.enabled }}
      annotations:
        # For a Prometheus-style scraper: the exporter sidecar (allow its namespace with networkPolicy.metricsNamespace).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: helper2
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ include "helper2.postgresImage" . }}
          env:
            - { name: POSTGRES_DB, value: helper2 }
            - { name: POSTGRES_USER, value: helper2 }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: helper2-env, key: H2_DATABASE_PASSWORD } }
          ports: [{ containerPort: 5432, name: pg }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "helper2", "-d", "helper2"] }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
        {{- if .Values.postgres.exporter.enabled }}
        # Logs in as helper2 over localhost (owner decision; a pg_monitor role is on the roadmap). Default
        # collectors only: pg_stat_statements stays off.
        - name: postgres-exporter
          image: {{ .Values.postgres.exporter.image }}
          env:
            - { name: DATA_SOURCE_URI, value: "localhost:5432/helper2?sslmode=disable" }
            - { name: DATA_SOURCE_USER, value: helper2 }
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: helper2-env, key: H2_DATABASE_PASSWORD } }
          ports: [{ containerPort: 9187, name: pg-metrics }]
          resources:
            {{- toYaml .Values.postgres.exporter.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        {{- end }}
  # Immutable after creation: must render exactly what the live StatefulSet has.
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: pg }]
