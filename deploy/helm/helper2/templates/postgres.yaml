# Small single-instance Postgres. Staging data is rebuildable: the Scout re-indexes the sources.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      serviceAccountName: helper2
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ include "helper2.postgresImage" . }}
          env:
            - { name: POSTGRES_DB, value: helper2 }
            - { name: POSTGRES_USER, value: helper2 }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "helper2.credentialsSecret" . }}, key: H2_DATABASE_PASSWORD } }
          ports: [{ containerPort: 5432, name: pg }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "helper2", "-d", "helper2"] }
            periodSeconds: 5
          # pg_isready also fails (exit 1) while the server is up but still replaying its log after a crash,
          # so recovery gets up to 10 min (120 x 5 s) before the liveness probe counts: a liveness
          # restart during recovery would start the recovery over, every time.
          startupProbe:
            exec: { command: ["pg_isready", "-U", "helper2", "-d", "helper2"] }
            periodSeconds: 5
            failureThreshold: 120
          # Then two minutes without an answer (6 x 20 s) restarts a hung server.
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "helper2", "-d", "helper2"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
  # Immutable after creation: must render exactly what the live StatefulSet has.
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: pg }]
