{{- if not .Values.canary.only }}
{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: helper2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $rules := .Files.Get "files/helper2-rules.yaml" | fromYaml }}
  {{- if not $rules.groups }}
  {{- fail "files/helper2-rules.yaml (deploy/monitoring/helper2-rules.yaml) has no rule groups" }}
  {{- end }}
  {{- toYaml $rules | nindent 2 }}
{{- end }}
{{- end }}
