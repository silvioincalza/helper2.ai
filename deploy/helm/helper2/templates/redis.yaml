# Cache with AOF persistence (ADR 0005): a restart comes back warm; PostgreSQL stays the system of
# record, so losing the volume costs only cache misses. StatefulSet: at most one pod ever holds the
# ReadWriteOnce volume, like Postgres.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis }
      {{- if .Values.redis.auth.enabled }}
      annotations:
        {{- if .Values.redis.auth.existingSecret }}
        # Redis reads its password at start only. The chart cannot see the existing Secret change: a new
        # redis.auth.revision restarts Redis (with the app).
        checksum/redis-auth-revision: {{ include "helper2.redisAuthRevision" . }}
        {{- else if .Values.envSecret.redisPasswordRevision }}
        # Redis reads its password at start only: a new one in app.env restarts it (with the app).
        checksum/auth: {{ .Values.envSecret.redisPasswordRevision | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: helper2
      automountServiceAccountToken: false
      # fsGroup: the volume is writable by the redis user.
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # AOF only (no RDB snapshots), fsync every second; still a bounded LRU cache. requirepass and the
          # apps' ACL users come in as config on stdin (`redis-server -`), not in argv; REDISCLI_AUTH also
          # lets the probe's redis-cli authenticate.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if .Values.redis.auth.enabled }}
              # The passwords land unquoted in the config (requirepass, the ACL lines): refuse an empty one or one with
              # anything but letters and digits. check-app-env.sh checks app.env; this also covers redis.auth.existingSecret.
              for v in "$REDISCLI_AUTH"
              {{- range $line := splitList "\n" ($.Files.Get "files/redis-users.acl") }}
              {{- $line = trim $line }}
              {{- if and $line (not (hasPrefix "#" $line)) }} "${{ include "helper2.redisUserPasswordKey" (first (splitList " " $line)) }}"{{ end }}
              {{- end }}; do
                case $v in ''|*[!A-Za-z0-9]*) echo "a Redis password is empty or has characters other than letters and digits" >&2; exit 1;; esac
              done
              {{- end }}
              exec redis-server - --dir /data --save "" --appendonly yes --appendfsync everysec --maxmemory {{ .Values.redis.maxMemory }} --maxmemory-policy allkeys-lru <<EOF
              {{- if .Values.redis.auth.enabled }}
              requirepass $REDISCLI_AUTH
              {{- range $line := splitList "\n" ($.Files.Get "files/redis-users.acl") }}
              {{- $line = trim $line }}
              {{- if and $line (not (hasPrefix "#" $line)) }}
              {{- $user := splitn " " 2 $line }}
              user {{ $user._0 }} on >${{ include "helper2.redisUserPasswordKey" $user._0 }} {{ $user._1 }}
              {{- end }}
              {{- end }}
              {{- end }}
              EOF
          {{- if .Values.redis.auth.enabled }}
          env:
            # The default user: the admin (probes, redis-cli). The apps connect as their own ACL users
            # (files/redis-users.acl, ADR 0070).
            - name: REDISCLI_AUTH
              valueFrom: { {{ include "helper2.redisPasswordFrom" (list . "H2_REDIS_PASSWORD") }} }
            {{- range $line := splitList "\n" ($.Files.Get "files/redis-users.acl") }}
            {{- $line = trim $line }}
            {{- if and $line (not (hasPrefix "#" $line)) }}
            {{- $key := include "helper2.redisUserPasswordKey" (first (splitList " " $line)) }}
            - name: {{ $key }}
              valueFrom: { {{ include "helper2.redisPasswordFrom" (list $ $key) }} }
            {{- end }}
            {{- end }}
          {{- end }}
          ports: [{ containerPort: 6379, name: redis }]
          # Not ready while the AOF loads (PING answers LOADING).
          readinessProbe: { exec: { command: ["sh", "-c", "redis-cli ping | grep -qx PONG"] }, periodSeconds: 5 }
          # Alive while it answers at all, LOADING included; two minutes of silence (6 x 20 s) restarts it.
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping | grep -qE 'PONG|LOADING'"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  # Immutable after creation: a new size or storage class needs a new StatefulSet (the cache refills).
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: redis }]
