# The identity of every pod in the chart. No Role is bound to it and no pod mounts its token: the
# workloads never call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helper2
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helper2.labels" . | nindent 4 }}
automountServiceAccountToken: false
