# helper2 prod - https://helper2.ai (www redirects to the apex; namespace helper2-prod).  make ENV=prod deploy
# Hosted platform settings (same in staging and prod).
image:
  repository: harbor-i.infra.incalza.me/helper2/apps/helper2
postgres:
  image:
    repository: harbor-i.infra.incalza.me/helper2/apps/postgres
  storageClassName: local-path
redis:
  storageClassName: local-path
networkPolicy:
  # The platform's ingress-nginx serves the Ingresses (incalza-me-infra terraform/k8s/helper2.tf): public host ->
  # Service helper2, in-network admin host -> Service helper2-admin, the back office (ADR 0035, 0069).
  ingressController:
    namespace: ingress-nginx
    podLabels: { app.kubernetes.io/name: ingress-nginx }
  metricsNamespace: observability
  egress:
    otlp:
      namespace: observability
app:
  # Sign-in (ADR 0023/0035): GitHub App helper2-prod. H2_GITHUB_OAUTH_CLIENT_ID, H2_GITHUB_OAUTH_CLIENT_SECRET and
  # H2_ADMINS are in app_env; without them the app does not start.
  springProfiles: llm-nebius,oauth-github
  # Reuse a cached answer for a near-identical guide question (ADR 0041, measured on the evaluation set).
  guideSimilarThreshold: 0.96
  tracing:
    export: true
    endpoint: http://alloy.observability.svc:4318/v1/traces
  environment: prod
  # Google AdSense (ADR 0059): the site check tag and /ads.txt on helper2.ai. Not a secret: every page shows it.
  monetisation:
    adsenseClient: ca-pub-4688630163076563
  replicas: 3
  # Tavily plan: 14,000 credits a month, shared by prod, staging and the Scout. In a 31-day month: prod live calls
  # 250 a day (7,750) + staging at most 150 a day (4,650) + the Scout (~420 with 5 discovery passes) + the weekly
  # live check (~13) ≈ 12,830, about 1,150 under 14,000. Past the cap Tavily is SKIPPED and searches answer from stored results and the other sources.
  dailyLimits:
    webSearchCredits: "250"
backoffice:
  image:
    repository: harbor-i.infra.incalza.me/helper2/apps/helper2-backoffice
  # Scout: one run a day at 03:07 UTC (the first start runs at once), up to 200 resources enriched per run.
  scoutCron: "0 7 3 * * *"
backup:
  # User data (bookmarks, reports, reviews) is not rebuildable by the Scout.
  enabled: true
  timeZone: Europe/Zurich
  storageClassName: nfs-k8s
