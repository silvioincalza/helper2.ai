rule_files:
  - ../searchavo-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="searchavo", environment="prod", uri="/api/v1/search", status="200"}'
        values: '0+108x30'
      - series: 'http_server_requests_seconds_count{application="searchavo", environment="prod", uri="/api/v1/search", status="500"}'
        values: '0+12x30'
      - series: 'http_server_requests_seconds_count{application="searchavo", environment="prod", uri="/actuator/health", status="503"}'
        values: '0+600x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: SearchavoHighServerErrorRatio
        exp_alerts: []
      - eval_time: 20m
        alertname: SearchavoHighServerErrorRatio
        exp_alerts:
          - exp_labels:
              severity: critical
              environment: prod
            exp_annotations:
              summary: "More than 5% of requests to searchavo (prod) fail with a 5xx status."
              description: "10% of the requests of the last 5 minutes ended with a server error, for 10 minutes."
              runbook: "Dashboard row 'HTTP (app port)' (Requests by status, p95 by route), then row Logs filtered on ERROR. 503 on the guide = all slots busy, 504 = question deadline; other 5xx: check Postgres and Redis pods and the last deploy (make ENV=<env> rollback)."

  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="searchavo", environment="prod", uri="/api/v1/search", status="500"}'
        values: '0 1x29'
    alert_rule_test:
      - eval_time: 20m
        alertname: SearchavoHighServerErrorRatio
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'searchavo_guide_budget_remaining{application="searchavo", environment="prod", instance="a"}'
        values: '600 600 500 300 100 100 100'
      - series: 'searchavo_guide_budget_remaining{application="searchavo", environment="prod", instance="b"}'
        values: '600 600 500 300 110 110 110'
      - series: 'searchavo_search_translation_budget_remaining{application="searchavo", environment="prod", instance="a"}'
        values: '300 300 200 150 150 150 150'
    alert_rule_test:
      - eval_time: 15m
        alertname: SearchavoDailyBudgetLow
        exp_alerts: []
      - eval_time: 25m
        alertname: SearchavoDailyBudgetLow
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              budget: guide
            exp_annotations:
              summary: "Daily budget guide is below 20% (prod)."
              description: "Only 16.67% of today's model calls are left. When it reaches 0 the feature degrades until 00:00 UTC (guide: search-only answers; setup guide: no answer; translation: query sent as typed)."
              runbook: "Dashboard searchavo, panels 'Questions by outcome' and 'Daily budget remaining' (AI guide): normal traffic or one loop/abuser? Caps: SA_GUIDE_DAILY_MODEL_CALLS (guide), SA_SEARCH_DAILY_TRANSLATIONS (search_translation), SA_SETUP_GUIDE_DAILY_MODEL_CALLS (tool_guide)."

  - interval: 5m
    input_series:
      - series: 'searchavo_scout_enrichment_budget_remaining{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '300 300 0 0 0 0 0 0'
      - series: 'searchavo_scout_evidence_credits_remaining{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '20 20 20 3 3 3 3 3'
      - series: 'searchavo_scout_classifier_budget_remaining{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '100 100 90 90 90 90 90 90'
      - series: 'searchavo_search_translation_budget_remaining{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '300 300 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 30m
        alertname: SearchavoDailyBudgetLow
        exp_alerts: []
      - eval_time: 17m
        alertname: SearchavoBackofficeBudgetLow
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              budget: scout_enrichment
            exp_annotations:
              summary: "Back office budget scout_enrichment is below 20% (prod)."
              description: "Only 0% of today's scout_enrichment is left. At 0 the step waits until 00:00 UTC: enrichment, gap rounds, the classifier and the event reader skip their model call, example drafts stop, the evidence step reads no page. The backlog waits for the next day."
              runbook: "Dashboard searchavo-backoffice, row 'Enrichment and budgets': a large backlog after a fresh database spends the caps for days, as planned; a sudden drop on a normal day is a loop. Caps (back office Settings page or SA_): scout.dailyEnrichmentCalls (SA_SCOUT_DAILY_ENRICHMENT_CALLS), scout.gapDailyCalls (SA_SCOUT_GAP_DAILY_CALLS), SA_SCOUT_AWESOME_CLASSIFIER_DAILY_CALLS, SA_SCOUT_PAGE_READER_DAILY_CREDITS."
      - eval_time: 30m
        alertname: SearchavoBackofficeBudgetLow
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              budget: scout_enrichment
            exp_annotations:
              summary: "Back office budget scout_enrichment is below 20% (prod)."
              description: "Only 0% of today's scout_enrichment is left. At 0 the step waits until 00:00 UTC: enrichment, gap rounds, the classifier and the event reader skip their model call, example drafts stop, the evidence step reads no page. The backlog waits for the next day."
              runbook: "Dashboard searchavo-backoffice, row 'Enrichment and budgets': a large backlog after a fresh database spends the caps for days, as planned; a sudden drop on a normal day is a loop. Caps (back office Settings page or SA_): scout.dailyEnrichmentCalls (SA_SCOUT_DAILY_ENRICHMENT_CALLS), scout.gapDailyCalls (SA_SCOUT_GAP_DAILY_CALLS), SA_SCOUT_AWESOME_CLASSIFIER_DAILY_CALLS, SA_SCOUT_PAGE_READER_DAILY_CREDITS."
          - exp_labels:
              severity: warning
              environment: prod
              budget: scout_evidence_credits
            exp_annotations:
              summary: "Back office budget scout_evidence_credits is below 20% (prod)."
              description: "Only 15% of today's scout_evidence_credits is left. At 0 the step waits until 00:00 UTC: enrichment, gap rounds, the classifier and the event reader skip their model call, example drafts stop, the evidence step reads no page. The backlog waits for the next day."
              runbook: "Dashboard searchavo-backoffice, row 'Enrichment and budgets': a large backlog after a fresh database spends the caps for days, as planned; a sudden drop on a normal day is a loop. Caps (back office Settings page or SA_): scout.dailyEnrichmentCalls (SA_SCOUT_DAILY_ENRICHMENT_CALLS), scout.gapDailyCalls (SA_SCOUT_GAP_DAILY_CALLS), SA_SCOUT_AWESOME_CLASSIFIER_DAILY_CALLS, SA_SCOUT_PAGE_READER_DAILY_CREDITS."

  - interval: 1h
    input_series:
      - series: 'searchavo_live_web_credits_total{application="searchavo", environment="prod", instance="a", feature="search"}'
        values: '0+50x30'
      - series: 'searchavo_live_web_credits_total{application="searchavo", environment="prod", instance="b", feature="guide"}'
        values: '0+40x30'
      - series: 'searchavo_live_web_credits_total{application="searchavo-backoffice", environment="prod", instance="c", feature="scout-discovery"}'
        values: '0+20x30'
      - series: 'searchavo_live_web_credits_total{application="searchavo", environment="staging", instance="a", feature="search"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 12h
        alertname: SearchavoLiveWebCreditsHigh
        exp_alerts: []
      - eval_time: 25h
        alertname: SearchavoLiveWebCreditsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "Tavily used more than 2,500 credits in the last 24 hours (prod)."
              description: "2.64k Tavily credits (live calls and the Scout's discovery, news, courses, LinkedIn, events and evidence reads) in the last 24 hours. Prod's cap for all live calls is 3,000 a day: at the cap the live web stops for visitors until 00:00 UTC. At this pace the monthly credits also run out before the plan resets; then Tavily fails for everyone and searches answer from stored results and the other sources."
              runbook: "Dashboard: searchavo_live_web_credits_total by feature (every scout-* feature is the Scout, on the searchavo-backoffice dashboard). Many addresses at the limit = rotating IPs: lower the live web credits a day on the back office Settings page, or set SA_LIVE_WEB_DAILY_CREDITS (no release). A Scout that reads much: lower its search and page-read credits on the same page. Few stored-set hits (searchavo_cache_events_total, event=store_hit): check the freshness settings."

  - interval: 1h
    input_series:
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="hf-trending"}'
        values: '3600x96'
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="live-web-scout"}'
        values: '3600x96'
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="mcp-registry"}'
        values: '0+3600x96'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="hf-trending"}'
        values: '86400x96'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="live-web-scout"}'
        values: '432000x96'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="mcp-registry"}'
        values: '3600x96'
    alert_rule_test:
      - eval_time: 49h
        alertname: SearchavoScoutCollectorStale
        exp_alerts: []
      - eval_time: 73h
        alertname: SearchavoScoutCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              source: hf-trending
            exp_annotations:
              summary: "Scout collector hf-trending: no successful run for 3d 0h 0m 0s (prod)."
              description: "The catalog misses new resources from hf-trending since its last successful run: one day more than its run interval (at least one day, the daily Scout run) has passed."
              runbook: "Dashboard searchavo-backoffice, row Scout, 'Run failures by error'; the admin back office lists the runs. searchavo_scout_interval_seconds gives each collector's interval (SA_SCOUT_*_INTERVAL). A collector disabled on purpose keeps firing until its last value is 9 days old."

  - interval: 1h
    input_series:
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="discovery-coding"}'
        values: '3600x220'
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="discovery-legal"}'
        values: '3600x220'
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="discovery-writing"}'
        values: '0+3600x220'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="discovery-coding"}'
        values: '604800x220'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="discovery-legal"}'
        values: '604800x220'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="discovery-writing"}'
        values: '604800x220'
    alert_rule_test:
      - eval_time: 193h
        alertname: SearchavoDiscoveryStale
        exp_alerts: []
      - eval_time: 200h
        alertname: SearchavoScoutCollectorStale
        exp_alerts: []
      - eval_time: 200h
        alertname: SearchavoDiscoveryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "2 discovery categories: no successful run for one day more than their run interval (prod)."
              description: "No new products or list articles from: discovery-coding discovery-legal "
              runbook: "Admin back office, Scout runs: the message of each category's last run (a Tavily error, the daily credit cap of the Scout, or not due). Run now on one category to check. A category disabled on purpose keeps firing until its last value is 9 days old."

  - interval: 1h
    input_series:
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="linkedin-scout"}'
        values: '3600x220'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="linkedin-scout"}'
        values: '604800x220'
    alert_rule_test:
      - eval_time: 73h
        alertname: SearchavoScoutCollectorStale
        exp_alerts: []
      - eval_time: 200h
        alertname: SearchavoDiscoveryStale
        exp_alerts: []
      - eval_time: 200h
        alertname: SearchavoScoutCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              source: linkedin-scout
            exp_annotations:
              summary: "Scout collector linkedin-scout: no successful run for 8d 7h 0m 0s (prod)."
              description: "The catalog misses new resources from linkedin-scout since its last successful run: one day more than its run interval (at least one day, the daily Scout run) has passed."
              runbook: "Dashboard searchavo-backoffice, row Scout, 'Run failures by error'; the admin back office lists the runs. searchavo_scout_interval_seconds gives each collector's interval (SA_SCOUT_*_INTERVAL). A collector disabled on purpose keeps firing until its last value is 9 days old."

  - interval: 1h
    input_series:
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="hf-trending", instance="old"}'
        values: '3600x10'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="hf-trending", instance="new"}'
        values: '86400x60'
    alert_rule_test:
      - eval_time: 50h
        alertname: SearchavoScoutCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              source: hf-trending
            exp_annotations:
              summary: "Scout collector hf-trending: no successful run for 2d 1h 0m 0s (prod)."
              description: "The catalog misses new resources from hf-trending since its last successful run: one day more than its run interval (at least one day, the daily Scout run) has passed."
              runbook: "Dashboard searchavo-backoffice, row Scout, 'Run failures by error'; the admin back office lists the runs. searchavo_scout_interval_seconds gives each collector's interval (SA_SCOUT_*_INTERVAL). A collector disabled on purpose keeps firing until its last value is 9 days old."

  - interval: 1h
    input_series:
      - series: 'searchavo_scout_last_success{application="searchavo-backoffice", environment="prod", source="github-topic-leaders"}'
        values: '3600x220'
      - series: 'searchavo_scout_interval_seconds{application="searchavo-backoffice", environment="prod", source="github-topic-leaders"}'
        values: '604800x220'
    alert_rule_test:
      - eval_time: 73h
        alertname: SearchavoScoutCollectorStale
        exp_alerts: []
      - eval_time: 193h
        alertname: SearchavoScoutCollectorStale
        exp_alerts: []
      - eval_time: 200h
        alertname: SearchavoScoutCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              source: github-topic-leaders
            exp_annotations:
              summary: "Scout collector github-topic-leaders: no successful run for 8d 7h 0m 0s (prod)."
              description: "The catalog misses new resources from github-topic-leaders since its last successful run: one day more than its run interval (at least one day, the daily Scout run) has passed."
              runbook: "Dashboard searchavo-backoffice, row Scout, 'Run failures by error'; the admin back office lists the runs. searchavo_scout_interval_seconds gives each collector's interval (SA_SCOUT_*_INTERVAL). A collector disabled on purpose keeps firing until its last value is 9 days old."

  - interval: 1h
    input_series:
      - series: 'searchavo_guide_picks_total{application="searchavo", environment="prod", rank="1-3"}'
        values: '0+1x8 8x16'
      - series: 'searchavo_guide_picks_total{application="searchavo", environment="prod", rank="9+"}'
        values: '0x6 1 2x7 4x4 8x5'
      - series: 'searchavo_guide_picks_total{application="searchavo", environment="staging", rank="9+"}'
        values: '0 1 2x22'
    alert_rule_test:
      - eval_time: 10h
        alertname: SearchavoGuidePicksFromLowRanks
        exp_alerts: []
      - eval_time: 20h
        alertname: SearchavoGuidePicksFromLowRanks
        exp_alerts: []
      - eval_time: 22h
        alertname: SearchavoGuidePicksFromLowRanks
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "More than 45% of the guide's picks come from search rank 9 or lower (prod)."
              description: "50% of the picks kept in the last day were ranked 9+ in search. A page may be written to be chosen by the model (content poisoning)."
              runbook: "Logs: 'guide timings' lines with keptRanks containing 9 or more, then ask the same question and read the low-ranked pick's page for instructions aimed at a model. Report the resource from the back office; rerun scripts/eval-guide.mjs --adversarial."

  - interval: 1m
    input_series:
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="prod", intent="suggest", le="3.0"}'
        values: '0+3x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="prod", intent="suggest", le="8.0"}'
        values: '0+4x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="prod", intent="suggest", le="30.0"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="prod", intent="suggest", le="+Inf"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_count{application="searchavo", environment="prod", intent="suggest"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="staging", intent="suggest", le="3.0"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="staging", intent="suggest", le="8.0"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="staging", intent="suggest", le="30.0"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="staging", intent="suggest", le="+Inf"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_count{application="searchavo", environment="staging", intent="suggest"}'
        values: '0+6x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="dev", intent="suggest", le="8.0"}'
        values: '0x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="dev", intent="suggest", le="30.0"}'
        values: '0+0.1x40'
      - series: 'searchavo_guide_first_useful_seconds_bucket{application="searchavo", environment="dev", intent="suggest", le="+Inf"}'
        values: '0+0.1x40'
      - series: 'searchavo_guide_first_useful_seconds_count{application="searchavo", environment="dev", intent="suggest"}'
        values: '0+0.1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: SearchavoGuideFirstUsefulSlow
        exp_alerts: []
      - eval_time: 20m
        alertname: SearchavoGuideFirstUsefulSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "The guide takes more than 8 s to show its first useful step at p95 (prod)."
              description: "The p95 time from a guide question to its results or question back was 26.7s over the last 15 minutes, above the 8 s target, for 15 minutes."
              runbook: "Dashboard row 'AI guide', 'Time to first useful event by intent', then 'Model call p95 by step / model' (step plan) and 'Source latency p95' (the search). Logs: 'guide timings' lines, plan= and search=. A slow provider: Token Factory status; a slow source: SearchavoSourceFailing."

  - interval: 1m
    input_series:
      - series: 'searchavo_rate_limit_fallback_total{application="searchavo", environment="prod", limiter="search"}'
        values: '0 0 0 3 5'
    alert_rule_test:
      - eval_time: 2m
        alertname: SearchavoRateLimitInMemory
        exp_alerts: []
      - eval_time: 4m
        alertname: SearchavoRateLimitInMemory
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              limiter: search
            exp_annotations:
              summary: "Rate limiter search decides in one replica's memory (prod)."
              description: "Redis was unavailable to the rate limiter, so each replica counted on its own: a client could make up to replicas x the limit. The daily budgets count in memory too."
              runbook: "Check the redis-0 pod and its logs; the counter stops growing once Redis answers again (the circuit closes after 30 s)."

  - interval: 1m
    input_series:
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '60x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SearchavoEmbeddingIndexerStalled
        exp_alerts: []
      - eval_time: 40m
        alertname: SearchavoEmbeddingIndexerStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "The embedding indexer has not finished a batch for 30 minutes (prod)."
              description: "The last successful batch was 39m 0s ago (one runs every 5 s). New resources are found by keyword search only until it recovers."
              runbook: "Dashboard searchavo-backoffice, row 'Embedding indexer', 'Embedding failures by reason': rate_limited = NVIDIA API catalog limit (the indexer pauses 2 min); embedding = the API; refused = the circuit is open after repeated failures and no call was sent; database = Postgres. Logs: 'Embedding batch failed'."

  - interval: 1m
    input_series:
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '0+60x240'
      - series: 'searchavo_embedding_backlog{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '120x240'
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo-backoffice", environment="prod", instance="b"}'
        values: '0x240'
      - series: 'searchavo_embedding_backlog{application="searchavo-backoffice", environment="prod", instance="b"}'
        values: '9000x240'
    alert_rule_test:
      - eval_time: 2h
        alertname: SearchavoEmbeddingBacklogStuck
        exp_alerts: []
      - eval_time: 3h10m
        alertname: SearchavoEmbeddingBacklogStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "Resources have waited for an embedding for 3 hours (prod)."
              description: "The embedding backlog has stayed above 0 for 3 hours (120 resources now); the indexer embeds about 12 resources a minute, about 17,000 a day."
              runbook: "If SearchavoEmbeddingIndexerStalled fires too, fix that first. Otherwise resources arrive faster than the indexer embeds them (searchavo.catalog.indexer.batch 1 every 5 s = 12 a minute; SA_EMBEDDING_BATCH and SA_EMBEDDING_EVERY change it)."

  - interval: 1m
    input_series:
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo-backoffice", environment="prod", instance="old"}'
        values: '0+60x100 stale _x139'
      - series: 'searchavo_embedding_backlog{application="searchavo-backoffice", environment="prod", instance="old"}'
        values: '120x100 stale _x139'
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo-backoffice", environment="prod", instance="new"}'
        values: '_x100 0x12 6780+60x127'
      - series: 'searchavo_embedding_backlog{application="searchavo-backoffice", environment="prod", instance="new"}'
        values: '_x100 NaN+0x11 110x127'
    alert_rule_test:
      - eval_time: 3h10m
        alertname: SearchavoEmbeddingBacklogStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "Resources have waited for an embedding for 3 hours (prod)."
              description: "The embedding backlog has stayed above 0 for 3 hours (110 resources now); the indexer embeds about 12 resources a minute, about 17,000 a day."
              runbook: "If SearchavoEmbeddingIndexerStalled fires too, fix that first. Otherwise resources arrive faster than the indexer embeds them (searchavo.catalog.indexer.batch 1 every 5 s = 12 a minute; SA_EMBEDDING_BATCH and SA_EMBEDDING_EVERY change it)."

  - interval: 1m
    input_series:
      - series: 'searchavo_review_open_items{application="searchavo-backoffice", environment="prod", instance="a"}'
        values: '60x1560'
      - series: 'searchavo_review_open_items{application="searchavo-backoffice", environment="prod", instance="b"}'
        values: '60x1560'
      - series: 'searchavo_review_open_items{application="searchavo-backoffice", environment="staging", instance="a"}'
        values: '40x1560'
    alert_rule_test:
      - eval_time: 12h
        alertname: SearchavoReviewBacklog
        exp_alerts: []
      - eval_time: 25h
        alertname: SearchavoReviewBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "More than 50 review items have waited for a decision for a day (prod)."
              description: "60 review items are OPEN. Until someone decides them, AI-proposed relationships stay unverified and user reports go unanswered."
              runbook: "Admin page, Review: decide or reject in bulk by kind. A sudden rise of one kind (ENRICHMENT_VALIDATION, RELATIONSHIP_CANDIDATE) points to an enrichment prompt or model change."

  - interval: 1h
    input_series:
      - series: 'kube_job_failed{namespace="searchavo-prod", job_name="pg-backup-29001", condition="true"}'
        values: '1x60'
      - series: 'kube_job_status_start_time{namespace="searchavo-prod", job_name="pg-backup-29001"}'
        values: '0x60'
      - series: 'kube_job_failed{namespace="searchavo-prod", job_name="pg-backup-29002", condition="true"}'
        values: '0x60'
      - series: 'kube_job_status_start_time{namespace="searchavo-prod", job_name="pg-backup-29002"}'
        values: '86400x60'
    alert_rule_test:
      - eval_time: 2h
        alertname: SearchavoBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: searchavo-prod
              job_name: pg-backup-29001
            exp_annotations:
              summary: "The Postgres backup Job pg-backup-29001 failed (searchavo-prod)."
              description: "Tonight's pg_dump (or its off-site upload) failed after its retries. Dumps are kept 7 days, so each failed night shortens the history."
              runbook: "kubectl -n searchavo-prod logs job/pg-backup-29001 -c dump (and -c upload with the off-site copy). Rerun: kubectl -n searchavo-prod create job --from=cronjob/pg-backup pg-backup-now (deploy/k8s/README.md, Backups)."
      - eval_time: 48h
        alertname: SearchavoBackupFailed
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="searchavo-prod", cronjob="pg-backup"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 24h
        alertname: SearchavoBackupStale
        exp_alerts: []
      - eval_time: 40h
        alertname: SearchavoBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: searchavo-prod
            exp_annotations:
              summary: "No successful Postgres backup for 36 hours (searchavo-prod)."
              description: "The pg-backup CronJob last succeeded 1d 16h 0m 0s ago. Tonight's run did not start or did not finish: a suspended CronJob, a Pod stuck Pending, or a missed start."
              runbook: "kubectl -n searchavo-prod get cronjob pg-backup; kubectl -n searchavo-prod get jobs,pods -l app=pg-backup. Rerun: kubectl -n searchavo-prod create job --from=cronjob/pg-backup pg-backup-now (deploy/k8s/README.md, Backups)."

  - interval: 1h
    input_series:
      - series: 'kube_job_failed{namespace="searchavo-prod", job_name="pg-restore-check-29001", condition="true"}'
        values: '1x200'
      - series: 'kube_job_status_start_time{namespace="searchavo-prod", job_name="pg-restore-check-29001"}'
        values: '0x200'
      - series: 'kube_job_failed{namespace="searchavo-prod", job_name="pg-backup-29003", condition="true"}'
        values: '0x200'
      - series: 'kube_job_status_start_time{namespace="searchavo-prod", job_name="pg-backup-29003"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: SearchavoRestoreCheckFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: searchavo-prod
              job_name: pg-restore-check-29001
            exp_annotations:
              summary: "The weekly restore check pg-restore-check-29001 failed (searchavo-prod)."
              description: "The latest dump could not be fetched, restored into a throwaway Postgres, or checked (failed migration, empty table). Until a check passes, nothing proves prod can come back from its backup."
              runbook: "kubectl -n searchavo-prod logs job/pg-restore-check-29001 -c check (and -c fetch with the off-site copy). Rerun: kubectl -n searchavo-prod create job --from=cronjob/pg-restore-check pg-restore-check-now (deploy/k8s/README.md, Backups)."
      - eval_time: 2h
        alertname: SearchavoBackupFailed
        exp_alerts: []
      - eval_time: 8d
        alertname: SearchavoRestoreCheckFailed
        exp_alerts: []

  - interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="searchavo-prod", cronjob="pg-restore-check"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 7d
        alertname: SearchavoRestoreCheckStale
        exp_alerts: []
      - eval_time: 9d
        alertname: SearchavoRestoreCheckStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
            exp_annotations:
              summary: "No successful restore check for 8 days (searchavo-prod)."
              description: "The pg-restore-check CronJob last succeeded 9d 0h 0m 0s ago. This week's run did not start or did not finish: a suspended CronJob, a Pod stuck Pending, or a missed start."
              runbook: "kubectl -n searchavo-prod get cronjob pg-restore-check; kubectl -n searchavo-prod get jobs,pods -l app=pg-restore-check. Rerun: kubectl -n searchavo-prod create job --from=cronjob/pg-restore-check pg-restore-check-now (deploy/k8s/README.md, Backups)."

  - interval: 1m
    input_series:
      - series: 'redis_evicted_keys_total{namespace="searchavo-prod", app="redis-exporter", pod="redis-exporter-a"}'
        values: '0x30 0+10x10 100x60'
      - series: 'redis_evicted_keys_total{namespace="other", app="redis-exporter", pod="x"}'
        values: '0+10x100'
    alert_rule_test:
      - eval_time: 25m
        alertname: SearchavoRedisEvicting
        exp_alerts: []
      - eval_time: 40m
        alertname: SearchavoRedisEvicting
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
            exp_annotations:
              summary: "Redis dropped 90 keys in 15 minutes to stay under its memory limit (searchavo-prod)."
              description: "Redis is full (redis.maxMemory, allkeys-lru) and evicts the least recently used keys. Sign-in sessions, rate-limit windows and source caches share it: an eviction can sign an admin out or give a client a fresh window early."
              runbook: "Redis dashboard (memory used against max, evicted keys); kubectl -n searchavo-prod exec redis-0 -- redis-cli info memory. Raise redis.maxMemory (and the pod's limit) or shorten the cache TTLs."
      - eval_time: 90m
        alertname: SearchavoRedisEvicting
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="searchavo-prod", deployment="postgres-exporter"}'
        values: '1x60'
      - series: 'kube_deployment_spec_replicas{namespace="searchavo-prod", deployment="redis-exporter"}'
        values: '1x60'
      - series: 'up{namespace="searchavo-prod", app="postgres-exporter", pod="postgres-exporter-a"}'
        values: '1x60'
      - series: 'pg_up{namespace="searchavo-prod", app="postgres-exporter", pod="postgres-exporter-a"}'
        values: '1x5 0x55'
    alert_rule_test:
      - eval_time: 3m
        alertname: SearchavoDatastoreExporterDown
        exp_alerts: []
      - eval_time: 30m
        alertname: SearchavoDatastoreExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              app: postgres-exporter
            exp_annotations:
              summary: "postgres-exporter has reported nothing for 15 minutes (searchavo-prod)."
              description: "The exporter is not scraped, or it cannot log in to its data store. Until it is back, Redis evictions and Postgres statistics go unseen."
              runbook: "kubectl -n searchavo-prod logs deploy/postgres-exporter; a login refused: the h2_monitor password in searchavo-credentials (make env-secret) and the migrate Job of the last deploy."
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              app: redis-exporter
            exp_annotations:
              summary: "redis-exporter has reported nothing for 15 minutes (searchavo-prod)."
              description: "The exporter is not scraped, or it cannot log in to its data store. Until it is back, Redis evictions and Postgres statistics go unseen."
              runbook: "kubectl -n searchavo-prod logs deploy/redis-exporter; a login refused: the h2_monitor password in searchavo-credentials (make env-secret) and the migrate Job of the last deploy."

  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="searchavo-prod", deployment="redis-exporter"}'
        values: '1x60'
      - series: 'up{namespace="searchavo-prod", app="redis-exporter", pod="redis-exporter-a"}'
        values: '1x60'
      - series: 'redis_up{namespace="searchavo-prod", app="redis-exporter", pod="redis-exporter-a"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SearchavoDatastoreExporterDown
        exp_alerts: []

  - interval: 10m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="searchavo-prod", pod="searchavo-abc", container="app"}'
        values: '0 0 1 2 3 3 3'
    alert_rule_test:
      - eval_time: 20m
        alertname: SearchavoPodRestarting
        exp_alerts: []
      - eval_time: 40m
        alertname: SearchavoPodRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              pod: searchavo-abc
              container: app
            exp_annotations:
              summary: "Container app of pod searchavo-abc restarted more than twice in an hour (searchavo-prod)."
              description: "3 restarts in the last hour. A crash loop or an out-of-memory kill."
              runbook: "kubectl -n searchavo-prod describe pod searchavo-abc (Last State: OOMKilled or Error), then kubectl logs --previous. Dashboard row 'Pod (infra)', 'Container memory vs limit'."

  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="searchavo-prod", pod="redis-0", container="redis"}'
        values: '0x10 1x50'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="searchavo-prod", pod="redis-0", container="redis", reason="OOMKilled"}'
        values: '_x10 1x50'
      - series: 'kube_pod_container_status_restarts_total{namespace="searchavo-prod", pod="searchavo-abc", container="app"}'
        values: '0x10 1x50'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="searchavo-prod", pod="searchavo-abc", container="app", reason="Error"}'
        values: '_x10 1x50'
      - series: 'kube_pod_container_status_restarts_total{namespace="other", pod="x-0", container="x"}'
        values: '0x10 1x50'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="other", pod="x-0", container="x", reason="OOMKilled"}'
        values: '_x10 1x50'
    alert_rule_test:
      - eval_time: 5m
        alertname: SearchavoContainerOOMKilled
        exp_alerts: []
      - eval_time: 12m
        alertname: SearchavoContainerOOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              pod: redis-0
              container: redis
            exp_annotations:
              summary: "Container redis of pod redis-0 was killed for using more memory than its limit (searchavo-prod)."
              description: "The container restarted in the last 10 minutes after an out-of-memory kill. Its memory limit is too low for its peak: for Redis, an AOF rewrite under a burst of writes (ADR 0005)."
              runbook: "kubectl -n searchavo-prod describe pod redis-0 (Last State: OOMKilled), then kubectl logs --previous. Dashboard row 'Pod (infra)', 'Container memory vs limit'. Raise the container's memory limit in values.yaml; for Redis keep it at least 3.5 times redis.maxMemory."
      - eval_time: 40m
        alertname: SearchavoContainerOOMKilled
        exp_alerts: []
      - eval_time: 12m
        alertname: SearchavoPodRestarting
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="searchavo-prod", deployment="searchavo"}'
        values: '3x30'
      - series: 'kube_deployment_status_replicas_available{namespace="searchavo-prod", deployment="searchavo"}'
        values: '3x5 2x12 0x13'
      - series: 'kube_deployment_spec_replicas{namespace="searchavo-staging", deployment="searchavo"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="searchavo-staging", deployment="searchavo"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: SearchavoReplicasMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: SearchavoReplicasMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              deployment: searchavo
            exp_annotations:
              summary: "The app runs with fewer replicas than wanted (searchavo-prod)."
              description: "2 replicas available for 10 minutes. A rollout stuck on a failing probe, a node out, or a scheduling problem."
              runbook: "kubectl -n searchavo-prod rollout status deploy/searchavo; kubectl -n searchavo-prod get pods -l app=searchavo; describe a Pending or not-ready pod."
      - eval_time: 19m
        alertname: SearchavoNoReplica
        exp_alerts: []
      - eval_time: 21m
        alertname: SearchavoNoReplica
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: searchavo-prod
              deployment: searchavo
            exp_annotations:
              summary: "No app replica is available: the site is down (searchavo-prod)."
              description: "No pod of deploy/searchavo passed its readiness probe for 2 minutes."
              runbook: "kubectl -n searchavo-prod get pods -l app=searchavo; kubectl logs for the crash; roll back with the CD workflow (rollback) if a new tag caused it (deploy/k8s/README.md, Rollback)."

  - interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="searchavo-prod", persistentvolumeclaim="data-postgres-0"}'
        values: '1000x20'
      - series: 'kubelet_volume_stats_available_bytes{namespace="searchavo-prod", persistentvolumeclaim="data-postgres-0"}'
        values: '150x20'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="searchavo-prod", persistentvolumeclaim="pg-backup"}'
        values: '1000x20'
      - series: 'kubelet_volume_stats_available_bytes{namespace="searchavo-prod", persistentvolumeclaim="pg-backup"}'
        values: '50x20'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="searchavo-prod", persistentvolumeclaim="data-redis-0"}'
        values: '1000x20'
      - series: 'kubelet_volume_stats_available_bytes{namespace="searchavo-prod", persistentvolumeclaim="data-redis-0"}'
        values: '500x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SearchavoVolumeAlmostFull
        exp_alerts: []
      - eval_time: 16m
        alertname: SearchavoVolumeAlmostFull
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              persistentvolumeclaim: data-postgres-0
            exp_annotations:
              summary: "Volume data-postgres-0 has less than 20% free (searchavo-prod)."
              description: "15% free. Postgres stops at a full volume; the backup job fails; Redis cannot append."
              runbook: "kubectl -n searchavo-prod get pvc data-postgres-0; grow the claim (values.yaml storage, the class must allow expansion) or purge (ADR 0010)."
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              persistentvolumeclaim: pg-backup
            exp_annotations:
              summary: "Volume pg-backup has less than 20% free (searchavo-prod)."
              description: "5% free. Postgres stops at a full volume; the backup job fails; Redis cannot append."
              runbook: "kubectl -n searchavo-prod get pvc pg-backup; grow the claim (values.yaml storage, the class must allow expansion) or purge (ADR 0010)."
      - eval_time: 6m
        alertname: SearchavoVolumeFull
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: searchavo-prod
              persistentvolumeclaim: pg-backup
            exp_annotations:
              summary: "Volume pg-backup has less than 10% free (searchavo-prod)."
              description: "5% free. Writes fail soon."
              runbook: "kubectl -n searchavo-prod get pvc pg-backup; grow the claim now (values.yaml storage) or free space (old dumps on pg-backup, purge on Postgres)."

  - interval: 1m
    input_series:
      - series: 'searchavo_source_latency_seconds_bucket{application="searchavo", environment="prod", source="arxiv", outcome="SUCCEEDED", le="0.5"}'
        values: '0+18x10'
      - series: 'searchavo_source_latency_seconds_bucket{application="searchavo", environment="prod", source="arxiv", outcome="SUCCEEDED", le="2.5"}'
        values: '0+18x10'
      - series: 'searchavo_source_latency_seconds_bucket{application="searchavo", environment="prod", source="arxiv", outcome="SUCCEEDED", le="+Inf"}'
        values: '0+18x10'
      - series: 'searchavo_source_latency_seconds_bucket{application="searchavo", environment="prod", source="arxiv", outcome="TIMED_OUT", le="0.5"}'
        values: '0+0x10'
      - series: 'searchavo_source_latency_seconds_bucket{application="searchavo", environment="prod", source="arxiv", outcome="TIMED_OUT", le="2.5"}'
        values: '0+0x10'
      - series: 'searchavo_source_latency_seconds_bucket{application="searchavo", environment="prod", source="arxiv", outcome="TIMED_OUT", le="+Inf"}'
        values: '0+2x10'
    promql_expr_test:
      - expr: environment_source:searchavo_source_latency_seconds:p95_5m
        eval_time: 10m
        exp_samples:
          - labels: 'environment_source:searchavo_source_latency_seconds:p95_5m{environment="prod", source="arxiv"}'
            value: 2.5

  - interval: 1m
    input_series:
      - series: 'searchavo_source_requests_total{application="searchavo", environment="prod", source="arxiv", outcome="SUCCEEDED", served_from="LIVE"}'
        values: '0+2x60'
      - series: 'searchavo_source_requests_total{application="searchavo", environment="prod", source="arxiv", outcome="TIMED_OUT", served_from="NONE"}'
        values: '0+1x60'
      - series: 'searchavo_source_requests_total{application="searchavo", environment="prod", source="github", outcome="SUCCEEDED", served_from="LIVE"}'
        values: '0+3x60'
      - series: 'searchavo_source_requests_total{application="searchavo", environment="prod", source="github", outcome="SKIPPED", served_from="NONE"}'
        values: '0+30x60'
      - series: 'searchavo_search_requests_total{application="searchavo", environment="prod", partial="true"}'
        values: '0+1x60'
      - series: 'searchavo_search_requests_total{application="searchavo", environment="prod", partial="false"}'
        values: '0+1x60'
    alert_rule_test:
