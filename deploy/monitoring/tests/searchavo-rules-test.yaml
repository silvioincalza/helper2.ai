        alertname: SearchavoSourceFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              source: arxiv
            exp_annotations:
              summary: "Source arxiv fails on more than 20% of searches (prod)."
              description: "33.33% of the calls to arxiv failed, timed out or were rate limited over the last 15 minutes. Searches still answer, without that source or from its stale cache."
              runbook: "Dashboard panels 'Source failures (FAILED, TIMED_OUT, RATE_LIMITED)' and 'Outbound HTTP errors by host'. TIMED_OUT: the provider is slow; RATE_LIMITED: check the token or quota of that provider; FAILED: row Logs, search for the source id."
      - eval_time: 60m
        alertname: SearchavoPartialSearches
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'searchavo_search_requests_total{application="searchavo", environment="prod", partial="true"}'
        values: '0+3x90'
      - series: 'searchavo_search_requests_total{application="searchavo", environment="prod", partial="false"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: SearchavoPartialSearches
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "More than half of the searches on searchavo (prod) return partial results."
              description: "75% of the searches of the last 30 minutes missed at least one source, for 30 minutes."
              runbook: "Find the source with SearchavoSourceFailing or the panel 'Source outcomes'; a source SKIPPED on every search (cooldown, daily limit, missing token) also makes every search partial."

  - interval: 1m
    input_series:
      - series: 'searchavo_cache_events_total{application="searchavo", environment="prod", event="error"}'
        values: '0+1x30'
