        alertname: SearchavoCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              name: collector-hf-trending
            exp_annotations:
              summary: "Circuit collector-hf-trending has not closed for 5 minutes (prod)."
              description: "The resilience policy collector-hf-trending keeps refusing calls (ADR 0006): source-* is SKIPPED in searches, collector-* fails its Scout runs, redis means the cache, budgets and rate limits run without Redis, llm-chat means queries run untranslated and the setup guide is unavailable, llm-chat-guide-fast means guide questions get no plan and answer with top search results, llm-chat-guide-reasoning means guide answers are top search results (both also when the model answers but too slowly), llm-embed means search runs without the meaning-based index, llm-embed-index means the embedding indexer stalls while search queries still embed."
              runbook: "Dashboard row 'Search and sources' (source outcomes) or the Redis pod for name=redis. A source-* circuit: check the provider's status and its outbound HTTP errors; it closes by itself once a trial call succeeds (every 30 s)."

  - interval: 1h
    input_series:
      - series: 'searchavo_scout_run_seconds_count{application="searchavo-backoffice", environment="prod", source="hf-trending", status="failed", error="IOException"}'
        values: '0 1 1 1 1 1'
      - series: 'searchavo_scout_run_seconds_count{application="searchavo-backoffice", environment="prod", source="mcp-registry", status="failed", error="IOException"}'
        values: '0 1 1 1 1 1'
      - series: 'searchavo_scout_run_seconds_count{application="searchavo-backoffice", environment="prod", source="npm", status="succeeded", error="none"}'
        values: '0 1 1 1 1 1'
      - series: 'searchavo_scout_run_seconds_count{application="searchavo", environment="prod", source="pypi", status="failed", error="IOException"}'
        values: '0 1 1 1 1 1'
      - series: 'searchavo_scout_run_seconds_count{application="searchavo-backoffice", environment="prod", source="pypi", status="failed", error="IOException"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 2h
        alertname: SearchavoScoutRunsFailing
        exp_alerts: []
      - eval_time: 4h
        alertname: SearchavoScoutRunsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
            exp_annotations:
              summary: "3 Scout collectors failed in the last 24 hours (prod)."
              description: "Several collectors failed on the same day, so the cause is likely one they share: the model provider, Tavily, GitHub or the database."
              runbook: "Dashboard searchavo-backoffice, row Scout, 'Run failures by error' (the error tag names the exception). Admin back office, Scout runs: the message of each failed run. Then the provider's status page; SearchavoCircuitOpen for the collector-<id> policies."

  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="searchavo-prod", deployment="searchavo-backoffice"}'
        values: '1x5 0x25'
      - series: 'kube_deployment_status_replicas_available{namespace="searchavo-staging", deployment="searchavo-backoffice"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SearchavoBackofficeDown
        exp_alerts: []
      - eval_time: 22m
        alertname: SearchavoBackofficeDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: searchavo-prod
              deployment: searchavo-backoffice
            exp_annotations:
              summary: "No back office replica is available (searchavo-prod)."
              description: "No pod of deploy/searchavo-backoffice passed its readiness probe for 15 minutes. The Scout, the embedding indexer and the admin pages are stopped; the public site keeps answering."
              runbook: "kubectl -n searchavo-prod get pods -l app=searchavo-backoffice; kubectl -n searchavo-prod logs deploy/searchavo-backoffice -c backoffice; roll back with the CD workflow if a new tag caused it."

  - interval: 1m
    input_series:
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo", environment="prod", instance="pub"}'
        values: '0x60'
      - series: 'searchavo_embedding_last_success_seconds{application="searchavo-backoffice", environment="prod", instance="bo"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: SearchavoEmbeddingIndexerStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'searchavo_catalog_observations_total{application="searchavo", environment="prod", instance="a", outcome="dropped"}'
        values: '0+1x30'
      - series: 'searchavo_catalog_observations_total{application="searchavo", environment="prod", instance="a", outcome="failed"}'
        values: '0 0 0 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4'
      - series: 'searchavo_catalog_observations_total{application="searchavo", environment="prod", instance="a", outcome="written"}'
        values: '0+9x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: SearchavoObservationsLost
        exp_alerts: []
      - eval_time: 20m
        alertname: SearchavoObservationsLost
        exp_alerts:
          - exp_labels:
              severity: warning
              environment: prod
              outcome: dropped
            exp_annotations:
              summary: "Search results are not written to the catalog (dropped) on searchavo (prod)."
              description: "Background writes of search results have ended as dropped for 10 minutes. Searches still answer, but the results they found live are not stored: they get no discovery date and the catalog cannot find them later."
              runbook: "dropped = the queue of 256 writes is full (searchavo_catalog_observations_queued): one thread writes, so look for slow Postgres writes or a burst of searches. failed = the write threw: logs 'Recording search results failed', then the Postgres pod."
