# On every response of the web image, errors included (ADR 0069). The files are scripts, styles, fonts and an icon:
# opened on their own they may run nothing and load nothing. Inline style only for the SVG icon's colours.
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; sandbox" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Referrer-Policy "no-referrer" always;
