# The web image's nginx (deploy/web.Dockerfile, ADR 0069). Static files only, GET and HEAD only:
#   /assets/<file>          Vite's content-hashed files: public, a year, immutable
#   /theme.js, /favicon.svg the root files of frontend/public: public, 5 minutes, then revalidated (ETag)
#   anything else           404, plain text, no-store: never index.html, never a directory listing
# The built shell (/usr/share/helper2/shell/index.html) is outside the served folder.
# No access log and no per-request error lines: the web image keeps no record of visitors or their addresses
# (Privacy page). Only critical errors and startup failures reach the log.
# Read-only root filesystem: the pid file and every temp path are under /tmp (an emptyDir in the cluster).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript image/svg+xml;

  server_tokens off;
  access_log off;
  log_not_found off;
  autoindex off;
  disable_symlinks on;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /srv/web;
    # Every answer carries the headers, also the ones nginx writes itself (400, 414, 494, 500): a location that adds
    # Cache-Control includes them again, because add_header in a location drops the server's.
    include /etc/nginx/helper2-headers.conf;
    error_page 404 @missing;
    error_page 405 @method;

    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # One file name directly under /assets/; a deeper path, /assets or /assets/ is a 404.
    location ~ ^/assets/[A-Za-z0-9_.-]+$ {
      include /etc/nginx/helper2-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location = /theme.js {
      include /etc/nginx/helper2-headers.conf;
      add_header Cache-Control "public, max-age=300, must-revalidate";
      try_files $uri =404;
    }

    location = /favicon.svg {
      include /etc/nginx/helper2-headers.conf;
      add_header Cache-Control "public, max-age=300, must-revalidate";
      try_files $uri =404;
    }

    location / {
      return 404;
    }

    # The error answers: plain text whatever the address's extension (empty types), never cached. An address that
    # climbs above the root (/../x) is refused while the request is read, before any location: nginx's own 400.
    location @missing {
      include /etc/nginx/helper2-headers.conf;
      add_header Cache-Control "no-store" always;
      types { }
      default_type text/plain;
      return 404 "Not found\n";
    }

    location @method {
      include /etc/nginx/helper2-headers.conf;
      add_header Cache-Control "no-store" always;
      add_header Allow "GET, HEAD" always;
      types { }
      default_type text/plain;
      return 405 "Method not allowed\n";
    }

  }

  # The probes (startup, readiness, liveness). The Service does not route this port.
  server {
    listen 8081;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }
}
