<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}a{color:#6d28d9}a:hover{color:#3b1d8f}</style>
</helmet>
<div style="background: #faf8ff; color: #14121a; font-family: Inter, system-ui, sans-serif; min-height: 100vh">
<dc-import name="S-Header" box="{{yes}}" active="Admin" admin="{{yes}}" query="" hint-size="100%,170px"></dc-import>
<main style="max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.05">Admin</h1>
<section aria-labelledby="rq-h" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h2 id="rq-h" style="margin: 0; font-size: 20px; font-weight: 650">Review queue</h2>
<div role="group" aria-label="Status" style="display: flex; gap: 6px">
<button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #14121a; color: #ffffff; font: 500 13px Inter, sans-serif">Open 3</button>
<button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #f3effc; color: #3b1d8f; font: 500 13px Inter, sans-serif">Resolved</button>
</div>
</div>
<sc-for list="{{items}}" as="i" hint-placeholder-count="3">
<article style="background: #ffffff; border: 1px solid #e4def5; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid #7a3e00; color: #7a3e00">{{i.badge}}</span>
<span style="font-size: 13px; color: #514c5e">{{i.why}}</span>
</div>
<h3 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 17px"><a href="S-Resource.dc.html" style="color: #14121a; text-decoration: none">{{i.name}}</a> · <span style="font-family: Inter, sans-serif; font-weight: 600; font-size: 15px">{{i.field}}</span></h3>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 20px; font-size: 14px">
<sc-for list="{{i.values}}" as="v" hint-placeholder-count="2"><div><dt style="color: #514c5e; font-size: 13px">{{v.src}}</dt><dd style="margin: 0">{{v.val}}</dd></div></sc-for>
</dl>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #7c3aed; color: #ffffff; font: 600 13px Inter, sans-serif">Accept</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9bfe8; background: #ffffff; font: 500 13px Inter, sans-serif">Reject</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9bfe8; background: #ffffff; font: 500 13px Inter, sans-serif">Mark unknown</button>
</div>
</article>
</sc-for>
</section>
<section aria-labelledby="sr-h" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h2 id="sr-h" style="margin: 0; font-size: 20px; font-weight: 650">Scout runs</h2>
<button type="button" style="margin-left: auto; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #c9bfe8; background: #ffffff; font: 500 14px Inter, sans-serif">Run the Scout now</button>
</div>
<div style="overflow-x: auto; background: #ffffff; border: 1px solid #e4def5; border-radius: 14px">
<table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px">
<thead><tr>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 1px solid #e4def5; color: #514c5e; font-weight: 600">Source</th>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 1px solid #e4def5; color: #514c5e; font-weight: 600">Started</th>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 1px solid #e4def5; color: #514c5e; font-weight: 600">Outcome</th>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 1px solid #e4def5; color: #514c5e; font-weight: 600">Found</th>
<th scope="col" style="text-align: left; padding: 12px 16px; border-bottom: 1px solid #e4def5; color: #514c5e; font-weight: 600">Sent to review</th>
</tr></thead>
<tbody>
<sc-for list="{{runs}}" as="r" hint-placeholder-count="4">
<tr>
<th scope="row" style="text-align: left; padding: 12px 16px; border-bottom: 1px solid #efeaf9; font-family: 'JetBrains Mono', monospace; font-weight: 500">{{r.src}}</th>
<td style="padding: 12px 16px; border-bottom: 1px solid #efeaf9; color: #3d3949">{{r.at}}</td>
<td style="padding: 12px 16px; border-bottom: 1px solid #efeaf9; color: {{r.color}}">{{r.out}}</td>
<td style="padding: 12px 16px; border-bottom: 1px solid #efeaf9">{{r.found}}</td>
<td style="padding: 12px 16px; border-bottom: 1px solid #efeaf9">{{r.review}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
items: [
{ badge: '⚠ Conflicting', why: 'Two sources disagree', name: '[resource name]', field: 'License', values: [{ src: 'GitHub', val: 'MIT' }, { src: 'npm registry', val: 'Apache-2.0' }] },
{ badge: '? Unverified', why: 'AI Resource Scout proposed it; no exact quote in the source', name: '[resource name]', field: 'Use case: research', values: [{ src: 'Proposed by the model', val: 'research' }, { src: 'Evidence', val: 'No matching excerpt found' }] },
{ badge: '⚠ Reported', why: 'A visitor reported wrong information', name: 'mcp-postgres', field: 'Description', values: [{ src: 'Report', val: '[Report text as written by the visitor]' }, { src: 'Current value', val: 'Model Context Protocol server for PostgreSQL database operations' }] }
],
runs: [
{ src: 'mcp-registry', at: 'Oct 26, 2026, 1:00 AM UTC', out: '✓ Succeeded', color: '#0f4d3c', found: '[n] new', review: '[n]' },
{ src: 'hf-trending', at: 'Oct 26, 2026, 12:00 AM UTC', out: '✓ Succeeded', color: '#0f4d3c', found: '[n] new', review: '[n]' },
{ src: 'tavily-scout', at: 'Oct 22, 2026, 12:00 AM UTC', out: '⏸ Skipped: no H2_TAVILY_API_KEY', color: '#7a3e00', found: '—', review: '—' },
{ src: 'arxiv', at: 'Oct 25, 2026, 6:00 PM UTC', out: '✕ Failed: rate limited', color: '#b42318', found: '0', review: '0' }
]
};
}
}
</script>
</body>
</html>
