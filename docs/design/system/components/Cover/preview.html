<div class="cv">
<style>
.cv{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;left:480px;top:0}
.cv .ac{fill:var(--accent)}
.cv .ink{fill:var(--selected)}
.cv .tint{fill:var(--tag-paper-bg)}
.cv .amb{fill:var(--tag-model-bg)}
.cv .blu{fill:var(--tag-news-bg)}
.cv .dot{fill:var(--accent-deep)}
.cv .txt{position:absolute;left:48px;bottom:44px;max-width:440px;display:flex;flex-direction:column;gap:12px}
.cv h1{margin:0;font:400 64px/0.95 var(--font-display);color:var(--ink)}
.cv p{margin:0;font:400 14px/20px var(--font-sans);color:var(--muted)}
</style>
<!--
blocks: accent 200×300 slab (radius-xl corners), selected 120×132, paper tint 120×148, model tint 152×96, news tint 152×180 — weighted to accent
arrangement: one tall violet slab with satellites, the right pair bleeding off the top and right edges
pattern: discs and pills from radius-pill — the system is soft and chip-driven (pills, tags, badges); pills at space-2 pitch over the slab
scales: gaps space-4 (16), corners radius-xl (18) and radius-pill (half the short side), pill 8×28 at space-3 rhythm
-->
